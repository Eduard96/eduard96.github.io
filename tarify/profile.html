<style>
  :root{
    --bg:#F6F8F7; --surface:#FFFFFF; --ink:#14201B; --ink-soft:#5A6A63;
    --accent:#E8792A; --accent-dark:#C85F17; --teal:#1F6F5C; --teal-light:#E4F0EC;
    --border:#DFE6E2; --radius:10px; --maxw:1180px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Manrope',sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased;}
  h1,h2,h3{font-family:'Space Grotesk',sans-serif;margin:0;letter-spacing:-0.01em;}
  a{color:inherit;text-decoration:none;}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 24px;}
  :focus-visible{outline:2px solid var(--teal);outline-offset:2px;}

  header.site{border-bottom:1px solid var(--border);background:var(--surface);position:sticky;top:0;z-index:40;}
  .headbar{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;gap:16px;}
  .brand{display:flex;align-items:center;gap:10px;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:20px;}
  .brand-mark{width:30px;height:30px;border-radius:8px;background:var(--ink);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .brand-mark svg{width:16px;height:16px;}
  .langsw{display:flex;gap:2px;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:2px;}
  .langsw button{border:none;background:transparent;font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;padding:6px 9px;border-radius:6px;cursor:pointer;color:var(--ink-soft);}
  .langsw button.active{background:var(--ink);color:#fff;}
  .cta-btn{background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;font-weight:600;font-size:14px;white-space:nowrap;}
  .cta-btn:hover{background:var(--teal);}

  .back-link{display:inline-block;margin:22px 0 8px;color:var(--ink-soft);font-size:14px;font-weight:600;}
  .back-link:hover{color:var(--ink);}

  .profile-head{display:flex;gap:20px;align-items:center;padding:20px 0 26px;flex-wrap:wrap;}
  .avatar-lg{width:80px;height:80px;border-radius:50%;background:var(--teal);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:26px;font-family:'Space Grotesk',sans-serif;flex-shrink:0;}
  .profile-name{font-size:28px;}
  .profile-handle{color:var(--ink-soft);font-size:15px;margin-top:2px;}
  .profile-bio{margin-top:8px;font-size:14.5px;color:var(--ink-soft);max-width:60ch;}
  .niche-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
  .niche-tag{font-size:12px;background:var(--surface);border:1px solid var(--border);color:var(--ink-soft);padding:4px 10px;border-radius:12px;}
  .platform-tag{font-size:12px;background:var(--teal-light);color:var(--teal);border:none;padding:4px 10px;border-radius:12px;font-weight:600;}

  .content-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:24px;padding-bottom:70px;align-items:start;}
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:22px;margin-bottom:22px;}
  .panel h2{font-size:17px;margin-bottom:16px;}

  .stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;}
  .stat-box{background:var(--bg);border-radius:8px;padding:14px;}
  .stat-box .num{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:20px;}
  .stat-box .label{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}

  .audience-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:14px;}
  .audience-row:last-child{border-bottom:none;}
  .audience-row span:first-child{color:var(--ink-soft);}
  .audience-row span:last-child{font-weight:600;font-family:'IBM Plex Mono',monospace;}
  .gender-bar{height:8px;border-radius:4px;background:var(--border);overflow:hidden;display:flex;margin-top:6px;margin-bottom:14px;}
  .gender-bar .f{background:var(--accent);height:100%;}
  .gender-bar .m{background:var(--teal);height:100%;}
  .gender-legend{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-soft);}

  .hashtag-list{display:flex;flex-wrap:wrap;gap:8px;}
  .hashtag{font-family:'IBM Plex Mono',monospace;font-size:13px;background:var(--bg);padding:5px 10px;border-radius:6px;color:var(--teal);}

  .collab-list{display:flex;flex-wrap:wrap;gap:8px;}
  .collab-tag{font-size:13px;background:var(--surface);border:1px solid var(--border);padding:5px 11px;border-radius:8px;color:var(--ink);font-weight:600;}
  .collab-empty{font-size:13.5px;color:var(--ink-soft);}

  .rate-row{display:flex;align-items:baseline;gap:8px;padding:11px 0;border-bottom:1px dotted var(--border);}
  .rate-row:last-child{border-bottom:none;}
  .rate-label{font-size:15px;color:var(--ink);font-weight:600;white-space:nowrap;}
  .rate-fill{flex:1;border-bottom:1px dotted var(--border);transform:translateY(-5px);}
  .rate-price{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:18px;color:var(--accent-dark);white-space:nowrap;}
  .barter-note{margin-top:14px;background:var(--teal-light);color:var(--teal);padding:9px 12px;border-radius:8px;font-size:13.5px;font-weight:600;}

  .contact-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);font-size:14px;}
  .contact-row:last-child{border-bottom:none;}
  .contact-row span:first-child{color:var(--ink-soft);}
  .contact-row span:last-child{font-family:'IBM Plex Mono',monospace;font-weight:600;}

  .notfound{padding:80px 20px;text-align:center;color:var(--ink-soft);}

  footer.site{border-top:1px solid var(--border);padding:26px 0;text-align:center;font-size:13px;color:var(--ink-soft);}

  @media (max-width:860px){
    .content-grid{grid-template-columns:1fr;}
    .stat-grid{grid-template-columns:1fr 1fr;}
  }
</style>

function loadData(){
  const stored = localStorage.getItem('tarify_influencers');
  if(!stored){ localStorage.setItem('tarify_influencers', JSON.stringify(SEED)); return SEED.slice(); }
  try{ return JSON.parse(stored); }catch(e){ return SEED.slice(); }
}
const DATA = loadData();

function currencySymbol(cur){ return cur==='USD' ? '$' : cur==='RUB' ? '₽' : cur==='AMD' ? '֏' : cur; }
function initials(name){ return name.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase(); }

function getIdFromUrl(){
  const params = new URLSearchParams(window.location.search);
  return parseInt(params.get('id'));
}

          <div class="stat-grid">
            <div class="stat-box"><div class="num">${inf.followers.toLocaleString()}</div><div class="label">${dict.label_followers}</div></div>
            <div class="stat-box"><div class="num">${inf.avgViews.toLocaleString()}</div><div class="label">${dict.label_avgviews}</div></div>
            <div class="stat-box"><div class="num">${inf.avgLikes.toLocaleString()}</div><div class="label">${dict.label_avglikes}</div></div>
            <div class="stat-box"><div class="num">${inf.avgShares.toLocaleString()}</div><div class="label">${dict.label_avgshares}</div></div>
          </div>
        </div>

        <div class="panel">
          <h2>${dict.audience_title}</h2>
          <div class="gender-bar">
            <div class="f" style="width:${inf.audFemale}%"></div>
            <div class="m" style="width:${inf.audMale}%"></div>
          </div>
          <div class="gender-legend"><span>${dict.female} ${inf.audFemale}%</span><span>${dict.male} ${inf.audMale}%</span></div>
          <div class="audience-row"><span>${dict.audience_age}</span><span>${inf.audAge}</span></div>
          <div class="audience-row"><span>${dict.audience_geo}</span><span>${inf.audGeo.join(', ')}</span></div>
        </div>

        <div class="panel">
          <h2>${dict.hashtags_title}</h2>
          <div class="hashtag-list">${inf.hashtags.map(h=>`<span class="hashtag">#${h}</span>`).join('')}</div>
        </div>

        <div class="panel">
          <h2>${dict.collabs_title}</h2>
          ${(inf.pastCollabs && inf.pastCollabs.length)
            ? `<div class="collab-list">${inf.pastCollabs.map(c=>`<span class="collab-tag">${c}</span>`).join('')}</div>`
            : `<div class="collab-empty">—</div>`}
        </div>
      </div>

      <div>
        <div class="panel">
          <h2>${dict.prices_title}</h2>
          <div class="rate-row"><span class="rate-label">${dict.format_story}</span><span class="rate-fill"></span><span class="rate-price">${sym}${inf.prices.story}</span></div>
          <div class="rate-row"><span class="rate-label">${dict.format_post}</span><span class="rate-fill"></span><span class="rate-price">${sym}${inf.prices.post}</span></div>
          <div class="rate-row"><span class="rate-label">${dict.format_reel}</span><span class="rate-fill"></span><span class="rate-price">${sym}${inf.prices.reel}</span></div>
          ${inf.barter ? `<div class="barter-note">${dict.barter_note}</div>` : ''}
        </div>

        <div class="panel">
          <h2>${dict.contacts_title}</h2>
          ${inf.contacts.telegram ? `<div class="contact-row"><span>Telegram</span><span>${inf.contacts.telegram}</span></div>` : ''}
          ${inf.contacts.whatsapp ? `<div class="contact-row"><span>WhatsApp</span><span>${inf.contacts.whatsapp}</span></div>` : ''}
          ${inf.contacts.instagram ? `<div class="contact-row"><span>Instagram</span><span>${inf.contacts.instagram}</span></div>` : ''}
          ${inf.contacts.email ? `<div class="contact-row"><span>Email</span><span>${inf.contacts.email}</span></div>` : ''}
        </div>
      </div>
    </div>
  `;
}

document.querySelectorAll('.langsw button').forEach(b=>{
  b.addEventListener('click', ()=>{
    lang = b.dataset.lang;
    localStorage.setItem('tarify_lang', lang);
    render();
  });
});

render();
</script>
</body>
</html>
