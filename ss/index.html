<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#7c3aed">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Субтитры">
<title>Студия субтитров</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%237c3aed'/%3E%3Cstop offset='1' stop-color='%23ec4899'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Ccircle cx='32' cy='32' r='13' fill='none' stroke='%23fff' stroke-width='5'/%3E%3Ccircle cx='32' cy='32' r='5' fill='%23fff'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f4f3fb; --card:#ffffff; --ink:#1b1736; --mute:#6b6a85; --line:#e4e2f2; --chip:#efecfb;
  --acc:#7c3aed; --acc2:#ec4899; --danger:#ef4444; --ok:#10b981; --blue:#3b82f6;
  --shadow:0 8px 30px rgba(60,40,120,.10);
  --r:18px;
}
:root[data-theme="dark"]{
  --bg:#0e0c1c; --card:#171430; --ink:#f1efff; --mute:#9a97bd; --line:#2a2650; --chip:#221e44;
  --shadow:0 8px 30px rgba(0,0,0,.45);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;-webkit-text-size-adjust:100%}
body{
  margin:0;min-height:100vh;min-height:100dvh;color:var(--ink);
  font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans Armenian",sans-serif;
  background:
    radial-gradient(900px 500px at 8% -10%,rgba(124,58,237,.18),transparent 60%),
    radial-gradient(800px 500px at 100% 0%,rgba(236,72,153,.14),transparent 60%),
    var(--bg);
  background-attachment:fixed;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.app{max-width:1240px;margin:0 auto;padding:12px 14px 28px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 2px 14px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;letter-spacing:-.02em}
.logo i{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;color:#fff;font-style:normal;
  background:linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:0 6px 16px rgba(124,58,237,.4)}
.logo small{display:block;font-weight:500;font-size:12px;color:var(--mute);letter-spacing:0}
.icon-btn{width:42px;height:42px;border-radius:13px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;box-shadow:var(--shadow);font-size:18px}
.grid{display:grid;gap:14px;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);align-items:start}
.col{display:grid;gap:14px;min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;min-width:0}
.card h2{margin:0 0 10px;font-size:13px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.08em;display:flex;align-items:center;justify-content:space-between;gap:8px}
.banner{display:none;margin-bottom:14px;padding:12px 14px;border-radius:14px;background:rgba(245,158,11,.14);border:1px solid rgba(245,158,11,.4);font-size:14px}
.banner.show{display:block}

/* stage */
.stage-wrap{padding:10px}
.stage{--ar:1.7778;position:relative;margin:0 auto;aspect-ratio:var(--ar);
  width:min(100%,calc(62vh*var(--ar)));width:min(100%,calc(62dvh*var(--ar)));
  background:#000;border-radius:14px;overflow:hidden;container-type:inline-size}
.stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
.badge{position:absolute;top:10px;left:10px;display:none;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;background:rgba(0,0,0,.55);color:#fff;font-size:12px;font-weight:700;backdrop-filter:blur(6px)}
.badge.on{display:flex}
.badge b{width:8px;height:8px;border-radius:50%;background:var(--danger);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}
.sub{position:absolute;left:50%;bottom:12%;transform:translateX(-50%);max-width:90%;width:max-content;text-align:center;
  font-size:4.4cqw;line-height:1.25;padding:.2em .55em;pointer-events:none;display:none;overflow-wrap:anywhere}
.sub.show{display:block}

/* controls */
.rec-row{display:flex;align-items:center;gap:12px}
#rec{flex:1;min-height:56px;border-radius:16px;font-weight:800;font-size:18px;color:#fff;display:flex;align-items:center;justify-content:center;gap:10px;
  background:linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:0 8px 22px rgba(124,58,237,.4);transition:transform .1s}
#rec:active{transform:scale(.98)}
#rec .dot{width:14px;height:14px;border-radius:50%;background:#fff}
#rec.on{background:linear-gradient(135deg,#ef4444,#b91c1c);box-shadow:0 8px 22px rgba(239,68,68,.45)}
#rec.on .dot{border-radius:3px;animation:pulse 1s infinite}
#timer{min-width:64px;text-align:center;font-variant-numeric:tabular-nums;font-weight:700;font-size:18px;color:var(--mute)}
#st{margin-top:8px;font-size:13px;font-weight:600;color:var(--mute)}
#st.ok{color:var(--ok)}#st.err{color:var(--danger)}
.label{font-size:12px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.08em;margin:14px 0 8px;display:flex;justify-content:space-between;gap:8px}
.label span{text-transform:none;letter-spacing:0;font-weight:500}
.chips{display:grid;gap:8px}
.chips.lang{grid-template-columns:repeat(3,1fr)}
.chip{min-height:46px;padding:8px 10px;border-radius:13px;background:var(--chip);border:2px solid transparent;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px;transition:.15s;text-align:center}
.chip kbd{font:600 11px/1 ui-monospace,monospace;padding:3px 5px;border-radius:6px;background:var(--card);color:var(--mute);border:1px solid var(--line)}
.chip.active{border-color:var(--acc);background:linear-gradient(135deg,rgba(124,58,237,.18),rgba(236,72,153,.14));color:var(--ink);box-shadow:0 0 0 3px rgba(124,58,237,.15)}
.chips.lang .chip{font-size:18px}
.sel{width:100%;min-height:48px;padding:0 12px;border-radius:13px;background:var(--chip);color:var(--ink);border:2px solid var(--acc);font:700 16px/1 inherit;font-family:inherit}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.btn{min-height:50px;border-radius:14px;font-weight:700;background:var(--chip);border:1px solid var(--line);padding:0 14px;display:flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{color:#fff;border:0;background:linear-gradient(135deg,var(--acc),var(--acc2))}
.btn:disabled{opacity:.4;cursor:default}
.btn.sm{min-height:34px;border-radius:10px;font-size:13px;padding:0 10px}

/* player */
.player:fullscreen{background:#000;display:flex;flex-direction:column;justify-content:center;gap:8px;padding:8px}
.player:fullscreen .stage{width:min(100%,calc((100dvh - 110px)*var(--ar)))}
.ctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;
  --pc:#fff;--pbg:rgba(0,0,0,.5);--pr:.4em;--pw:700;--pf:inherit;--pst:none;--pa:#7c3aed;--pup:none;--pstroke:0}
.pb{min-height:40px;min-width:44px;padding:0 12px;color:var(--pc);background:var(--pbg);border-radius:var(--pr);font-weight:var(--pw);font-family:var(--pf);
  text-shadow:var(--pst);text-transform:var(--pup);-webkit-text-stroke:var(--pstroke);paint-order:stroke fill;font-size:15px;line-height:1;border:1px solid rgba(255,255,255,.18);font-style:var(--pit,normal)}
.pb:disabled,#seek:disabled{opacity:.4;cursor:default}
#seek{flex:1 1 140px;min-width:120px;accent-color:var(--pa);height:28px;margin:0}
#ptime{font-variant-numeric:tabular-nums;font-size:13px;color:var(--mute);min-width:88px;text-align:center}
.chk{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:13px;color:var(--mute)}
.chk input{width:18px;height:18px;accent-color:var(--acc)}

.edit-pane{display:none}
.player.edit{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;justify-content:flex-start;gap:8px;overflow:hidden;
  padding:calc(8px + env(safe-area-inset-top)) calc(10px + env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) calc(10px + env(safe-area-inset-left))}
.player.edit .stage{width:min(100%,calc(34dvh*var(--ar)));flex:none}
.player.edit .ctl{margin-top:0}
.player.edit .edit-pane{display:flex;flex-direction:column;flex:1;min-height:0;gap:6px}
.player.edit .tl{height:auto!important;flex:1;min-height:0}
.ephead{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--mute)}
/* timeline */
.tl{position:relative;overflow-x:auto;overflow-y:auto;border-radius:12px;background:var(--chip);border:1px solid var(--line);height:132px;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.tlin{position:relative;height:100%;min-width:100%}
.tick{position:absolute;top:0;height:20px;border-left:1px solid var(--mute);padding-left:4px;font-size:10px;color:var(--mute);pointer-events:none;font-variant-numeric:tabular-nums}
.blk{position:absolute;height:44px;border-radius:9px;color:#fff;font-size:12px;font-weight:600;line-height:44px;padding:0 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.blk.hy{background:linear-gradient(135deg,#8b5cf6,#6d28d9)}
.blk.ru{background:linear-gradient(135deg,#3b82f6,#1d4ed8)}
.blk.en{background:linear-gradient(135deg,#10b981,#047857)}
.blk.cut{opacity:.35;background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.25) 0 6px,transparent 6px 12px)}
.blk .h{position:absolute;top:0;bottom:0;width:9px;background:rgba(255,255,255,.4);cursor:ew-resize}
.blk .h.l{left:0;border-radius:9px 0 0 9px}
.blk .h.r{right:0;border-radius:0 9px 9px 0}
.ph{position:absolute;top:0;bottom:0;width:2px;background:#ef4444;pointer-events:none;z-index:5;box-shadow:0 0 6px rgba(239,68,68,.8)}
.ph::before{content:"";position:absolute;top:0;left:-4px;border:5px solid transparent;border-top-color:#ef4444}
.hint{font-size:12px;color:var(--mute);margin-top:8px}
.hint a{color:var(--acc);font-weight:700}

/* phrases */
.plist{display:grid;gap:8px;max-height:calc(100vh - 150px);max-height:calc(100dvh - 150px);overflow:auto;padding-right:2px}
.row{display:grid;grid-template-columns:auto auto 1fr auto;gap:8px;align-items:start;padding:8px;border-radius:14px;background:var(--chip);border:2px solid transparent}
.row.now{border-color:var(--acc);background:linear-gradient(135deg,rgba(124,58,237,.14),rgba(236,72,153,.1))}
.row .tm{min-height:34px;padding:0 9px;border-radius:10px;background:var(--card);border:1px solid var(--line);font:700 13px ui-monospace,SFMono-Regular,monospace;color:var(--acc)}
.row .lg{min-height:34px;padding:0 8px;border-radius:10px;font-weight:800;font-size:12px;color:#fff;display:grid;place-items:center}
.lg.hy{background:#7c3aed}.lg.ru{background:#2563eb}.lg.en{background:#059669}
.row .tx{min-height:34px;padding:6px 4px;font-size:16px;outline:none;border-radius:8px;overflow-wrap:anywhere}
.row .tx:focus{background:var(--card);box-shadow:0 0 0 2px var(--acc)}
.row.cut .tx{text-decoration:line-through;opacity:.5}
.row .sc{width:38px;min-height:34px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-size:16px}
.empty{padding:26px 10px;text-align:center;color:var(--mute);font-size:14px}
details{font-size:13px;color:var(--mute)}
details summary{cursor:pointer;font-weight:700;color:var(--ink);padding:4px 0}
details ul{margin:8px 0 0;padding-left:18px}
details li{margin:4px 0}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translate(-50%,30px);max-width:min(92vw,520px);padding:12px 16px;border-radius:14px;background:#1b1736;color:#fff;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:90;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.toast.show{opacity:1;transform:translate(-50%,0)}

.ovl{display:none;position:fixed;inset:0;z-index:200;align-items:center;justify-content:center;padding:20px;background:rgba(14,12,28,.82);backdrop-filter:blur(6px);touch-action:none}
.ovl.show{display:flex}
.ovl .box{width:min(100%,420px);text-align:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:24px 20px}
.ovl .pct{font-size:44px;font-weight:800;letter-spacing:-.02em;background:linear-gradient(135deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.ovl progress{width:100%;height:14px;accent-color:var(--acc);margin:10px 0}
.ovl h3{margin:0 0 6px;font-size:18px}
.ovl p{margin:6px 0 0;font-size:13px;color:var(--mute)}
.ovl ol{text-align:left;margin:10px 0 0;padding-left:20px;font-size:14px}
.ovl li{margin:6px 0}
#pz{display:none;min-height:56px;padding:0 14px;border-radius:16px;font-weight:800;font-size:16px;background:var(--chip);border:2px solid var(--acc);white-space:nowrap}
#pz.show{display:block}
.chips.styles{grid-template-columns:repeat(3,1fr);max-height:262px;overflow:auto;padding:2px;-webkit-overflow-scrolling:touch}
.sty{flex-direction:column;align-items:stretch;justify-content:flex-start;padding:6px;gap:6px;min-height:0}
.sty .pv{display:grid;place-items:center;min-height:40px;border-radius:9px;background:linear-gradient(135deg,#2b2a44,#4a3a6b);font-size:15px;line-height:1.25;padding:4px;overflow:hidden}
.sty .nm{font-weight:700;font-size:12px;color:var(--ink);line-height:1.15}
header{flex-wrap:wrap}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow);overflow:hidden}
.seg button{padding:0 9px;min-height:42px;font-size:12px;font-weight:800;color:var(--mute)}
.seg button.on{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff}
.camrow{display:flex;gap:8px;align-items:center;margin-top:10px}
.camrow .sel{flex:1;min-width:0;min-height:42px;font-size:14px}
.camrow .chip{flex:none;min-height:42px;font-size:13px;white-space:nowrap}
.camrow .btn.sm{width:40px;flex:none;padding:0}
#zr{flex:1;min-width:0;accent-color:var(--acc);height:28px;margin:0}
#zv{min-width:42px;text-align:right;font-variant-numeric:tabular-nums;font-size:13px;font-weight:700;color:var(--mute)}
.hbtns{display:flex;gap:8px;align-items:center}
#inst{width:auto;padding:0 12px;font-size:14px;font-weight:700;gap:6px;white-space:nowrap}
@media (max-width:900px){
  .grid{grid-template-columns:1fr}
  .plist{max-height:none}
}
@media (max-width:520px){
  .chips.styles{grid-template-columns:repeat(2,1fr)}
  .app{padding:8px 10px 24px}
  .card{padding:12px;border-radius:16px}
  .actions{grid-template-columns:1fr}
  .row{grid-template-columns:auto 1fr auto;}
  .row .tx{grid-column:1 / -1;grid-row:2}
  .logo small{display:none}
  .chip kbd{display:none}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo"><i>◉</i><div><span data-i="title"></span><small data-i="tag"></small></div></div>
    <div class="hbtns"><div class="seg" id="uil"><button data-u="en">EN</button><button data-u="ru">RU</button><button data-u="hy">ՀԱՅ</button></div><button class="icon-btn" id="inst" data-i="inst"></button><button class="icon-btn" id="theme" aria-label="Сменить тему">🌓</button></div>
  </header>

  <div class="banner" id="banner"></div>

  <div class="grid">
    <div class="col">
      <div class="card stage-wrap">
        <div class="player" id="player">
        <div class="stage" id="stage">
          <video id="v" playsinline muted autoplay></video>
          <div class="badge" id="badge"><b></b>REC</div>
          <div class="sub" id="sub"></div>
        </div>
        <div class="ctl" id="ctl">
          <button class="pb" id="bk" disabled>−5</button>
          <button class="pb" id="pp" disabled>▶</button>
          <button class="pb" id="fw" disabled>+5</button>
          <input type="range" id="seek" min="0" max="1000" value="0" step="1" disabled aria-label="Перемотка">
          <div id="ptime">00:00 / 00:00</div>
          <button class="pb" id="mu" disabled>ЗВУК</button>
          <button class="pb" id="spd" disabled>1×</button>
          <button class="pb" id="ed" disabled>✎ Edit voice timing</button>
          <button class="pb" id="fs">⛶</button>
        </div>
        <div class="edit-pane" id="ep">
          <div class="ephead"><span data-i="edhint"></span><span style="display:flex;gap:6px;flex:none"><button class="btn sm" id="eadd" data-i="addHere"></button><button class="btn sm" id="edone" data-i="done"></button></span></div>
          <div class="tl" id="tl"><div class="tlin" id="tlin"></div></div>
        </div>
        </div>
        <div class="camrow"><select class="sel" id="camSel" aria-label="Camera"></select><button class="btn sm" id="camFlip" aria-label="Flip camera">🔄</button><button class="chip" id="mirr"></button></div>
        <div class="camrow"><button class="btn sm" id="zo">−</button><input type="range" id="zr" min="1" max="4" step="0.1" value="1" aria-label="Zoom"><button class="btn sm" id="zi">＋</button><span id="zv">1.0×</span></div>
      </div>

      <div class="card">
        <div class="rec-row">
          <button id="rec"><span class="dot"></span><span id="recTxt">Запись</span></button>
          <button id="pz">⏸ Пауза</button>
          <div id="timer">00:00</div>
        </div>
        <div id="st">Распознавание речи: ожидание записи</div>
        <div id="pass" style="display:none;margin-top:8px"><div class="hint" id="passTxt" style="margin:0 0 6px"></div><progress id="passBar" max="100" value="0" style="width:100%;height:16px;accent-color:var(--acc)"></progress><button class="btn sm" id="passX" style="margin-top:6px">Остановить и сохранить то, что есть</button></div>

        <details id="cloud" style="margin-top:10px"><summary data-i="cloudSum"></summary>
          <div class="hint" style="margin:6px 0" data-ih="cloudHint"></div>
          <div style="display:flex;gap:8px"><input id="key" type="password" autocomplete="off" placeholder="gsk_…" class="sel" style="min-height:40px;font-size:14px;flex:1"><button class="btn sm" id="keysave" data-i="save"></button></div>
          <div class="hint" id="keyst"></div>
        </details>

        <div class="label"><b data-i="speechLang" style="font-weight:inherit"></b><span data-i="speechLangHint"></span></div>
        <div class="chips lang" id="langs">
          <button class="chip active" data-l="hy">Հայ <kbd>1</kbd></button>
          <button class="chip" data-l="ru">Рус <kbd>2</kbd></button>
          <button class="chip" data-l="en">Eng <kbd>3</kbd></button>
        </div>

        <div class="label" data-i="styleLbl"></div>
        <div class="chips styles" id="styles" role="listbox" aria-label="Стиль субтитров"></div>

        <div class="actions">
          <button class="btn" id="srt" disabled data-i="srt"></button>
          <button class="btn primary" id="exp" disabled>🎬 Экспорт</button>
          <button class="btn" id="add" style="grid-column:1/-1" data-i="addM"></button>
        </div>
        <div class="hint" data-i="expHint"></div>
      </div>

    </div>

    <div class="col">
      <div class="card">
        <h2><span data-i="phrases"></span> <button class="btn sm" id="clear" data-i="clear"></button></h2>
        <div class="plist" id="list"></div>
      </div>
      <div class="card">
        <details>
          <summary data-i="limits"></summary>
          <ul><li data-i="l1"></li><li data-i="l2"></li><li data-i="l3"></li><li data-i="l4"></li><li data-i="l5"></li></ul>
        </details>
      </div>
    </div>
  </div>
</div>

<div id="ebox" style="display:none;position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.55);align-items:center;justify-content:center;padding:16px">
  <div class="card" style="width:min(100%,460px)">
    <h2 id="etitle">Текст дорожки</h2>
    <textarea id="etxt" class="sel" rows="3" style="min-height:90px;padding:10px;font-weight:500;line-height:1.3;resize:vertical"></textarea>

const allC=()=>phrases.flatMap(p=>p.c||[]);
function span(p){const c=p.c&&p.c.length?p.c:null;return c?[Math.min(...c.map(x=>x.s)),Math.max(...c.map(x=>x.e))]:[p.s,p.e]}
function cutSpans(){
  const a=phrases.filter(p=>p.cut).map(span).sort((x,y)=>x[0]-y[0]);
  const out=[];for(const s of a){const l=out[out.length-1];if(l&&s[0]<=l[1])l[1]=Math.max(l[1],s[1]);else out.push([s[0],s[1]])}
  return out;
}
function chunkAt(t){let r=null;for(const p of phrases){if(p.cut||!p.c)continue;for(const c of p.c){if(c.s<=t&&t<c.e)r=c}}return r}
function pickMime(){const l=['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'];for(const m of l){if(window.MediaRecorder&&MediaRecorder.isTypeSupported(m))return m}return''}

/* ---------- куски по 5–6 слов ---------- */
function buildPhrase(p){
  const w=p.t.split(/\s+/).filter(Boolean),n=w.length;p.c=[];if(!n)return;
  const k=Math.ceil(n/6),per=Math.ceil(n/k);
  const e=Math.max(p.e,p.s+0.25*n),d=e-p.s;
  for(let j=0;j<n;j+=per){
    const part=w.slice(j,j+per);
    p.c.push({g:p,t:part.join(' '),s:p.s+d*j/n,e:p.s+d*(j+part.length)/n});
  }
}
const nrm=w=>w.toLowerCase().replace(/[.,!?;:։՝՞«»"()…]/g,'');
const wds=x=>x.split(/\s+/).filter(Boolean);
function stripDup(p){
  const cw=wds(p.raw!==undefined?p.raw:p.t),cn=cw.map(nrm),idx=phrases.indexOf(p);let best=0;
  for(let j=0;j<idx;j++){
    const q=phrases[j],pn=wds(q.raw!==undefined?q.raw:q.t).map(nrm);
    if(!pn.length)continue;
    const same=pn.length<=cn.length&&pn.every((w,k)=>w===cn[k]);
    if(same&&(pn.length>=3||(pn.length===cn.length&&Math.abs(p.s-q.s)<4)))best=Math.max(best,pn.length);
    else if(cn.length>=2&&Math.abs(p.e-q.e)<6&&(' '+pn.join(' ')+' ').includes(' '+cn.join(' ')+' '))best=cn.length;
  }
  return cw.slice(best).join(' ');
}
function buildAll(){
  phrases.sort((a,b)=>a.s-b.s);
  phrases.forEach(p=>{if(p.raw!==undefined)p.t=stripDup(p)});
  phrases=phrases.filter(p=>p.t);
  phrases.forEach(buildPhrase);save();renderAll();
}

/* ---------- распознавание ---------- */
const ERRK={'not-allowed':'errNA','service-not-allowed':'errSNA','audio-capture':'errAC','network':'errNet','language-not-supported':'errLang'};
function startSR(){
  if(!SR){setSt(t('srNo'),'err');return}
  const my=++epoch;const r=new SR();
  r.lang=LANGS[lang];r.continuous=true;r.interimResults=true;r.maxAlternatives=1;
  const lg=lang;let fatal=false,delay=350;
  r.onstart=()=>setSt(t('listen',LANGS[lg]),'ok');
  r.onaudiostart=()=>setSt(t('audioOn'),'ok');
  r.onspeechstart=()=>setSt(t('speech'),'ok');
  r.onresult=ev=>{
    const now=nowT();gotRes=true;
    for(let i=ev.resultIndex;i<ev.results.length;i++){
      const key=my+'-'+i;let p=map[key];
      const txt=ev.results[i][0].transcript.trim();
      if(!txt)continue;
      if(!p){p={s:Math.max(0,now-0.6),e:now,l:lg,t:'',cut:false};map[key]=p;phrases.push(p)}
      p.raw=txt;p.e=now;p.t=stripDup(p);
    }
    setSt(t('textOn'),'ok');banner('');
    save();renderList();updateButtons();
  };
  r.onerror=e=>{
    if(e.error==='aborted')return;
    if(e.error==='no-speech'){setSt(t('silence'));return}
    if(passing&&passTrack&&e.error!=='network'){passFallback();return}
    setSt(t('errSt',e.error),'err');
    toast(ERRK[e.error]?t(ERRK[e.error]):t('errGeneric',e.error),8000);
    if(e.error==='network'){delay=2000}
    else if(e.error!=='no-speech')fatal=true;
  };
  r.onend=()=>{
    try{r._t&&r._t.stop()}catch(e){}
    if((recording||passing)&&!paused&&my===epoch&&!fatal)setTimeout(()=>{if((recording||passing)&&!paused&&my===epoch)startSR()},delay);
  };
  sr=r;
  try{
    if(passing&&passTrack){const ct=passTrack.clone();r._t=ct;try{r.start(ct)}catch(e2){passTrack=null;usingTrack=false;try{ASRC.connect(AC.destination)}catch(e3){}r.start()}}
    else r.start();
  }catch(e){setSt(t('startFail',e.message),'err')}
}
function setLang(l){
  lang=l;if(recording)langLog.push({t:rt(),l});
  document.querySelectorAll('#langs .chip').forEach(b=>b.classList.toggle('active',b.dataset.l===l));
  if((recording||passing)&&SR&&!paused){
    epoch++;
    if(sr){sr.onend=null;sr.onresult=null;sr.onerror=null;try{sr._t&&sr._t.stop()}catch(e){}try{sr.abort()}catch(e){}sr=null}
    clearTimeout(setLang._t);setLang._t=setTimeout(()=>{if((recording||passing)&&!paused)startSR()},120);
  }
  if(recording&&cl.on&&!paused){clearTimeout(cl.timer);const old=cl.rec;cloudNext();try{old&&old.state!=='inactive'&&old.stop()}catch(e){}}
}

/* ---------- облачное распознавание (Groq Whisper) ---------- */
const CHUNK=7;
const cl={on:false,rec:null,timer:null,pend:0,astream:null,bad:false};
const DEF_EP='https://api.groq.com/openai/v1/audio/transcriptions';
const getKey=()=>{try{return(localStorage.getItem('substudio-key')||'').trim()}catch(e){return''}};
const getEndpoint=()=>{try{return localStorage.getItem('substudio-endpoint')||DEF_EP}catch(e){return DEF_EP}};
function cloudStart(){
  cl.on=true;cl.pend=0;cl.bad=false;
  cl.astream=new MediaStream(stream.getAudioTracks());
  cloudNext();
}
function cloudNext(){
  if(!cl.on)return;
  let mt='';for(const m of['audio/webm;codecs=opus','audio/webm','audio/mp4']){if(MediaRecorder.isTypeSupported(m)){mt=m;break}}
  const r=new MediaRecorder(cl.astream,mt?{mimeType:mt}:undefined),parts=[],ts=rt(),lg=lang;
  r.ondataavailable=e=>{if(e.data&&e.data.size)parts.push(e.data)};
  r.onstop=()=>{const te=rt();if(te-ts>=0.8)cloudSend(new Blob(parts,{type:r.mimeType||'audio/webm'}),ts,te,lg)};
  r.start();cl.rec=r;
  cl.timer=setTimeout(()=>{if(!cl.on)return;cloudNext();try{r.stop()}catch(e){}},CHUNK*1000);
}
function cloudStop(){
  if(!cl.on)return;cl.on=false;clearTimeout(cl.timer);
  try{cl.rec&&cl.rec.state!=='inactive'&&cl.rec.stop()}catch(e){}
}
async function cloudSend(blob,ts,te,lg){
  if(blob.size<1500)return;
  cl.pend++;setSt(t('cloudSend'),'ok');
  try{
    const fd=new FormData();
    fd.append('file',blob,'chunk.webm');fd.append('model','whisper-large-v3');
    fd.append('language',lg);fd.append('response_format','verbose_json');fd.append('temperature','0');
    const res=await fetch(getEndpoint(),{method:'POST',headers:{Authorization:'Bearer '+getKey()},body:fd});
    if(res.status===401){cl.bad=true;toast(t('keyBad'),8000);setSt(t('keyBadSt'),'err')}
    else if(res.status===429){setSt(t('cloudLim'),'err')}
    else if(!res.ok){setSt(t('cloudErr',res.status),'err')}
    else{
      const j=await res.json();let n=0;
      const segs=(j.segments&&j.segments.length)?j.segments:[{start:0,end:te-ts,text:j.text||'',no_speech_prob:0}];
      for(const g of segs){
        const t=(g.text||'').replace(/\s+/g,' ').trim();
        if(t.length<2||(g.no_speech_prob!==undefined&&g.no_speech_prob>0.7))continue;
        phrases.push({s:ts+g.start,e:ts+Math.max(g.end,g.start+0.4),l:lg,t,cut:false});n++;
      }
      if(n){setSt(t('cloudOk'),'ok');banner('');save();renderList();updateButtons()}
      else setSt(t('cloudWait'),'ok');
    }
  }catch(e){setSt(t('cloudNet'),'err')}
  cl.pend--;
  if(!recording&&cl.pend===0&&!cl.on){buildAll();const ok=phrases.some(p=>p.t);setSt(ok?t('doneSt'):t('nothing'),ok?'ok':'err')}
}

$('#keysave').onclick=()=>{const k=$('#key').value.trim();try{localStorage.setItem('substudio-key',k)}catch(e){}$('#keyst').textContent=k?t('keyOk'):t('keyOff');toast(k?t('toastKeyOk'):t('toastKeyOff'),2500)};

let camId='',mirror=false,zoom=1,hwZoom=false,zmin=1,zmax=4,zstep=0.1;
try{camId=localStorage.getItem('substudio-cam')||'';mirror=localStorage.getItem('substudio-mirror')==='1'}catch(e){}

function canvasTrack(){
  const W=v.videoWidth||1280,H=v.videoHeight||720;rc.cv.width=W;rc.cv.height=H;
  const x=rc.cv.getContext('2d');
  const draw=()=>{
    const z=hwZoom?1:zoom,sw=W/z,sh=H/z;
    x.save();x.clearRect(0,0,W,H);
    if(mirror){x.translate(W,0);x.scale(-1,1)}
    try{x.drawImage(v,(W-sw)/2,(H-sh)/2,sw,sh,0,0,W,H)}catch(e){}
    x.restore();
  };
  draw();rc.on=true;rc.t=setInterval(draw,33);
  return rc.cv.captureStream(30).getVideoTracks()[0];
}
function stopCanvas(){clearInterval(rc.t);rc.on=false}

/* ---------- камера и запись ---------- */
const CAMMSG={
  busy:{ru:'Камера занята: закройте другие вкладки и приложения с камерой (в том числе браузер, если открыто установленное приложение) и попробуйте снова.',en:'Camera is busy: close other tabs/apps using it (including the browser if the installed app is open) and try again.',hy:'Տեսախցիկը զբաղված է․ փակեք այն օգտագործող այլ ներդիրները և հավելվածները (նաև դիտարկիչը, եթե բաց է տեղադրված հավելվածը) և փորձեք նորից։'},
  none:{ru:'Камера не найдена.',en:'No camera found.',hy:'Տեսախցիկ չի գտնվել։'}
};
function camLive(){return !!stream&&stream.getVideoTracks().some(x=>x.readyState==='live')}
function gum(c){
  return new Promise((res,rej)=>{
    let done=false;
    const tm=setTimeout(()=>{done=true;const e=new Error('getUserMedia timeout');e.name='TimeoutError';rej(e)},15000);
    navigator.mediaDevices.getUserMedia(c).then(
      s=>{clearTimeout(tm);if(done)s.getTracks().forEach(x=>x.stop());else res(s)},
      e=>{clearTimeout(tm);if(!done)rej(e)}
    );
  });
}
async function openStream(){
  const base={width:{ideal:1280},height:{ideal:720}};
  const tries=[];
  if(camId)tries.push({video:Object.assign({deviceId:{exact:camId}},base),audio:true});
  tries.push({video:Object.assign({facingMode:'user'},base),audio:true});
  tries.push({video:true,audio:true});
  tries.push({video:true,audio:false});
  let last=null;
  for(const c of tries){
    try{return await gum(c)}
    catch(e){last=e;if(e.name==='NotAllowedError'||e.name==='SecurityError'||e.name==='TimeoutError')break}
  }
  throw last;
}
let camQ=Promise.resolve();
function initCam(){const p=camQ.then(_initCam,_initCam);camQ=p.catch(()=>{});return p}
async function _initCam(){
  if(stream){stream.getTracks().forEach(x=>x.stop());stream=null}
  try{
    stream=await openStream();
    try{const id=stream.getVideoTracks()[0].getSettings().deviceId;if(id){camId=id;localStorage.setItem('substudio-cam',id)}}catch(e){}
    v.srcObject=stream;v.muted=true;v.controls=false;
    setupZoom();applyView();
    await v.play().catch(()=>{});
    listCams();
    return true;
  }catch(err){
    const n=err&&err.name;
    toast((n==='NotReadableError'||n==='TrackStartError'?CAMMSG.busy[ui]
      :(n==='NotFoundError'||n==='OverconstrainedError')?CAMMSG.none[ui]
      :t('camDenied'))+' ['+(n||'error')+(err&&err.message?': '+err.message:'')+']',9000);
    listCams();
    return false;
  }
}
/* возврат в приложение: после сворачивания камера «умирает», перезапускаем */

  phrases=[];map={};dur=0;blobs=[];lastSub='';langLog=[{t:0,l:lang}];paused=false;pausedMs=0;

  tmr=setInterval(()=>{timerEl.textContent=fmt(rt());renderTL()},1000);

}

  lines.forEach((l,i)=>{

  r2.ondataavailable=e=>{if(e.data&&e.data.size)out.push(e.data)};
  r2.onstop=()=>{
    try{if(ASRC)ASRC.connect(AC.destination)}catch(e){}
    exporting=false;xctx=null;v.controls=false;v.currentTime=0;expBtn.textContent=explbl();$('#xbox').classList.remove('show');
    download(new Blob(out,{type:isMp4?'video/mp4':'video/webm'}),isMp4?'edited.mp4':'edited.webm');
    updateButtons();toast(t('exDone',isMp4?'edited.mp4':'edited.webm'));
  };
  $('#xpct').textContent='0%';$('#xbar').value=0;$('#xbox').classList.add('show');
  if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();
  try{await v.play()}catch(e){}
  r2.start(1000);
}

/* ---------- редактор дорожки ---------- */
let ec=null,enew=false;
const ebox=$('#ebox'),etxt=$('#etxt');
function openEd(c,isNew){
  ec=c;enew=!!isNew;etxt.value=isNew?'':c.t;
  $('#etitle').textContent=t(isNew?'eNew':'eTitle');
  $('#edel').style.display=isNew?'none':'';
  ebox.style.display='flex';setTimeout(()=>etxt.focus(),50);
}
function closeEd(){ebox.style.display='none';ec=null}
function dropChunk(c){
  const g=c.g;g.c=g.c.filter(x=>x!==c);
  if(!g.c.length)phrases=phrases.filter(p=>p!==g);
  else{g.t=g.c.map(x=>x.t).join(' ');g.raw=g.t}
}
function saveEd(){
  if(!ec)return;
  const t=etxt.value.replace(/\s+/g,' ').trim(),c=ec;
  if(!t)dropChunk(c);
  else{c.t=t;c.g.t=c.g.c.map(x=>x.t).join(' ');c.g.raw=c.g.t}
  closeEd();save();renderAll();
}
$('#esave').onclick=saveEd;
$('#ecancel').onclick=()=>{if(ec&&enew){dropChunk(ec);save();renderAll()}closeEd()};
$('#edel').onclick=()=>{if(ec){dropChunk(ec);save();renderAll()}closeEd()};
$('#eadd').onclick=()=>{
  if(!hasVideo||recording||exporting||passing)return;
  v.pause();
  const now=v.currentTime;
  const p={s:now,e:now+2.5,l:lang,t:t('newPhrase'),cut:false};
  phrases.push(p);phrases.sort((a,b)=>a.s-b.s);buildPhrase(p);save();renderAll();
  openEd(p.c[0],true);
};

/* ---------- установка на телефон ---------- */
let dip=null;
const isStandalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone;
const isIOS=/iPhone|iPad|iPod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const isAnd=/Android/i.test(navigator.userAgent);
(function(){
  try{
    const svg="<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='#7c3aed'/><stop offset='1' stop-color='#ec4899'/></linearGradient></defs><rect width='64' height='64' rx='16' fill='url(#g)'/><circle cx='32' cy='32' r='13' fill='none' stroke='#fff' stroke-width='5'/><circle cx='32' cy='32' r='5' fill='#fff'/></svg>";
    const icon='data:image/svg+xml,'+encodeURIComponent(svg);
    const man={name:t('title'),short_name:t('subWord'),start_url:location.href.split('#')[0],display:'standalone',background_color:'#0e0c1c',theme_color:'#7c3aed',icons:[{src:icon,sizes:'any',type:'image/svg+xml',purpose:'any'}]};
    if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(()=>{});
  }catch(e){}
  if(isStandalone())$('#inst').style.display='none';
  window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();dip=e});
  window.addEventListener('appinstalled',()=>{$('#inst').style.display='none';dip=null;toast(t('installed'))});
  $('#inst').onclick=async()=>{
    if(dip){dip.prompt();try{await dip.userChoice}catch(e){}dip=null;return}
    const h=t(isIOS?'iIos':isAnd?'iAnd':'iDesk')+t('iNote');$('#itxt').innerHTML=h;$('#ibox').classList.add('show');
  };
  $('#iclose').onclick=()=>$('#ibox').classList.remove('show');
})();

/* ---------- язык интерфейса ---------- */
function applyLang(){
  document.documentElement.lang=ui;document.title=t('title');
  document.querySelectorAll('[data-i]').forEach(e=>{e.textContent=t(e.dataset.i)});
  document.querySelectorAll('[data-ih]').forEach(e=>{e.innerHTML=t(e.dataset.ih)});
  document.querySelectorAll('#uil button').forEach(b=>b.classList.toggle('on',b.dataset.u===ui));
  document.querySelectorAll('#styles .sty').forEach((b,i)=>{b.querySelector('.nm').textContent=SN[ui][i];b.querySelector('.pv span').textContent=t('subWord')});
  recTxt.textContent=t(recording?'stop':'rec');
  $('#pz').textContent=t(paused?'resume':'pause');
  badge.innerHTML='<b></b>'+t(paused?'badgePause':'badgeRec');
  $('#ed').textContent=t($('#player').classList.contains('edit')?'edC':'edT');
  if(!exporting)expBtn.textContent=explbl();
  mirrLabel();keyStat();listCams();
  if(!recording&&!hasVideo&&!passing)setSt(t('stIdle'));
  renderList();
}
document.querySelectorAll('#uil button').forEach(b=>b.onclick=()=>{ui=b.dataset.u;try{localStorage.setItem('substudio-ui',ui)}catch(e){}applyLang()});

/* ---------- события ---------- */
expBtn.textContent=explbl();
recBtn.onclick=()=>{if(exporting||passing)return;recording?stopRec():startRec()};
document.querySelectorAll('#langs .chip').forEach(b=>b.onclick=()=>setLang(b.dataset.l));
Object.keys(STY).forEach(k=>{
  const d=STY[k],b=document.createElement('button');b.className='chip sty';b.dataset.k=k;
  const pv=document.createElement('div'),tt=document.createElement('span'),nm=document.createElement('div');
  pv.className='pv';tt.textContent=t('subWord');nm.className='nm';nm.textContent=d.n;
  tt.style.cssText='color:'+d.c+';background:'+(d.bg||'none')+';border-radius:'+(d.bg?(d.r||0)+'em':'0')+';font-weight:'+d.w+';font-style:'+(d.it?'italic':'normal')+';font-family:'+(d.fam||BASEFAM)+';text-transform:'+(d.up?'uppercase':'none')+';-webkit-text-stroke:'+(d.st?(d.st*0.6)+'em '+d.sc:'0')+';paint-order:stroke fill;text-shadow:'+(d.sh?'0 '+d.sh[2]+'em '+d.sh[1]+'em '+d.sh[0]:'none')+';padding:.1em .45em';
  pv.appendChild(tt);b.append(pv,nm);b.onclick=()=>setStyle(k);$('#styles').appendChild(b);
});
setStyle('classic',true);
srtBtn.onclick=downloadSrt;expBtn.onclick=exportVideo;$('#add').onclick=addManual;$('#passX').onclick=()=>finishPass();
$('#clear').onclick=()=>{
  if(recording||exporting)return;
  if(phrases.length&&!confirm(t('clearQ')))return;
  phrases=[];map={};dur=0;save();renderAll();
};
document.addEventListener('keydown',e=>{
  const a=document.activeElement;
  if(a&&(a.isContentEditable||/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)))return;
  if(e.code==='Escape')setEdit(false);
  if(hasVideo&&!recording&&!exporting&&!passing&&!(a&&/^(BUTTON|INPUT)$/.test(a.tagName))){
    if(e.code==='Space'){e.preventDefault();togglePlay()}
    else if(e.code==='ArrowLeft')skip(-5);else if(e.code==='ArrowRight')skip(5);
  }
  const m={Digit1:'hy',Numpad1:'hy',Digit2:'ru',Numpad2:'ru',Digit3:'en',Numpad3:'en'}[e.code];
  if(m)setLang(m);
});
function applyTheme(t){document.documentElement.dataset.theme=t;try{localStorage.setItem('substudio-theme',t)}catch(e){}}
$('#theme').onclick=()=>applyTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');
(function(){
  let t=null;try{t=localStorage.getItem('substudio-theme')}catch(e){}
  if(!t)t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
  document.documentElement.dataset.theme=t;
})();

/* ---------- старт ---------- */
(function init(){
  applyLang();
  if(!SR){banner(t('bNoSR'));setSt(t('srNo'),'err')}
  else if(!navigator.mediaDevices){banner(t('bNoMedia'))}
  load();renderAll();
  if(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)initCam();
  requestAnimationFrame(tick);
})();
})();
</script>
