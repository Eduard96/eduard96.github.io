<!doctype html>
<html lang="ru" data-theme="blue-matte">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>just happened</title>
<meta name="description" content="Anonymous eyewitness feed: photos or short clips, a few words, a place and a hashtag.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230F1822'/%3E%3Ccircle cx='32' cy='26' r='9' fill='%23C9A24B'/%3E%3Cpath d='M32 62c-9-14-14-22-14-30a14 14 0 1 1 28 0c0 8-5 16-14 30z' fill='none' stroke='%236E9AD6' stroke-width='4'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..700&family=Noto+Sans+Armenian:wght@400..700&display=swap" rel="stylesheet">
<style>
/* just happened — shared styles */
:root{
  --r:12px;
  --glow:0 0 0 rgba(0,0,0,0);
  --sheen:none;
}
[data-theme="blue-matte"]{--bg:#0F1822;--panel:#16212D;--panel2:#1B2836;--line:#2A3A4B;--line-soft:#22303E;--ink:#DEE6EE;--ink2:#8FA1B4;--signal:#6E9AD6;--live:#C9A24B;--ok:#5FA98A;--bad:#D0736C}
[data-theme="green-matte"]{--bg:#0F1814;--panel:#16231D;--panel2:#1B2A22;--line:#2A3B32;--line-soft:#223028;--ink:#DEE9E2;--ink2:#8FA89A;--signal:#6BA582;--live:#C2A45B;--ok:#5FA98A;--bad:#D0736C}
[data-theme="red-matte"]{--bg:#1A1213;--panel:#241A1B;--panel2:#2B2021;--line:#3D2B2C;--line-soft:#312324;--ink:#EDE0E0;--ink2:#B39899;--signal:#C4726C;--live:#C79A55;--ok:#6FA98D;--bad:#E0837C}
[data-theme="brown-matte"]{--bg:#18130E;--panel:#231C15;--panel2:#2A221A;--line:#3C3125;--line-soft:#2F261C;--ink:#EDE3D6;--ink2:#B2A28B;--signal:#B9905E;--live:#C9A45B;--ok:#6FA98D;--bad:#D8836F}
[data-theme="blue-electric"]{--bg:#05091A;--panel:#0A1230;--panel2:#0E1940;--line:#1E3480;--line-soft:#152560;--ink:#E9F0FF;--ink2:#8FA8E0;--signal:#3D6BFF;--live:#00E5FF;--ok:#2BE0A6;--bad:#FF5C7A;--glow:0 0 22px rgba(61,107,255,.35);--sheen:linear-gradient(160deg,rgba(61,107,255,.13),transparent 55%)}
[data-theme="green-electric"]{--bg:#03130B;--panel:#062018;--panel2:#082A1E;--line:#0F5636;--line-soft:#0B3F27;--ink:#E6FFF1;--ink2:#7FCCA4;--signal:#0FE07C;--live:#B6FF3D;--ok:#0FE07C;--bad:#FF6B6B;--glow:0 0 22px rgba(15,224,124,.3);--sheen:linear-gradient(160deg,rgba(15,224,124,.12),transparent 55%)}
[data-theme="red-electric"]{--bg:#150407;--panel:#25080D;--panel2:#300A11;--line:#6B1524;--line-soft:#4C0F19;--ink:#FFE9EC;--ink2:#D99AA6;--signal:#FF2E55;--live:#FF8A00;--ok:#4BD6A0;--bad:#FF8098;--glow:0 0 22px rgba(255,46,85,.32);--sheen:linear-gradient(160deg,rgba(255,46,85,.12),transparent 55%)}
[data-theme="brown-electric"]{--bg:#140C04;--panel:#22160A;--panel2:#2C1D0C;--line:#5C3A12;--line-soft:#432A0D;--ink:#FFF0DC;--ink2:#D3AF84;--signal:#FF9F1C;--live:#FFD166;--ok:#67D6A2;--bad:#FF7B6B;--glow:0 0 22px rgba(255,159,28,.3);--sheen:linear-gradient(160deg,rgba(255,159,28,.12),transparent 55%)}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--ink);
  font-family:'Archivo','Noto Sans Armenian',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;
}
img,video,canvas{max-width:100%;display:block}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--signal)}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px;border-radius:4px}
.wrap{width:min(880px,100% - 32px);margin-inline:auto}
.wide{width:min(1180px,100% - 32px)}

/* header */
header.top{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar{display:flex;align-items:center;gap:14px;padding:10px 0;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-stretch:118%;letter-spacing:-.02em;font-size:19px;text-decoration:none;color:var(--ink)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--live);box-shadow:var(--glow),0 0 0 0 color-mix(in srgb,var(--live) 55%,transparent);animation:pulse 2.8s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--live) 45%,transparent)}70%{box-shadow:0 0 0 11px transparent}100%{box-shadow:0 0 0 0 transparent}}
.tabs{display:flex;gap:14px;font-size:14.5px}
.tabs a{color:var(--ink2);text-decoration:none;padding-bottom:2px;border-bottom:1px solid transparent}
.tabs a:hover{color:var(--ink)}
.tabs a[aria-current="page"]{color:var(--ink);border-color:var(--signal)}
.spacer{flex:1}
.langs{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--panel)}
.langs button{background:none;border:0;padding:6px 12px;cursor:pointer;color:var(--ink2);font-weight:500}
.langs button[aria-pressed="true"]{background:var(--signal);color:#fff}
.themebox{position:relative}
.themebtn{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 12px 5px 6px;cursor:pointer;color:var(--ink2);font-size:14px}
.swatch{width:18px;height:18px;border-radius:50%;border:1px solid var(--line);background:linear-gradient(140deg,var(--signal),var(--panel) 70%)}
.thememenu{position:absolute;right:0;top:calc(100% + 8px);background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:6px;display:none;min-width:210px;box-shadow:0 18px 40px rgba(0,0,0,.45)}
.thememenu.on{display:block}
.thememenu button{display:flex;width:100%;align-items:center;gap:10px;background:none;border:0;padding:8px 10px;border-radius:8px;cursor:pointer;color:var(--ink);text-align:left;font-size:14px}
.thememenu button:hover{background:var(--panel2)}
.thememenu button[aria-pressed="true"]{background:var(--panel2);font-weight:600}
.thememenu .chip{width:16px;height:16px;border-radius:50%;flex:none;border:1px solid rgba(255,255,255,.14)}

/* panels & controls */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);background-image:var(--sheen)}
.btn{border:1px solid var(--line);background:var(--panel2);color:var(--ink);padding:10px 16px;border-radius:999px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--signal)}
.btn.primary{background:var(--signal);border-color:var(--signal);color:#0A0E14;padding:13px 26px;box-shadow:var(--glow)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.quiet{color:var(--ink2);font-weight:500;padding:9px 14px;background:none}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--panel2)}
.seg button{border:0;background:none;padding:8px 16px;cursor:pointer;color:var(--ink2);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--signal);color:#0A0E14}
textarea,input[type=text]{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);color:var(--ink)}
textarea{min-height:88px;resize:vertical}
textarea:focus,input:focus{border-color:var(--signal)}
::placeholder{color:color-mix(in srgb,var(--ink2) 75%,transparent)}

h1{margin:0;font-size:clamp(38px,8.5vw,64px);line-height:.94;font-weight:700;font-stretch:120%;letter-spacing:-.035em}
h1 .h-sub{display:block;font-stretch:88%;font-weight:400;font-size:.33em;letter-spacing:0;line-height:1.4;color:var(--ink2);margin-top:14px;max-width:54ch}
.hero{padding:38px 0 18px}

/* composer */
.composer{padding:20px;margin-bottom:34px}
.field{padding:18px 0;border-top:1px solid var(--line-soft)}
.field:first-child{border-top:0;padding-top:4px}
.flabel{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.flabel h2{margin:0;font-size:17px;font-weight:600;letter-spacing:-.01em}
.flabel .req{font-size:13px;color:var(--live)}
.hint{margin:0;font-size:14px;color:var(--ink2)}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(94px,1fr));gap:8px;margin-top:14px}
.thumb{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;background:var(--panel2);border:1px solid var(--line-soft)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb .len{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.7);color:#fff;font-size:11px;padding:2px 6px;border-radius:5px}
.thumb .kill{position:absolute;top:5px;right:5px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.72);color:#fff;cursor:pointer;line-height:1;font-size:13px;padding:0}
.thumb.bad{outline:2px solid var(--bad);outline-offset:-2px}
.count{font-size:14px;color:var(--ink2);margin-top:10px}
.chars{font-size:13px;color:var(--ink2);text-align:right;margin-top:6px}
.geo{margin-top:10px;font-size:14px;color:var(--ink2)}
.geo b{color:var(--ink)}

/* tag chips */
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:4px}
.chip{border:1px solid var(--line);background:var(--panel2);color:var(--ink2);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer}
.chip:hover{border-color:var(--signal);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--signal);border-color:var(--signal);color:#0A0E14;font-weight:600}
.chip.custom{border-style:dashed}
.tagline{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.tagline input{max-width:220px}

/* human check */
.track{position:relative;height:58px;border-radius:10px;border:1px solid var(--line);background:repeating-linear-gradient(90deg,var(--panel2) 0 9px,var(--panel) 9px 18px);overflow:hidden;touch-action:none;user-select:none;margin-top:4px}
.notch{position:absolute;top:5px;bottom:5px;width:48px;border-radius:8px;border:2px dashed var(--ink2);opacity:.6}
.marker{position:absolute;top:4px;bottom:4px;width:48px;border-radius:8px;background:var(--ink);color:var(--bg);display:grid;place-items:center;cursor:grab;touch-action:none}
.marker:active{cursor:grabbing}
.marker span{display:block;width:2px;height:18px;background:var(--bg);box-shadow:5px 0 0 var(--bg),-5px 0 0 var(--bg);opacity:.85}
.track.solved{border-color:var(--ok)}
.track.solved .marker{background:var(--ok);box-shadow:var(--glow)}
.track.miss{animation:shake .32s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@media (prefers-reduced-motion:reduce){.track.miss{animation:none}.dot{animation:none}}
.checkstate{margin:9px 0 0;font-size:14px;color:var(--ink2);min-height:20px}
.checkstate.good{color:var(--ok);font-weight:600}
.checkstate.bad{color:var(--bad)}
.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.publishbar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding-top:18px;border-top:1px solid var(--line-soft)}
.msg{font-size:14px;color:var(--bad);flex:1;min-width:200px}
.msg.good{color:var(--ok)}

/* feed */
.feedhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.feedhead h2{margin:0;font-size:22px;font-weight:700;font-stretch:112%;letter-spacing:-.02em}
.feedhead .n{color:var(--ink2);font-size:15px}
.feedhead input{max-width:250px;margin-left:auto;padding:9px 12px}
.tagbar{margin-bottom:18px}
.feed{list-style:none;margin:0 0 40px;padding:0;position:relative}
.feed::before{content:"";position:absolute;left:7px;top:8px;bottom:8px;width:1px;background:var(--line)}
.post{position:relative;padding-left:34px;margin-bottom:26px;scroll-margin-top:90px}
.post::before{content:"";position:absolute;left:2px;top:9px;width:11px;height:11px;border-radius:50%;background:var(--bg);border:2px solid var(--ink2)}
.post.fresh::before{border-color:var(--live);background:var(--live);box-shadow:var(--glow)}
.post .card{padding:16px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);background-image:var(--sheen)}
.post.flash .card{border-color:var(--signal);box-shadow:var(--glow)}
.meta{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;font-size:13.5px;color:var(--ink2);margin-bottom:8px}
.meta time{font-weight:600;color:var(--ink)}
.badge{border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-size:12px;color:var(--ink2)}
.place{display:flex;gap:7px;align-items:flex-start;font-size:15px;margin-bottom:10px}
.place svg{flex:none;margin-top:3px}
.place a{text-decoration:none;border-bottom:1px solid color-mix(in srgb,var(--signal) 40%,transparent)}
.body{margin:0 0 12px;font-size:16.5px;line-height:1.48;max-width:64ch;white-space:pre-wrap;overflow-wrap:anywhere}
.grid{display:grid;gap:6px;grid-template-columns:repeat(3,1fr)}
.grid.n1{grid-template-columns:1fr}
.grid.n2{grid-template-columns:repeat(2,1fr)}
.cell{position:relative;padding:0;border:0;background:var(--panel2);border-radius:8px;overflow:hidden;aspect-ratio:1;cursor:zoom-in}
.grid.n1 .cell{aspect-ratio:16/10}
.cell img{width:100%;height:100%;object-fit:cover}
.cell .more{position:absolute;inset:0;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center;font-size:20px;font-weight:600}
.vids{display:grid;gap:8px}
.vidwrap{border-radius:8px;overflow:hidden;background:#000;position:relative}
.vidwrap video{width:100%;max-height:420px;background:#000}
.vidoff{padding:26px 16px;color:#D8DEE6;font-size:14px;text-align:center;background:#000 center/cover no-repeat}
.posttags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.posttags button{background:none;border:0;padding:0;color:var(--signal);cursor:pointer;font-size:14px}
.posttags button:hover{text-decoration:underline}
.tools{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;align-items:center;font-size:13.5px;color:var(--ink2)}
.tools .lnk{background:none;border:0;padding:0;color:var(--ink2);cursor:pointer;border-bottom:1px solid var(--line)}
.tools .lnk:hover{color:var(--ink)}
.share{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.share a,.share button{width:32px;height:32px;display:grid;place-items:center;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:var(--ink2);cursor:pointer;text-decoration:none}
.share a:hover,.share button:hover{color:var(--ink);border-color:var(--signal)}
.share svg{width:15px;height:15px;fill:currentColor}
.empty{padding:34px 20px;text-align:center;color:var(--ink2);border:1px dashed var(--line);border-radius:var(--r);background:var(--panel)}

/* lightbox */
.lb{position:fixed;inset:0;background:rgba(0,0,0,.93);display:none;z-index:80;place-items:center}
.lb.on{display:grid}
.lb img{max-width:94vw;max-height:84vh;object-fit:contain;border-radius:6px}
.lb .nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.12);border:0;color:#fff;width:46px;height:46px;border-radius:50%;cursor:pointer;font-size:22px}
.lb .prev{left:14px}.lb .next{right:14px}
.lb .close{position:absolute;top:14px;right:14px;background:none;border:0;color:#fff;font-size:26px;cursor:pointer}
.lb .idx{position:absolute;bottom:18px;left:0;right:0;text-align:center;color:#B9C6CF;font-size:14px}

footer{border-top:1px solid var(--line);padding:22px 0 46px;font-size:14px;color:var(--ink2)}
footer p{margin:0 0 8px;max-width:70ch}

/* globe page */
.globegrid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(280px,1fr);gap:22px;align-items:start}
.globebox{position:relative;background:radial-gradient(circle at 50% 40%,var(--panel2),var(--bg) 72%);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;touch-action:none}
#globe{width:100%;height:auto;display:block;cursor:grab}
#globe:active{cursor:grabbing}
.globehud{position:absolute;left:12px;bottom:12px;font-size:13px;color:var(--ink2);background:color-mix(in srgb,var(--bg) 70%,transparent);padding:5px 10px;border-radius:999px;border:1px solid var(--line)}
.bars{display:flex;align-items:flex-end;gap:3px;height:46px;margin-top:14px}
.bars div{flex:1;background:var(--line);border-radius:2px 2px 0 0;min-height:2px}
.bars div.hot{background:var(--signal);box-shadow:var(--glow)}
.barlab{display:flex;justify-content:space-between;font-size:12px;color:var(--ink2);margin-top:6px}
.sidelist{list-style:none;margin:0;padding:0;max-height:520px;overflow:auto}
.sidelist li{margin-bottom:8px}
.sidelist button{width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;color:var(--ink);display:grid;gap:3px}
.sidelist button:hover{border-color:var(--signal)}
.sidelist button[aria-current="true"]{border-color:var(--signal);box-shadow:var(--glow)}
.sidelist .s1{font-size:14.5px;font-weight:600}
.sidelist .s2{font-size:13px;color:var(--ink2)}
.detail{margin-top:22px}
@media(max-width:820px){.globegrid{grid-template-columns:1fr}.sidelist{max-height:340px}}
@media(max-width:560px){.composer{padding:16px}.feedhead input{margin-left:0;max-width:100%;width:100%}.share{margin-left:0}}

</style>
</head>
<body>
<header class="top"></header>

<main class="wrap">
  <section class="hero">
    <h1><span data-i18n="h1"></span><span class="h-sub" data-i18n="lead"></span></h1>
  </section>

  <section class="panel composer" id="composer">
    <div class="field">
      <div class="flabel"><h2 data-i18n="l_media"></h2><span class="req" data-i18n="req"></span></div>
      <div class="seg" role="group">
        <button type="button" id="modePhotos" data-i18n="opt_photos" aria-pressed="true"></button>
        <button type="button" id="modeVideos" data-i18n="opt_videos" aria-pressed="false"></button>
      </div>
      <p class="hint" id="mediaHint"></p>
      <div class="row" style="margin-top:12px">
        <button type="button" class="btn" id="pick" data-i18n="add_files"></button>
        <button type="button" class="btn quiet" id="clearMedia" data-i18n="clear_files" hidden></button>
      </div>
      <input type="file" id="file" accept="image/*" multiple hidden>
      <div class="thumbs" id="thumbs"></div>
      <p class="count" id="mediaCount"></p>
    </div>

    <div class="field">
      <div class="flabel"><h2 data-i18n="l_text"></h2><span class="req" data-i18n="req"></span></div>
      <textarea id="text" maxlength="280" data-i18n-ph="ph_text"></textarea>
      <div class="chars"><span id="chars">280</span></div>
    </div>

    <div class="field">
      <div class="flabel"><h2 data-i18n="l_place"></h2><span class="req" data-i18n="req"></span></div>
      <input type="text" id="place" maxlength="120" data-i18n-ph="ph_place" autocomplete="off">
      <div class="row" style="margin-top:10px">
        <button type="button" class="btn quiet" id="geoBtn" data-i18n="geo_btn"></button>
      </div>
      <p class="geo" id="geoOut"></p>
    </div>

    <div class="field">
      <div class="flabel"><h2 data-i18n="l_tags"></h2><span class="req" data-i18n="req"></span></div>
      <p class="hint" data-i18n="tags_hint"></p>
      <div class="chips" id="tagPick" style="margin-top:10px"></div>
      <div class="tagline">
        <input type="text" id="customTag" maxlength="24" data-i18n-ph="ph_custom" autocomplete="off">
        <button type="button" class="btn quiet" id="addTag" data-i18n="add_tag"></button>
      </div>
    </div>

    <div class="field">
      <div class="flabel"><h2 data-i18n="l_check"></h2><span class="req" data-i18n="req"></span></div>
      <p class="hint" data-i18n="check_hint"></p>
      <div class="track" id="track">
        <div class="notch" id="notch"></div>
        <div class="marker" id="marker" tabindex="0" role="slider" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" data-i18n-aria="check_aria"><span></span></div>
      </div>
      <p class="checkstate" id="checkState"></p>
      <input class="hp" id="hp" type="text" tabindex="-1" autocomplete="off" aria-hidden="true">
    </div>

    <div class="publishbar">
      <button type="button" class="btn primary" id="publish" data-i18n="publish"></button>
      <p class="msg" id="msg" role="status" aria-live="polite"></p>
    </div>
  </section>

  <section>

var store = {
  get:function(k, d){ try{ var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set:function(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } },
  raw:function(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  rawSet:function(k, v){ try{ localStorage.setItem(k, v); }catch(e){} }
};
var OWNER = (function(){
  var id = store.raw('jh_owner');
  if (!id){ id = 'o' + Math.random().toString(36).slice(2) + Date.now().toString(36); store.rawSet('jh_owner', id); }
  return id;
})();
function loadPosts(){ var p = store.get('jh_posts_v2', []); return Array.isArray(p) ? p : []; }
function savePosts(posts, onTrim){
  var copy = posts.slice();
  while (copy.length){
    if (store.set('jh_posts_v2', copy)){ if (copy.length < posts.length && onTrim) onTrim(); return copy; }
    copy = copy.slice(0, copy.length - 1);
  }
  store.set('jh_posts_v2', []);
  return [];
}

function tagLabel(key){
  for (var i = 0; i < TAGS.length; i++) if (TAGS[i][0] === key)
    return TAGS[i][lang === 'ru' ? 2 : lang === 'hy' ? 3 : 1];
  return key;
}
function customTags(){ var c = store.get('jh_customtags', []); return Array.isArray(c) ? c : []; }
function addCustomTag(raw){
  var key = String(raw).toLowerCase().replace(/^#+/, '').replace(/[^\p{L}\p{N}_-]/gu, '').slice(0, 24);
  if (key.length < 2) return null;
  if (TAGS.some(function(x){ return x[0] === key; })) return key;
  var c = customTags();
  if (c.indexOf(key) < 0){ c.push(key); store.set('jh_customtags', c); }
  return key;
}

function rng(seed){ return function(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0; var x = Math.imul(seed ^ seed >>> 15, 1 | seed); x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x; return ((x ^ x >>> 14) >>> 0) / 4294967296; }; }
var SCENES = {
  city:   { sky:['#7ba3c9','#d6e2ec'], sun:'#fff3d0', far:'#5c728a', near:'#33455a', ground:'#26313d', lit:'#ffe9a8' },

function scenePhoto(kind, seed){
  var p = SCENES[kind] || SCENES.city, r = rng(seed * 7919 + 13), W = 900, H = 675, s = [];
  s.push('<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+p.sky[0]+'"/><stop offset="1" stop-color="'+p.sky[1]+'"/></linearGradient>');
  s.push('<radialGradient id="v" cx="0.5" cy="0.45" r="0.75"><stop offset="0.55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.42"/></radialGradient></defs>');
  s.push('<rect width="'+W+'" height="'+H+'" fill="url(#g)"/>');
  var sx = 120 + r() * 660, sy = 90 + r() * 130;
  s.push('<circle cx="'+sx.toFixed(0)+'" cy="'+sy.toFixed(0)+'" r="'+(28 + r() * 26).toFixed(0)+'" fill="'+p.sun+'" opacity="0.85"/>');
  if (kind === 'aurora'){
    for (var a = 0; a < 4; a++){
      var yy = 120 + a * 46 + r() * 30;
      s.push('<path d="M0 '+yy.toFixed(0)+' C 200 '+(yy-70).toFixed(0)+', 420 '+(yy+60).toFixed(0)+', 900 '+(yy-40).toFixed(0)+'" stroke="'+p.lit+'" stroke-width="'+(14 + r()*22).toFixed(0)+'" fill="none" opacity="'+(0.18 + r()*0.2).toFixed(2)+'"/>');
    }
  }
  if (kind === 'night' || kind === 'aurora'){
    for (var st = 0; st < 60; st++) s.push('<circle cx="'+(r()*W).toFixed(0)+'" cy="'+(r()*H*0.55).toFixed(0)+'" r="'+(0.6 + r()*1.5).toFixed(1)+'" fill="#fff" opacity="'+(0.25 + r()*0.6).toFixed(2)+'"/>');
  }
  var hz = H * (0.56 + r() * 0.08);
  var ridge = 'M0 ' + hz.toFixed(0);
  for (var x = 0; x <= W; x += 60) ridge += ' L' + x + ' ' + (hz - 30 - r() * 90).toFixed(0);
  ridge += ' L' + W + ' ' + H + ' L0 ' + H + ' Z';
  s.push('<path d="' + ridge + '" fill="' + p.far + '" opacity="0.9"/>');
  if (kind === 'city' || kind === 'night' || kind === 'street' || kind === 'fire'){
    var bx = -20;
    while (bx < W){
      var bw = 40 + r() * 90, bh = 70 + r() * 220, by = hz - bh + 40;
      s.push('<rect x="'+bx.toFixed(0)+'" y="'+by.toFixed(0)+'" width="'+bw.toFixed(0)+'" height="'+(bh + 200).toFixed(0)+'" fill="'+p.near+'"/>');
      for (var w = 0; w < 14; w++){
        if (r() > 0.55) continue;
        var wx = bx + 8 + r() * (bw - 18), wy = by + 12 + r() * (bh - 24);
        s.push('<rect x="'+wx.toFixed(0)+'" y="'+wy.toFixed(0)+'" width="7" height="10" fill="'+p.lit+'" opacity="'+(0.35 + r()*0.6).toFixed(2)+'"/>');
      }
      bx += bw + 8 + r() * 16;
    }
  }
  s.push('<rect x="0" y="'+(H*0.82).toFixed(0)+'" width="'+W+'" height="'+(H*0.18).toFixed(0)+'" fill="'+p.ground+'"/>');
  if (kind === 'market'){
    for (var aw = 0; aw < 5; aw++){
      var ax = 30 + aw * 175 + r() * 40, ay = H * 0.6 + r() * 30, aw2 = 120 + r() * 60;
      s.push('<path d="M'+ax.toFixed(0)+' '+ay.toFixed(0)+' l'+(aw2/2).toFixed(0)+' -46 l'+(aw2/2).toFixed(0)+' 46 z" fill="'+p.lit+'" opacity="0.55"/>');
      s.push('<rect x="'+ax.toFixed(0)+'" y="'+ay.toFixed(0)+'" width="'+aw2.toFixed(0)+'" height="'+(H*0.24).toFixed(0)+'" fill="'+p.near+'" opacity="0.85"/>');
    }
  }
  var crowd = { market:14, street:11, city:9, park:7, snow:6, water:5, night:8, fire:6, aurora:3 }[kind] || 6;
  for (var c2 = 0; c2 < crowd; c2++){
    var px = r() * W, sc = 0.7 + r() * 0.9, base = H * (0.86 + r() * 0.1);
    s.push('<g fill="#000" opacity="'+(0.55 + r()*0.3).toFixed(2)+'">'
      + '<circle cx="'+px.toFixed(0)+'" cy="'+(base - 46*sc).toFixed(0)+'" r="'+(8*sc).toFixed(1)+'"/>'
      + '<rect x="'+(px - 9*sc).toFixed(0)+'" y="'+(base - 36*sc).toFixed(0)+'" width="'+(18*sc).toFixed(0)+'" height="'+(36*sc).toFixed(0)+'" rx="'+(7*sc).toFixed(0)+'"/></g>');
  }
  if (kind === 'water' || kind === 'flood'){
    for (var q = 0; q < 8; q++) s.push('<rect x="'+(r()*W).toFixed(0)+'" y="'+(H*0.84 + r()*H*0.14).toFixed(0)+'" width="'+(50+r()*180).toFixed(0)+'" height="2" fill="'+p.lit+'" opacity="0.35"/>');
  }
  for (var f = 0; f < 5; f++){
    var fx = r() * W, fh = 40 + r() * 70;
    s.push('<ellipse cx="'+fx.toFixed(0)+'" cy="'+(H*0.9).toFixed(0)+'" rx="'+(10 + r()*14).toFixed(0)+'" ry="'+fh.toFixed(0)+'" fill="#000" opacity="'+(0.28 + r()*0.3).toFixed(2)+'"/>');
  }
  s.push('<rect width="'+W+'" height="'+H+'" fill="url(#v)"/>');
  return 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+W+' '+H+'">' + s.join('') + '</svg>');
}

  return typeof l === 'string' ? l : (l[lang] || l.en);
}

/* ---------------- helpers ---------------- */
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]; }); }
function ago(ts){
  var diff = (ts - Date.now()) / 1000;
  var rtf = new Intl.RelativeTimeFormat(lang, { numeric:'auto' });
  var u = [['year',31536000],['month',2592000],['day',86400],['hour',3600],['minute',60],['second',1]];
  for (var i = 0; i < u.length; i++)
    if (Math.abs(diff) >= u[i][1] || u[i][0] === 'second') return rtf.format(Math.round(diff / u[i][1]), u[i][0]);
}
function stamp(ts){
  return new Intl.DateTimeFormat(lang, { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' }).format(new Date(ts));
}
function postUrl(id, page){
  var base = location.href.split('#')[0].replace(/[^/]*$/, '');
  return base + (page || 'index.html') + '#' + id;
}
function shareText(p){
  var tags = (p.tags || []).map(function(k){ return '#' + k; }).join(' ');
  return textOf(p) + ' — ' + placeOf(p) + (tags ? ' ' + tags : '');
}
var SHARE = [
  { id:'x',  label:'X',        url:function(u,x){ return 'https://twitter.com/intent/tweet?text=' + x + '&url=' + u; },
    svg:'<path d="M17.5 2h3l-6.6 7.6L21.7 22h-6l-4.7-6.2L5.6 22h-3l7-8.1L2 2h6.2l4.3 5.7L17.5 2zm-1 18h1.7L7.6 3.7H5.8L16.5 20z"/>' },
  { id:'tg', label:'Telegram', url:function(u,x){ return 'https://t.me/share/url?url=' + u + '&text=' + x; },
    svg:'<path d="M21.9 4.3 18.7 20c-.2 1-.9 1.3-1.8.8l-4.9-3.6-2.4 2.3c-.3.3-.5.5-1 .5l.4-5 9-8.1c.4-.3-.1-.5-.6-.2L6.3 13.1 1.5 11.6c-1-.3-1-1 .2-1.5l19-7.3c.9-.3 1.6.2 1.2 1.5z"/>' },
  { id:'wa', label:'WhatsApp', url:function(u,x){ return 'https://wa.me/?text=' + x + '%20' + u; },
    svg:'<path d="M12 2a10 10 0 0 0-8.6 15L2 22l5.2-1.4A10 10 0 1 0 12 2zm5.6 14.1c-.2.7-1.3 1.3-1.9 1.3-.5 0-1.1.2-3.6-.8-3-1.3-4.9-4.4-5-4.6-.2-.2-1.2-1.6-1.2-3s.8-2.1 1-2.4c.3-.3.6-.4.8-.4h.6c.2 0 .5-.1.7.5l1 2.4c.1.2.1.4 0 .6l-.4.6c-.1.2-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.4 2.4 1.5.2.1.4.1.6-.1l.8-1c.2-.2.4-.2.6-.1l2.2 1c.2.1.4.2.4.3.1.2.1.7-.1 1z"/>' },

    svg:'<path d="M13.5 22v-8h2.7l.4-3.1h-3.1V8.9c0-.9.3-1.5 1.6-1.5h1.6V4.6c-.3 0-1.3-.1-2.4-.1-2.4 0-4 1.4-4 4.1v2.3H7.5V14h2.8v8h3.2z"/>' },
  { id:'vk', label:'VK',       url:function(u,x){ return 'https://vk.com/share.php?url=' + u + '&title=' + x; },
    svg:'<path d="M12.8 16.7c-5 0-8-3.5-8.2-9.2h2.6c.1 4.2 2 6 3.4 6.3V7.5h2.4v3.7c1.4-.2 2.9-1.8 3.4-3.7h2.4c-.4 2.3-2 3.9-3.1 4.6 1.1.5 3 2 3.7 4.6h-2.7c-.6-1.7-1.9-3.1-3.7-3.3v3.3h-.2z"/>' }
];
function shareBlock(p, tSelf){
  var u = encodeURIComponent(postUrl(p.id)), x = encodeURIComponent(shareText(p));
  var el = document.createElement('div'); el.className = 'share';
  SHARE.forEach(function(s){
    var a = document.createElement('a');
    a.href = s.url(u, x); a.target = '_blank'; a.rel = 'noopener';

    a.innerHTML = '<svg viewBox="0 0 24 24">' + s.svg + '</svg>';

  var c = document.createElement('button');
  c.type = 'button'; c.title = tSelf('copy'); c.setAttribute('aria-label', tSelf('copy'));
  c.innerHTML = '<svg viewBox="0 0 24 24"><path d="M9 2h9a2 2 0 0 1 2 2v11h-2V4H9V2zM5 6h9a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2zm0 2v12h9V8H5z"/></svg>';
  c.addEventListener('click', function(){

    if (navigator.share) { navigator.share({ text: shareText(p), url: url }).catch(function(){}); return; }
    if (navigator.clipboard) navigator.clipboard.writeText(url).catch(function(){});

/* ---------------- chrome (header) ---------------- */
var listeners = { lang:[], theme:[] };
function on(ev, fn){ listeners[ev].push(fn); }
function fire(ev, v){ listeners[ev].forEach(function(f){ f(v); }); }

function applyLang(next){
  lang = T[next] ? next : 'en';
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(function(el){ el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-ph]').forEach(function(el){ el.placeholder = t(el.dataset.i18nPh); });
  document.querySelectorAll('[data-i18n-aria]').forEach(function(el){ el.setAttribute('aria-label', t(el.dataset.i18nAria)); });
  document.querySelectorAll('.langs button').forEach(function(b){ b.setAttribute('aria-pressed', String(b.dataset.lang === lang)); });
  document.querySelectorAll('.thememenu button').forEach(function(b){
    var th = THEMES.filter(function(x){ return x.id === b.dataset.theme; })[0];
    if (th) b.lastChild.textContent = themeName(th);
  });
  var tb = document.querySelector('.themebtn .lbl'); if (tb) tb.textContent = t('theme');
  store.rawSet('jh_lang', lang);
  fire('lang', lang);
}

function initChrome(page){
  var head = document.querySelector('header.top');
  var pages = [['index.html','nav_feed'],['globe.html','nav_globe'],['how.html','nav_rules']];
  var html = '<div class="wrap wide topbar">'
    + '<a class="brand" href="./index.html"><span class="dot"></span>just happened</a>'
    + '<nav class="tabs">' + pages.map(function(p){
        return '<a href="./' + p[0] + '" data-i18n="' + p[1] + '"' + (p[0] === page ? ' aria-current="page"' : '') + '></a>';
      }).join('') + '</nav>'
    + '<span class="spacer"></span>'
    + '<div class="themebox"><button type="button" class="themebtn" aria-haspopup="true" aria-expanded="false"><span class="swatch"></span><span class="lbl"></span></button>'
    + '<div class="thememenu">' + THEMES.map(function(th){
        return '<button type="button" data-theme="' + th.id + '"><span class="chip" style="background:' + th.dot + '"></span><span></span></button>';
      }).join('') + '</div></div>'
    + '<div class="langs" role="group" aria-label="Language">'
    + '<button type="button" data-lang="en">EN</button><button type="button" data-lang="ru">RU</button><button type="button" data-lang="hy">ՀԱ</button>'
    + '</div></div>';
  head.innerHTML = html;

  head.querySelectorAll('.langs button').forEach(function(b){
    b.addEventListener('click', function(){ applyLang(b.dataset.lang); });
  });
  var btn = head.querySelector('.themebtn'), menu = head.querySelector('.thememenu');
  btn.addEventListener('click', function(e){
    e.stopPropagation();
    var open = menu.classList.toggle('on');
    btn.setAttribute('aria-expanded', String(open));
  });
  menu.querySelectorAll('button').forEach(function(b){
    b.addEventListener('click', function(){ applyTheme(b.dataset.theme); menu.classList.remove('on'); btn.setAttribute('aria-expanded','false'); });
  });
  document.addEventListener('click', function(){ menu.classList.remove('on'); btn.setAttribute('aria-expanded','false'); });

  applyTheme(store.raw('jh_theme') || 'blue-matte');
  var savedLang = store.raw('jh_lang');
  applyLang(savedLang || (navigator.language || 'en').slice(0,2).toLowerCase());
}

return {
  T:T, t:t, get lang(){ return lang; }, applyLang:applyLang, on:on,
  THEMES:THEMES, applyTheme:applyTheme, themeName:themeName,
  TAGS:TAGS, tagLabel:tagLabel, customTags:customTags, addCustomTag:addCustomTag,
  store:store, OWNER:OWNER, loadPosts:loadPosts, savePosts:savePosts,
  demoPosts:demoPosts, scenePhoto:scenePhoto,
  textOf:textOf, placeOf:placeOf, esc:esc, ago:ago, stamp:stamp,
  postUrl:postUrl, shareBlock:shareBlock, shareText:shareText,
  initChrome:initChrome
};
})();

</script>
<script>
var $ = function(id){ return document.getElementById(id); };
var t = JH.t;
JH.initChrome('index.html');

var demo = JH.demoPosts();
var mine = JH.loadPosts();
var sessionVideos = new Map();
function allPosts(){ return mine.concat(demo).sort(function(a,b){ return b.ts - a.ts; }); }

/* ---------- composer ---------- */
var state = { mode:'photos', photos:[], videos:[], lat:null, lng:null, tags:[] };
var file = $('file'), thumbs = $('thumbs'), mediaHint = $('mediaHint'),
    mediaCount = $('mediaCount'), clearMedia = $('clearMedia'), msg = $('msg');

$('modePhotos').addEventListener('click', function(){ setMode('photos'); });
$('modeVideos').addEventListener('click', function(){ setMode('videos'); });
function setMode(m){
  if (state.mode === m) return;
  state.mode = m;
  state.photos = []; state.videos.forEach(function(v){ URL.revokeObjectURL(v.url); }); state.videos = [];
  $('modePhotos').setAttribute('aria-pressed', String(m === 'photos'));
  $('modeVideos').setAttribute('aria-pressed', String(m === 'videos'));
  file.accept = m === 'photos' ? 'image/*' : 'video/*';
  mediaHint.textContent = t(m === 'photos' ? 'hint_photos' : 'hint_videos');
  drawThumbs(); updateCount();
}
$('pick').addEventListener('click', function(){ file.click(); });
clearMedia.addEventListener('click', function(){
  state.photos = []; state.videos.forEach(function(v){ URL.revokeObjectURL(v.url); }); state.videos = [];
  drawThumbs(); updateCount();
});

file.addEventListener('change', async function(){
  var list = Array.from(file.files || []); file.value = '';
  if (!list.length) return;
  if (state.mode === 'photos'){
    var imgs = list.filter(function(f){ return f.type.indexOf('image/') === 0; });
    if (imgs.length < list.length) flash(t('e_type_photos'), false);
    var room = 10 - state.photos.length, i;
    var slice = imgs.slice(0, room);
    for (i = 0; i < slice.length; i++){
      try{ state.photos.push({ src: await shrink(slice[i], 1400, .82) }); }catch(e){}
      drawThumbs(); updateCount();
    }
  } else {
    var vids = list.filter(function(f){ return f.type.indexOf('video/') === 0; });
    if (vids.length < list.length) flash(t('e_type_videos'), false);
    var room2 = 3 - state.videos.length, j;
    var slice2 = vids.slice(0, room2);
    for (j = 0; j < slice2.length; j++){
      var url = URL.createObjectURL(slice2[j]), meta = { duration:0, poster:'' };
      try{ meta = await probeVideo(url); }catch(e){}
      state.videos.push({ url:url, duration:meta.duration, poster:meta.poster });
      drawThumbs(); updateCount();
    }
  }
});

function shrink(f, max, q){
  return new Promise(function(res, rej){
    var url = URL.createObjectURL(f), im = new Image();
    im.onload = function(){
      var s = Math.min(1, max / Math.max(im.width, im.height));
      var c = document.createElement('canvas');
      c.width = Math.round(im.width * s); c.height = Math.round(im.height * s);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', q));
    };
    im.onerror = function(){ URL.revokeObjectURL(url); rej(new Error('image')); };
    im.src = url;
  });
}
function probeVideo(url){
  return new Promise(function(res, rej){
    var v = document.createElement('video');
    v.preload = 'metadata'; v.muted = true; v.playsInline = true;
    v.onloadedmetadata = function(){
      var duration = v.duration || 0;
      var grab = function(){
        var poster = '';
        try{
          var c = document.createElement('canvas');
          var s = Math.min(1, 640 / Math.max(v.videoWidth || 1, v.videoHeight || 1));
          c.width = Math.round((v.videoWidth || 320) * s); c.height = Math.round((v.videoHeight || 240) * s);
          c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
          poster = c.toDataURL('image/jpeg', .7);
        }catch(e){}
        res({ duration:duration, poster:poster });
      };
      v.onseeked = grab;
      try{ v.currentTime = Math.min(1, Math.max(0, duration / 3)); }catch(e){ grab(); }
      setTimeout(function(){ res({ duration:duration, poster:'' }); }, 2500);
    };
    v.onerror = function(){ rej(new Error('video')); };
    v.src = url;
  });
}
function drawThumbs(){
  thumbs.innerHTML = '';
  var items = state.mode === 'photos' ? state.photos : state.videos;
  clearMedia.hidden = items.length === 0;
  items.forEach(function(it, i){
    var d = document.createElement('div'); d.className = 'thumb';
    if (state.mode === 'photos'){
      var im = document.createElement('img'); im.src = it.src; im.alt = ''; d.appendChild(im);
    } else {
      if (it.poster){ var im2 = document.createElement('img'); im2.src = it.poster; im2.alt = ''; d.appendChild(im2); }
      var len = document.createElement('span'); len.className = 'len';
      len.textContent = it.duration ? it.duration.toFixed(1) + ' ' + t('sec') : '—';
      d.appendChild(len);
      if (it.duration && (it.duration < 14.5 || it.duration > 20.9)) d.classList.add('bad');
    }
    var k = document.createElement('button');
    k.className = 'kill'; k.type = 'button'; k.textContent = '×'; k.setAttribute('aria-label','remove');
    k.addEventListener('click', function(){
      if (state.mode === 'photos') state.photos.splice(i, 1);
      else { URL.revokeObjectURL(state.videos[i].url); state.videos.splice(i, 1); }
      drawThumbs(); updateCount();
    });
    d.appendChild(k); thumbs.appendChild(d);
  });
}
function updateCount(){
  var n = state.mode === 'photos' ? state.photos.length : state.videos.length;
  mediaCount.textContent = n ? t(state.mode === 'photos' ? 'count_photos' : 'count_videos', { n:n }) : '';
}

var text = $('text');
text.addEventListener('input', function(){ $('chars').textContent = 280 - text.value.length; });

$('geoBtn').addEventListener('click', function(){
  var out = $('geoOut');
  if (!navigator.geolocation){ out.textContent = t('geo_err'); return; }
  out.textContent = t('geo_wait');
  navigator.geolocation.getCurrentPosition(function(p){
    state.lat = p.coords.latitude; state.lng = p.coords.longitude;
    out.innerHTML = t('geo_ok') + '<b>' + state.lat.toFixed(5) + ', ' + state.lng.toFixed(5) + '</b>';
  }, function(){ out.textContent = t('geo_err'); }, { enableHighAccuracy:true, timeout:10000, maximumAge:60000 });
});

/* tag picker */
function tagKeys(){
  var base = JH.TAGS.map(function(x){ return x[0]; });
  var extra = JH.customTags().slice();
  allPosts().forEach(function(p){
    (p.tags || []).forEach(function(k){
      if (base.indexOf(k) < 0 && extra.indexOf(k) < 0) extra.push(k);
    });
  });
  return base.concat(extra);
}
function drawTagPick(){
  var box = $('tagPick'); box.innerHTML = '';
  tagKeys().forEach(function(k){
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'chip' + (JH.TAGS.some(function(x){ return x[0] === k; }) ? '' : ' custom');
    b.textContent = '#' + JH.tagLabel(k);
    b.setAttribute('aria-pressed', String(state.tags.indexOf(k) >= 0));
    b.addEventListener('click', function(){
      var i = state.tags.indexOf(k);
      if (i >= 0) state.tags.splice(i, 1); else state.tags.push(k);
      b.setAttribute('aria-pressed', String(state.tags.indexOf(k) >= 0));
    });
    box.appendChild(b);
  });
}
$('addTag').addEventListener('click', function(){
  var k = JH.addCustomTag($('customTag').value);
  if (!k) return;
  if (state.tags.indexOf(k) < 0) state.tags.push(k);
  $('customTag').value = '';
  drawTagPick(); drawTagBar();
});
$('customTag').addEventListener('keydown', function(e){ if (e.key === 'Enter'){ e.preventDefault(); $('addTag').click(); } });

/* ---------- human check ---------- */
var track = $('track'), notch = $('notch'), marker = $('marker'), checkState = $('checkState');
var openedAt = Date.now();
var guard = { solved:false, at:0, target:0, pos:0, path:[], keys:0, moves:0, failed:false };
var TOL = 9, MAX_AGE = 5 * 60 * 1000;
function range(){ return Math.max(40, track.clientWidth - marker.offsetWidth - 8); }
function placeNotch(){ var r = range(); guard.target = Math.round(r * (0.45 + Math.random() * 0.47)); notch.style.left = (guard.target + 4) + 'px'; }
function setPos(px){
  guard.pos = Math.max(0, Math.min(range(), px));
  marker.style.left = (guard.pos + 4) + 'px';
  marker.setAttribute('aria-valuenow', Math.round(guard.pos / range() * 100));
}
function resetCheck(){ guard.solved = false; guard.path = []; guard.failed = false; track.classList.remove('solved'); placeNotch(); setPos(0); }
function paintCheckState(){
  checkState.className = 'checkstate';
  if (guard.solved){ checkState.classList.add('good'); checkState.textContent = t('check_done'); }
  else if (guard.failed){ checkState.classList.add('bad'); checkState.textContent = t('check_retry'); }
  else checkState.textContent = '';
}
function humanPath(){
  var p = guard.path;
  if (p.length < 9) return false;
  var span = p[p.length-1].t - p[0].t;
  if (span < 260 || span > 40000) return false;
  var gaps = [], i;
  for (i = 1; i < p.length; i++) gaps.push(p[i].t - p[i-1].t);
  var mean = gaps.reduce(function(a,b){ return a+b; }, 0) / gaps.length;
  if (mean <= 0) return false;
  var varr = gaps.reduce(function(a,b){ return a + (b-mean)*(b-mean); }, 0) / gaps.length;
  return Math.sqrt(varr) / mean > 0.08;
}
function judge(){
  if (Math.abs(guard.pos - guard.target) <= TOL && humanPath()){
    guard.solved = true; guard.at = Date.now(); guard.failed = false;
    track.classList.add('solved'); setPos(guard.target);
  } else {
    guard.solved = false; guard.failed = true;
    track.classList.remove('solved'); track.classList.add('miss');
    setTimeout(function(){ track.classList.remove('miss'); }, 340);
    guard.path = []; placeNotch(); setPos(0);
  }
  paintCheckState();
}
var dragging = false, grabDx = 0;
marker.addEventListener('pointerdown', function(e){
  if (!e.isTrusted) return;
  dragging = true; guard.path = [];
  grabDx = e.clientX - marker.getBoundingClientRect().left;
  marker.setPointerCapture(e.pointerId);
  track.classList.remove('solved'); guard.solved = false;
});
marker.addEventListener('pointermove', function(e){
  if (!dragging || !e.isTrusted) return;
  guard.moves++;
  setPos(e.clientX - track.getBoundingClientRect().left - grabDx - 4);
  guard.path.push({ x:guard.pos, t:performance.now() });
  if (guard.path.length > 400) guard.path.shift();
});
marker.addEventListener('pointerup', function(e){
  if (!dragging) return;
  dragging = false;
  try{ marker.releasePointerCapture(e.pointerId); }catch(err){}
  judge();
});
marker.addEventListener('pointercancel', function(){ dragging = false; });
marker.addEventListener('keydown', function(e){
  if (!e.isTrusted) return;
  var step = e.shiftKey ? 12 : 4;
  if (e.key === 'ArrowRight' || e.key === 'ArrowLeft'){
    e.preventDefault(); guard.keys++;
    setPos(guard.pos + (e.key === 'ArrowRight' ? step : -step));
    guard.path.push({ x:guard.pos, t:performance.now() });
    track.classList.remove('solved'); guard.solved = false;
  }
  if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); judge(); }
});
window.addEventListener('resize', function(){ if (!guard.solved) resetCheck(); });

/* ---------- publish ---------- */
function flash(m, good){ msg.textContent = m; msg.className = 'msg' + (good ? ' good' : ''); }
$('publish').addEventListener('click', function(){
  var items = state.mode === 'photos' ? state.photos : state.videos;
  if (state.mode === 'photos' && (items.length < 5 || items.length > 10)) return flash(t('e_photos'), false);
  if (state.mode === 'videos'){
    if (items.length < 2 || items.length > 3) return flash(t('e_videos'), false);
    var bad = items.filter(function(v){ return v.duration < 14.5 || v.duration > 20.9; });
    if (bad.length) return flash(t('e_vlen') + bad.map(function(v){ return v.duration.toFixed(1) + ' ' + t('sec'); }).join(', '), false);
  }
  var body = text.value.trim();
  if (body.length < 3) return flash(t('e_text'), false);
  var place = $('place').value.trim();
  if (place.length < 3 && state.lat === null) return flash(t('e_place'), false);
  if (!state.tags.length) return flash(t('e_tags'), false);
  if ($('hp').value !== '') return flash(t('e_check'), false);
  if (Date.now() - openedAt < 5000) return flash(t('e_fast'), false);
  if (!guard.solved) return flash(t('e_check'), false);
  if (Date.now() - guard.at > MAX_AGE){ resetCheck(); checkState.className = 'checkstate bad'; checkState.textContent = t('check_stale'); return flash(t('e_check'), false); }
  if (guard.moves < 12 && guard.keys < 10) return flash(t('e_check'), false);

  var id = 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  var post = {
    id:id, ts:Date.now(), owner:JH.OWNER, text:body, tags:state.tags.slice(),
    place:{ label:place, lat:state.lat, lng:state.lng },
    type:state.mode,
    media: state.mode === 'photos'
      ? state.photos.map(function(p){ return { src:p.src }; })
      : state.videos.map(function(v){ return { poster:v.poster, duration:v.duration }; })
  };
  if (state.mode === 'videos') sessionVideos.set(id, state.videos.map(function(v){ return v.url; }));

  mine.unshift(post);
  mine = JH.savePosts(mine, function(){ flash(t('e_full'), false); });

  state.photos = []; state.videos = []; state.lat = null; state.lng = null; state.tags = [];
  text.value = ''; $('chars').textContent = 280; $('place').value = ''; $('geoOut').textContent = '';
  drawThumbs(); updateCount(); drawTagPick(); drawTagBar(); resetCheck(); paintCheckState();
  render();
  flash(t('posted'), true);
  var el = document.getElementById(id);
  if (el) el.scrollIntoView({ behavior:'smooth', block:'center' });
});

/* ---------- feed ---------- */
var feed = $('feed'), filterInput = $('filter'), activeTags = [];
filterInput.addEventListener('input', render);

function drawTagBar(){
  var bar = $('tagBar'); bar.innerHTML = '';
  var used = {};
  allPosts().forEach(function(p){ (p.tags || []).forEach(function(k){ used[k] = (used[k] || 0) + 1; }); });
  var all = document.createElement('button');
  all.type = 'button'; all.className = 'chip'; all.textContent = t('all_tags');
  all.setAttribute('aria-pressed', String(activeTags.length === 0));
  all.addEventListener('click', function(){ activeTags = []; drawTagBar(); render(); });
  bar.appendChild(all);
  tagKeys().forEach(function(k){
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'chip' + (JH.TAGS.some(function(x){ return x[0] === k; }) ? '' : ' custom');
    b.textContent = '#' + JH.tagLabel(k) + (used[k] ? ' ' + used[k] : '');
    b.setAttribute('aria-pressed', String(activeTags.indexOf(k) >= 0));
    b.addEventListener('click', function(){
      var i = activeTags.indexOf(k);
      if (i >= 0) activeTags.splice(i, 1); else activeTags.push(k);
      drawTagBar(); render();
    });
    bar.appendChild(b);
  });
}

var pin = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s7-7.6 7-13a7 7 0 1 0-14 0c0 5.4 7 13 7 13z"/><circle cx="12" cy="9" r="2.5"/></svg>';

function render(){
  var q = filterInput.value.trim().toLowerCase();
  var list = allPosts().filter(function(p){
    if (activeTags.length && !(p.tags || []).some(function(k){ return activeTags.indexOf(k) >= 0; })) return false;
    if (!q) return true;
    var hay = (JH.textOf(p) + ' ' + JH.placeOf(p) + ' ' + (p.tags || []).map(JH.tagLabel).join(' ')).toLowerCase();
    return hay.indexOf(q) >= 0;
  });
  $('feedCount').textContent = t('feed_n', { n:allPosts().length });
  feed.innerHTML = '';
  if (!list.length){
    var li = document.createElement('li');
    li.innerHTML = '<div class="empty">' + ((q || activeTags.length) ? t('empty_filter') : t('empty')) + '</div>';
    feed.appendChild(li); return;
  }
  list.forEach(function(p){ feed.appendChild(card(p)); });
  highlightFromHash();
}

function card(p){
  var li = document.createElement('li');
  li.className = 'post' + (Date.now() - p.ts < 3600000 ? ' fresh' : '');
  li.id = p.id;
  var c = document.createElement('div'); c.className = 'card';

  var meta = document.createElement('div'); meta.className = 'meta';
  meta.innerHTML = '<time datetime="' + new Date(p.ts).toISOString() + '">' + JH.ago(p.ts) + '</time><span>' + JH.stamp(p.ts) + '</span>'
    + (p.demo ? '<span class="badge">' + t('demo') + '</span>' : '');
  c.appendChild(meta);

  var place = document.createElement('div'); place.className = 'place';
  var inner = pin + '<span>' + JH.esc(JH.placeOf(p)) + '</span>';
  if (p.place && p.place.lat !== null && p.place.lat !== undefined){
    var u = 'https://www.openstreetmap.org/?mlat=' + p.place.lat + '&mlon=' + p.place.lng + '#map=15/' + p.place.lat + '/' + p.place.lng;
    inner += '<a href="' + u + '" target="_blank" rel="noopener">' + p.place.lat.toFixed(4) + ', ' + p.place.lng.toFixed(4) + '</a>';
  }
  place.innerHTML = inner; c.appendChild(place);

  var body = document.createElement('p'); body.className = 'body'; body.textContent = JH.textOf(p);
  c.appendChild(body);

  c.appendChild(p.type === 'photos' ? photoGrid(p) : videoBlock(p));

  if ((p.tags || []).length){
    var tg = document.createElement('div'); tg.className = 'posttags';
    p.tags.forEach(function(k){
      var b = document.createElement('button'); b.type = 'button'; b.textContent = '#' + JH.tagLabel(k);
      b.addEventListener('click', function(){
        activeTags = [k]; drawTagBar(); render();
        window.scrollTo({ top: $('tagBar').getBoundingClientRect().top + window.scrollY - 80, behavior:'smooth' });
      });
      tg.appendChild(b);
    });
    c.appendChild(tg);
  }

  var tools = document.createElement('div'); tools.className = 'tools';
  if (p.place && p.place.lat !== null && p.place.lat !== undefined){
    var g = document.createElement('a');
    g.href = './globe.html#' + p.id; g.className = 'lnk'; g.style.color = 'inherit'; g.style.textDecoration = 'none';
    g.textContent = t('on_globe'); tools.appendChild(g);
  }
  if (p.owner === JH.OWNER){
    var del = document.createElement('button'); del.type = 'button'; del.className = 'lnk'; del.textContent = t('del');
    del.addEventListener('click', function(){
      if (!confirm(t('del_confirm'))) return;
      (sessionVideos.get(p.id) || []).forEach(function(u2){ URL.revokeObjectURL(u2); });
      sessionVideos.delete(p.id);
      mine = mine.filter(function(x){ return x.id !== p.id; });
      mine = JH.savePosts(mine);
      drawTagBar(); render();
    });
    tools.appendChild(del);
  }
  tools.appendChild(JH.shareBlock(p, t));
  c.appendChild(tools);

  li.appendChild(c);
  return li;
}

function photoGrid(p){
  var g = document.createElement('div');
  var shown = p.media.slice(0, 6);
  g.className = 'grid' + (shown.length === 1 ? ' n1' : shown.length === 2 ? ' n2' : '');
  shown.forEach(function(m, i){
    var b = document.createElement('button'); b.type = 'button'; b.className = 'cell';
    var im = document.createElement('img'); im.src = m.src; im.alt = ''; im.loading = 'lazy';
    b.appendChild(im);
    if (i === 5 && p.media.length > 6){
      var more = document.createElement('span'); more.className = 'more'; more.textContent = '+' + (p.media.length - 6);
      b.appendChild(more);
    }
    b.addEventListener('click', function(){ openLb(p.media.map(function(x){ return x.src; }), i); });
    g.appendChild(b);
  });
  return g;
}
function videoBlock(p){
  var wrap = document.createElement('div'); wrap.className = 'vids';
  var urls = sessionVideos.get(p.id) || [];
  p.media.forEach(function(m, i){
    var box = document.createElement('div'); box.className = 'vidwrap';
    if (urls[i]){
      var v = document.createElement('video');
      v.src = urls[i]; v.controls = true; v.playsInline = true; v.preload = 'metadata';
      if (m.poster) v.poster = m.poster;
      box.appendChild(v);
    } else {
      var off = document.createElement('div'); off.className = 'vidoff';
      if (m.poster) off.style.backgroundImage = 'linear-gradient(rgba(0,0,0,.72),rgba(0,0,0,.72)),url(' + m.poster + ')';
      off.innerHTML = '<div>' + t('vid_offline') + '</div>';
      box.appendChild(off);
    }
    wrap.appendChild(box);
  });
  return wrap;
}

function highlightFromHash(){
  var id = location.hash.slice(1);
  if (!id) return;
  var el = document.getElementById(id);
  if (!el) return;
  el.classList.add('flash');
  el.scrollIntoView({ block:'center' });
  setTimeout(function(){ el.classList.remove('flash'); }, 2600);
}
window.addEventListener('hashchange', highlightFromHash);

/* ---------- lightbox ---------- */
var lb = $('lb'), lbImg = $('lbImg'), lbIdx = $('lbIdx'), lbList = [], lbAt = 0;
function openLb(list, i){ lbList = list; lbAt = i; lb.classList.add('on'); paintLb(); }
function paintLb(){ lbImg.src = lbList[lbAt]; lbIdx.textContent = (lbAt + 1) + ' / ' + lbList.length; }
function closeLb(){ lb.classList.remove('on'); lbImg.src = ''; }
$('lbClose').addEventListener('click', closeLb);
$('lbPrev').addEventListener('click', function(){ lbAt = (lbAt - 1 + lbList.length) % lbList.length; paintLb(); });
$('lbNext').addEventListener('click', function(){ lbAt = (lbAt + 1) % lbList.length; paintLb(); });
lb.addEventListener('click', function(e){ if (e.target === lb) closeLb(); });
document.addEventListener('keydown', function(e){
  if (!lb.classList.contains('on')) return;
  if (e.key === 'Escape') closeLb();
  if (e.key === 'ArrowLeft'){ lbAt = (lbAt - 1 + lbList.length) % lbList.length; paintLb(); }
  if (e.key === 'ArrowRight'){ lbAt = (lbAt + 1) % lbList.length; paintLb(); }
});

/* ---------- boot ---------- */
JH.on('lang', function(){
  mediaHint.textContent = t(state.mode === 'photos' ? 'hint_photos' : 'hint_videos');
  updateCount(); paintCheckState(); drawTagPick(); drawTagBar(); render();
});
resetCheck();
drawThumbs(); drawTagPick(); drawTagBar(); render();
setInterval(render, 60000);
</script>
</body>
</html>
