<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SimProof — профиль</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23ECEAE3'/%3E%3Ccircle cx='12' cy='16' r='7' fill='none' stroke='%23C97A2E' stroke-width='2.2'/%3E%3Crect x='15' y='9' width='12' height='12' fill='none' stroke='%233E4DE0' stroke-width='2.2'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#ECEAE3; --ink:#171A16; --ink-soft:#5A5E54; --line:#c9c7ba;
    --signal:#3E4DE0; --signal-soft:#e2e5fb; --human:#c97a2e; --human-soft:#f6e6d1;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;line-height:1.55;font-size:17px}
  a{color:inherit}
  .wrap{max-width:840px;margin:0 auto;padding:0 28px}
  header.top{display:flex;align-items:center;justify-content:space-between;padding:22px 28px;border-bottom:1px solid var(--line)}
  .mark{font-family:'Fraunces',serif;font-weight:700;font-size:22px;text-decoration:none}
  .lang{display:flex;gap:6px;font-family:'IBM Plex Mono',monospace;font-size:12.5px}
  .lang a{padding:4px 7px;border:1px solid var(--line);border-radius:3px;text-decoration:none;color:var(--ink-soft)}
  .lang a.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .back{font-family:'IBM Plex Mono',monospace;font-size:13px;text-decoration:none;color:var(--ink-soft)}

  .head{padding:34px 28px 0}
  h1{font-family:'Fraunces',serif;font-weight:600;font-size:clamp(28px,4vw,40px);margin:14px 0 6px}
  .location{color:var(--ink-soft);font-size:15px;margin:0 0 20px}

  .mode-toggle{display:inline-flex;border:1px solid var(--ink);border-radius:3px;overflow:hidden;margin-bottom:28px;font-family:'IBM Plex Mono',monospace;font-size:13px}
  .mode-toggle button{padding:9px 16px;border:none;background:transparent;color:var(--ink);cursor:pointer}
  .mode-toggle button.active{background:var(--ink);color:var(--paper)}

  .panel{padding:0 28px 6px}
  .panel h2{font-family:'Fraunces',serif;font-size:20px;margin:0 0 10px}
  .panel p{color:var(--ink-soft);font-size:15.5px;margin:0 0 26px;max-width:60ch}

  .skills{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 30px;padding:0 28px}
  .skills span{font-family:'IBM Plex Mono',monospace;font-size:12.5px;border:1px solid var(--line);padding:5px 10px;border-radius:3px;color:var(--ink-soft)}

  .works-title{padding:0 28px;font-family:'Fraunces',serif;font-size:20px;margin:6px 0 16px}
  .works{padding:0 28px 10px;display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .wcard{border:1px solid var(--line);background:#fff;padding:16px;text-decoration:none;color:var(--ink);display:block}
  .wcard:hover{border-color:var(--ink)}
  .wcard h3{font-family:'Fraunces',serif;font-size:16.5px;margin:0 0 6px}
  .wcard p{color:var(--ink-soft);font-size:13.5px;margin:0}

  .contact{margin:30px 28px 60px;padding:20px;border:1px solid var(--ink);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px}
  .contact p{margin:0;color:var(--ink-soft);font-size:14.5px;max-width:40ch}
  .contact button{font-family:'IBM Plex Mono',monospace;font-size:13.5px;padding:11px 18px;border-radius:3px;border:none;background:var(--signal);color:#fff;cursor:pointer}

  footer{border-top:1px solid var(--line);padding:24px 28px 50px;color:var(--ink-soft);font-size:13.5px;font-family:'IBM Plex Mono',monospace;display:none}

  @media(max-width:640px){ .works{grid-template-columns:1fr} }
</style>
</head>
<body>
<header class="top">
  <a class="mark" href="index.html" id="mark">SimProof</a>
  <nav class="lang" id="langSwitch"></nav>
</header>

<div class="head wrap" style="padding-left:0;padding-right:0">
  <a class="back" id="backLink" href="index.html">&larr; <span data-i18n="backToBoard"></span></a>
  <h1 id="pName"></h1>
  <p class="location" id="pLocation"></p>
  <div class="mode-toggle">
    <button id="btnResume" data-i18n="modeResume"></button>
    <button id="btnStartup" data-i18n="modeStartup"></button>
  </div>
</div>

<div class="panel wrap" style="padding-left:0;padding-right:0">
  <h2 id="panelTitle"></h2>
  <p id="panelText"></p>
</div>

<div class="skills wrap" id="skillsBox" style="padding-left:0;padding-right:0"></div>

<h2 class="works-title" id="worksTitle"></h2>
<div class="works wrap" id="worksBox" style="padding-left:0;padding-right:0"></div>

<div class="contact wrap" style="padding-left:0;padding-right:0">
  <p id="contactText"></p>
  <button id="contactBtn" data-i18n="contactCta"></button>
</div>

<footer id="fallback" data-i18n="notFound"></footer>
</body>
<script>
const LANGS=['en','ru','hy'];
const params=new URLSearchParams(location.search);
let LANG=params.get('lang'); if(!LANGS.includes(LANG)) LANG='ru';
const ID=params.get('id') || 'p1';

const I18N={
  en:{ backToBoard:'back to the board', modeResume:'Résumé view', modeStartup:'Startup view',
    resumeTitle:'What this person knows how to design', startupTitle:'The idea, already proven in simulation',
    skillsLabel:'Skills', worksTitle:'Their proofs on the board',
    contactText:'Reach out directly — no matching, no application form.', contactCta:'Contact',
    stageTeam:'Looking to build it', stageShowing:'Just showing the proof', notFound:'This profile was not found.'},
  ru:{ backToBoard:'назад к витрине', modeResume:'Как резюме', modeStartup:'Как стартап',
    resumeTitle:'Что умеет проектировать этот человек', startupTitle:'Идея, уже доказанная симуляцией',
    skillsLabel:'Навыки', worksTitle:'Его доказательства на витрине',
    contactText:'Свяжитесь напрямую — без мэтчинга и заявок.', contactCta:'Связаться',
    stageTeam:'Ищу, кто построит', stageShowing:'Просто показываю доказательство', notFound:'Такой профиль не найден.'},
  hy:{ backToBoard:'վերադառնալ ցուցափեղկ', modeResume:'Ինքնակենսագրական', modeStartup:'Ստարտափի տեսք',
    resumeTitle:'Ինչ գիտի նախագծել այս մարդը', startupTitle:'Գաղափարը, արդեն ապացուցված սիմուլյացիայով',
    skillsLabel:'Հմտություններ', worksTitle:'Իր ապացույցները ցուցափեղկում',
    contactText:'Կապվեք ուղղակիորեն՝ առանց մեթչինգի և հայտերի։', contactCta:'Կապ հաստատել',
    stageTeam:'Փնտրում է, ով կկառուցի', stageShowing:'Պարզապես ցուցադրում է ապացույցը', notFound:'Այս պրոֆիլը չի գտնվել։'}
};

const PROFILES=[
  {id:'p1', name:'Nare Petrosyan', location:'Yerevan, Armenia', skills:['MuJoCo','Reinforcement learning','Kinematics','Control systems'],
    resume:{en:'Designs and simulates control systems for legged and moving mechanisms — from MuJoCo gait training to interactive kinematic models — before any hardware is built.',ru:'Проектирует и симулирует системы управления для шагающих и подвижных механизмов — от обучения походки в MuJoCo до интерактивных кинематических моделей — до постройки любого железа.',hy:'Նախագծում և սիմուլյացնում է կառավարման համակարգեր քայլող և շարժական մեխանիզմների համար՝ MuJoCo-ում քայլվածքի ուսուցումից մինչև ինտերակտիվ կինեմատիկ մոդելներ, դեռ մինչև որևէ սարքի կառուցումը։'}},
  {id:'p2', name:'Karen Avanesyan', location:'Yerevan, Armenia', skills:['Kinematics','Foldable structures','Physics sandbox'],
    startup:{en:'Simulated a self-folding sun-shade mechanism that survives thousands of wind cycles without jamming — looking for a manufacturer to take it to a physical run.',ru:'Смоделировал складной солнцезащитный механизм, выдерживающий тысячи ветровых циклов без заклинивания, — ищет производителя для перехода к физической партии.',hy:'Սիմուլյացրել է ինքնաբերաբար ծալվող արևապաշտպան մեխանիզմ, որը դիմանում է քամու հազարավոր ցիկլերի առանց խրվելու․ փնտրում է արտադրող՝ ֆիզիկական խմբաքանակի անցնելու համար։'}},
  {id:'p3', name:'Lilit Sargsyan', location:'Gyumri, Armenia', skills:['Fluid dynamics','Blade design','Structural sandbox'],
    startup:{en:'Runs fluid and structural sandboxes to prove small energy and water hardware — a turbine blade, a filter valve — before a single mold is cut.',ru:'Использует гидро- и структурные sandbox-модели, чтобы доказать работоспособность небольших устройств для энергетики и воды — лопасть турбины, фильтрующий клапан — до вырезки хотя бы одной формы.',hy:'Օգտագործում է հեղուկային և կառուցվածքային sandbox մոդելներ՝ ապացուցելու էներգետիկայի և ջրի փոքր սարքերի աշխատունակությունը՝ տուրբինի թիակ, ֆիլտրող փական, դեռ մինչև գոնե մեկ ձևանմուշի կտրումը։'}},
  {id:'p4', name:'Armen Ghukasyan', location:'Yerevan, Armenia', skills:['Structural engineering','Damping','Civic tech'],
    resume:{en:'Models load and vibration on real structures — bridges, walkways — to prove a fix works before a town spends its repair budget.',ru:'Моделирует нагрузки и вибрации на реальных конструкциях — мостах, переходах, — доказывая, что решение работает, до того как город потратит бюджет на ремонт.',hy:'Մոդելավորում է բեռնվածությունը և թրթռումը իրական կառույցների վրա՝ կամուրջներ, անցումներ, ապացուցելով, որ լուծումն աշխատում է, դեռ մինչև քաղաքը ծախսի վերանորոգման բյուջեն։'}}
];

const WORKS=[
  {id:'w1', author:'p1', stage:'team', t:{en:'Adaptive gait for a two-legged rescue robot',ru:'Адаптивная походка для двуногого спасательного робота',hy:'Հարմարվող քայլվածք երկոտանի փրկարարական ռոբոտի համար'}, p:{en:'Robotics, MuJoCo',ru:'Робототехника, MuJoCo',hy:'Ռոբոտաշինություն, MuJoCo'}},
  {id:'w2', author:'p2', stage:'team', t:{en:'Self-folding balcony sun shade, kinematics tested',ru:'Складной балконный солнцезащитный экран с проверенной кинематикой',hy:'Ինքնաբերաբար ծալվող պատշգամբի արևապաշտպան էկրան'}, p:{en:'Mechanism, sandbox',ru:'Механизм, sandbox',hy:'Մեխանիզմ, sandbox'}},
  {id:'w3', author:'p3', stage:'showing', t:{en:'Micro wind-turbine blade shape, airflow-tested',ru:'Форма лопасти микроветрогенератора, проверенная на потоке воздуха',hy:'Միկրովերգեներատորի թիակի ձևը'}, p:{en:'Energy, fluid sandbox',ru:'Энергетика, fluid sandbox',hy:'Էներգետիկա, fluid sandbox'}},
  {id:'w4', author:'p4', stage:'team', t:{en:'Vibration-damping mount for a pedestrian bridge',ru:'Виброгасящее крепление для пешеходного моста',hy:'Թրթռազսպող ամրակ հետիոտն կամրջի համար'}, p:{en:'Structural, civic',ru:'Конструкции, civic',hy:'Կառուցվածք, քաղաքացիական'}},
  {id:'w5', author:'p1', stage:'team', t:{en:'Sun-tracking mount for a balcony solar panel',ru:'Солнце-следящее крепление для балконной солнечной панели',hy:'Արևին հետևող ամրակ պատշգամբի արևային վահանակի համար'}, p:{en:'Energy, interactive 3D',ru:'Энергетика, интерактив 3D',hy:'Էներգետիկա, ինտերակտիվ 3D'}},
  {id:'w6', author:'p3', stage:'showing', t:{en:'Modular rainwater filter valve, flow-tested',ru:'Модульный фильтрующий клапан для дождевой воды',hy:'Անձրևաջրի մոդուլային ֆիլտրող փական'}, p:{en:'Fluid, water systems',ru:'Гидро, водные системы',hy:'Հեղուկ, ջրային համակարգեր'}}
];

function t(k){ return I18N[LANG][k] || ''; }
function withLang(file){ const u=new URLSearchParams(); u.set('lang',LANG); return file+'?'+u.toString(); }

function renderLangSwitch(){
  const el=document.getElementById('langSwitch');
  el.innerHTML = LANGS.map(l=>{
    const u=new URLSearchParams(params); u.set('lang',l);
    return `<a href="?${u.toString()}" class="${l===LANG?'on':''}">${l.toUpperCase()}</a>`;
  }).join('');
}

let currentMode = null;

function renderMode(profile){
  const hasResume = !!profile.resume;
  const hasStartup = !!profile.startup;
  if(!currentMode) currentMode = hasResume ? 'resume' : 'startup';

  document.getElementById('btnResume').style.display = hasResume ? 'inline-block' : 'none';
  document.getElementById('btnStartup').style.display = hasStartup ? 'inline-block' : 'none';
  document.getElementById('btnResume').className = currentMode==='resume' ? 'active' : '';
  document.getElementById('btnStartup').className = currentMode==='startup' ? 'active' : '';

  document.getElementById('panelTitle').textContent = currentMode==='resume' ? t('resumeTitle') : t('startupTitle');
  document.getElementById('panelText').textContent = currentMode==='resume' ? profile.resume[LANG] : profile.startup[LANG];
}

function init(){
  document.documentElement.lang = LANG;
  renderLangSwitch();
  document.getElementById('backLink').href = withLang('index.html') + '#board';
  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.getAttribute('data-i18n')));

  const profile = PROFILES.find(p=>p.id===ID);
  if(!profile){
    document.querySelectorAll('.head, .panel, .skills, .works-title, .works, .contact').forEach(el=>el.style.display='none');
    document.getElementById('fallback').style.display='block';
    return;
  }

  document.getElementById('pName').textContent = profile.name;
  document.getElementById('pLocation').textContent = profile.location;
  document.getElementById('skillsBox').innerHTML = profile.skills.map(s=>`<span>${s}</span>`).join('');
  document.getElementById('worksTitle').textContent = t('worksTitle');
  document.getElementById('contactText').textContent = t('contactText');

  const authored = WORKS.filter(w=>w.author===ID);
  document.getElementById('worksBox').innerHTML = authored.map(w=>
    `<a class="wcard" href="${withLang('work.html')}&id=${w.id}"><h3>${w.t[LANG]}</h3><p>${w.p[LANG]}</p></a>`
  ).join('');

  renderMode(profile);
  document.getElementById('btnResume').addEventListener('click', ()=>{ currentMode='resume'; renderMode(profile); });
  document.getElementById('btnStartup').addEventListener('click', ()=>{ currentMode='startup'; renderMode(profile); });
  document.getElementById('contactBtn').addEventListener('click', ()=>{
    alert(LANG==='ru' ? 'Демо: здесь появится способ связи, который выбрал автор.' : LANG==='hy' ? 'Դեմո. այստեղ կհայտնվի կապի եղանակը, որը ընտրել է հեղինակը։' : 'Demo: the contact method the author chose would appear here.');
  });
}
init();
</script>
</html>
