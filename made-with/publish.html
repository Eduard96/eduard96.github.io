<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Made With — опубликовать</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23ECEAE3'/%3E%3Ccircle cx='12' cy='16' r='7' fill='none' stroke='%23C97A2E' stroke-width='2.2'/%3E%3Crect x='15' y='9' width='12' height='12' fill='none' stroke='%233E4DE0' stroke-width='2.2'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#ECEAE3; --ink:#171A16; --ink-soft:#5A5E54; --line:#c9c7ba;
    --signal:#3E4DE0; --signal-soft:#e2e5fb; --human:#c97a2e; --human-soft:#f6e6d1;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;line-height:1.5;font-size:17px}
  a{color:inherit}
  header.top{display:flex;align-items:center;justify-content:space-between;padding:22px 28px;border-bottom:1px solid var(--line)}
  .mark{font-family:'Fraunces',serif;font-weight:700;font-size:22px;text-decoration:none}
  .lang{display:flex;gap:6px;font-family:'IBM Plex Mono',monospace;font-size:12.5px}
  .lang a{padding:4px 7px;border:1px solid var(--line);border-radius:3px;text-decoration:none;color:var(--ink-soft)}
  .lang a.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .back{font-family:'IBM Plex Mono',monospace;font-size:13px;text-decoration:none;color:var(--ink-soft)}

  .layout{max-width:1100px;margin:0 auto;padding:34px 28px 70px;display:grid;grid-template-columns:1.1fr 0.9fr;gap:44px}
  h1{font-family:'Fraunces',serif;font-weight:600;font-size:clamp(26px,3.6vw,36px);margin:14px 0 8px}
  .lede{color:var(--ink-soft);font-size:15.5px;max-width:52ch;margin:0 0 30px}

  .field{margin-bottom:22px}
  .field label{display:block;font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--ink-soft);margin-bottom:7px}
  .field .hint{font-size:13px;color:var(--ink-soft);margin:5px 0 0}
  .field input, .field select, .field textarea{width:100%;font-family:'Inter',sans-serif;font-size:15px;padding:11px 13px;border:1px solid var(--line);border-radius:3px;background:#fff;color:var(--ink)}
  .field textarea{resize:vertical;min-height:80px}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:16px}

  .video-drop{border:1px dashed var(--ink-soft);border-radius:3px;padding:22px;text-align:center;color:var(--ink-soft);font-size:14px;cursor:pointer}
  .video-drop.filled{border-style:solid;border-color:var(--signal);color:var(--ink)}

  .stage-pick{display:flex;gap:10px}
  .stage-pick button{flex:1;font-family:'IBM Plex Mono',monospace;font-size:13px;padding:11px;border:1px solid var(--line);border-radius:3px;background:#fff;cursor:pointer;color:var(--ink)}
  .stage-pick button.active.team{border-color:var(--human);background:var(--human-soft)}
  .stage-pick button.active.showing{border-color:var(--signal);background:var(--signal-soft)}

  .submit{font-family:'IBM Plex Mono',monospace;font-size:14px;padding:13px 22px;border-radius:3px;border:none;background:var(--ink);color:var(--paper);cursor:pointer}
  .submit-note{font-size:13px;color:var(--ink-soft);margin-top:12px}

  .preview-side{position:sticky;top:26px;align-self:start}
  .preview-label{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-soft);margin-bottom:10px}
  .card{border:1px solid var(--line);background:#fff;display:block}
  .thumb{height:150px;background:var(--signal-soft);display:flex;align-items:center;justify-content:center;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;font-size:12px;clip-path:polygon(0 0,100% 0,100% 88%,0 100%)}
  .card-body{padding:16px 18px 18px;border-left:3px solid var(--line)}
  .card-body.stage-team{border-left-color:var(--human)}
  .card-body.stage-showing{border-left-color:var(--signal)}
  .card h3{font-family:'Fraunces',serif;font-size:19px;margin:0 0 8px}
  .card .problem{font-size:14.5px;color:var(--ink-soft);margin:0 0 12px}
  .tags{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--ink-soft);margin:0 0 10px}
  .tags span{margin-right:8px}
  .card-foot{display:flex;justify-content:space-between;align-items:center;font-family:'IBM Plex Mono',monospace;font-size:11.5px}
  .stage-tag{padding:3px 7px;border-radius:2px}
  .stage-tag.team{background:var(--human-soft);color:#8a541c}
  .stage-tag.showing{background:var(--signal-soft);color:#2a37b0}

  .required-note{font-family:'IBM Plex Mono',monospace;font-size:12px;border:1px solid var(--line);padding:14px 16px;margin-top:24px;color:var(--ink-soft)}

  @media(max-width:820px){ .layout{grid-template-columns:1fr} .preview-side{position:static} }
</style>
</head>
<body>
<header class="top">
  <a class="mark" href="index.html" id="mark">Made With</a>
  <nav class="lang" id="langSwitch"></nav>
</header>

<div class="layout">
  <div>
    <a class="back" id="backLink" href="index.html">&larr; <span data-i18n="backToBoard"></span></a>
    <h1 data-i18n="pageTitle"></h1>
    <p class="lede" data-i18n="pageLede"></p>

    <form id="form" onsubmit="return false">
      <div class="field">
        <label data-i18n="lTitle"></label>
        <input id="fTitle" type="text">
      </div>

      <div class="two">
        <div class="field">
          <label data-i18n="lType"></label>
          <select id="fType"></select>
        </div>
        <div class="field">
          <label data-i18n="lSkills"></label>
          <input id="fSkills" type="text" data-i18n-ph="phSkills">
        </div>
      </div>

      <div class="field">
        <label data-i18n="lProblem"></label>
        <textarea id="fProblem" data-i18n-ph="phProblem"></textarea>
        <p class="hint" data-i18n="hintProblem"></p>
      </div>

      <div class="field">
        <label data-i18n="lConnection"></label>
        <textarea id="fConnection" data-i18n-ph="phConnection"></textarea>
        <p class="hint" data-i18n="hintConnection"></p>
      </div>

      <div class="field">
        <label data-i18n="lVideo"></label>
        <div class="video-drop" id="videoDrop" data-i18n="videoDropText"></div>
      </div>

      <div class="field">
        <label data-i18n="lCode"></label>
        <input id="fCode" type="text" data-i18n-ph="phCode">
      </div>

      <div class="field">
        <label data-i18n="lStage"></label>
        <div class="stage-pick">
          <button type="button" id="stageTeam" data-i18n="stageTeam"></button>
          <button type="button" id="stageShowing" data-i18n="stageShowing"></button>
        </div>
      </div>

      <button class="submit" id="submitBtn" data-i18n="submitBtn"></button>
      <p class="submit-note" data-i18n="submitNote"></p>
    </form>

    <div class="required-note" data-i18n="requiredNote"></div>
  </div>

  <div class="preview-side">
    <div class="preview-label" data-i18n="previewLabel"></div>
    <div class="card">
      <div class="thumb" id="pvThumb" data-i18n="pvThumbText"></div>
      <div class="card-body stage-team" id="pvBody">
        <h3 id="pvTitle"></h3>
        <p class="problem" id="pvProblem"></p>
        <div class="tags" id="pvTags"></div>
        <div class="card-foot">
          <span class="stage-tag team" id="pvStage"></span>
          <span id="pvAuthor">You</span>
        </div>
      </div>
    </div>
  </div>
</div>

</body>
<script>
const LANGS=['en','ru','hy'];
const params=new URLSearchParams(location.search);
let LANG=params.get('lang'); if(!LANGS.includes(LANG)) LANG='ru';

const I18N={
  en:{ backToBoard:'back to the board', pageTitle:'Publish a work',
    pageLede:'Any work made with AI — material, visual, code, or a business idea just starting. The only requirement is how it\u2019s shown, not its subject or size.',
    lTitle:'Title', lType:'Type', lSkills:'Skills (comma-separated)', phSkills:'e.g. Python, RL, Robotics',
    lProblem:'What problem it solves', phProblem:'Personal or market — describe it in a sentence or two.',
    hintProblem:'Say what it fixes, for whom.',
    lConnection:'How human, AI and tech connect', phConnection:'What did you decide, and what did the AI do?',
    hintConnection:'This is the part visitors read to understand how the work actually got made.',
    lVideo:'Video', videoDropText:'Drop a short video here, or leave it \u2014 shown on request works too',
    lCode:'Code link (optional)', phCode:'github.com/... or leave blank to show on request',
    lStage:'Stage', stageTeam:'Looking for a team', stageShowing:'Just showing',
    submitBtn:'Publish (demo)', submitNote:'This is a demo form \u2014 nothing is sent anywhere yet.',
    requiredNote:'One condition, not a topic or a scale: a video and the code, open or shown on request.',
    previewLabel:'How your card will look', pvThumbText:'thumbnail',
    typeCode:'Code', typeHardware:'Hardware', typeVisual:'Visual & generative', typeBusiness:'Business idea',
    pvTitlePlaceholder:'Your title appears here', pvProblemPlaceholder:'The problem it solves appears here.'},
  ru:{ backToBoard:'назад к витрине', pageTitle:'Опубликовать работу',
    pageLede:'Любая работа, сделанная с ИИ — материальная, визуальная, код или бизнес-идея на старте. Единственное условие — способ показа, а не тема или масштаб.',
    lTitle:'Название', lType:'Тип', lSkills:'Навыки (через запятую)', phSkills:'например: Python, RL, робототехника',
    lProblem:'Какую проблему решает', phProblem:'Личную или рыночную — опишите в одном-двух предложениях.',
    hintProblem:'Скажите, что она чинит и для кого.',
    lConnection:'Как связаны человек, ИИ и технология', phConnection:'Что решали вы, а что делал ИИ?',
    hintConnection:'Это то, что читают посетители, чтобы понять, как работа была сделана на самом деле.',
    lVideo:'Видео', videoDropText:'Перетащите короткое видео сюда — или оставьте пустым, показ по запросу тоже подходит',
    lCode:'Ссылка на код (необязательно)', phCode:'github.com/... или оставьте пустым для показа по запросу',
    lStage:'Стадия', stageTeam:'Ищу команду', stageShowing:'Просто показываю',
    submitBtn:'Опубликовать (демо)', submitNote:'Это демо-форма — пока никуда ничего не отправляется.',
    requiredNote:'Одно условие, не тема и не масштаб: видео и код — открытый или по запросу.',
    previewLabel:'Так будет выглядеть карточка', pvThumbText:'превью',
    typeCode:'Код', typeHardware:'Материальное', typeVisual:'Визуал и генеративное', typeBusiness:'Бизнес-идея',
    pvTitlePlaceholder:'Здесь появится название', pvProblemPlaceholder:'Здесь появится решаемая проблема.'},
  hy:{ backToBoard:'վերադառնալ ցուցափեղկ', pageTitle:'Հրապարակել աշխատանք',
    pageLede:'Ցանկացած աշխատանք, որ ստեղծված է ԱԲ-ի հետ՝ նյութական, վիզուալ, կոդ կամ նոր սկսվող բիզնես գաղափար։ Միակ պայմանը՝ ցուցադրման ձևն է, ոչ թե թեման կամ մասշտաբը։',
    lTitle:'Վերնագիր', lType:'Տեսակ', lSkills:'Հմտություններ (ստորակետով)', phSkills:'օր.՝ Python, RL, ռոբոտաշինություն',
    lProblem:'Ինչ խնդիր է լուծում', phProblem:'Անձնական կամ շուկայական՝ նկարագրեք մեկ-երկու նախադասությամբ։',
    hintProblem:'Ասեք, ինչ է շտկում և ում համար։',
    lConnection:'Ինչպես են կապված մարդը, ԱԲ-ն և տեխնոլոգիան', phConnection:'Ինչ որոշեցիք դուք, և ինչ արեց ԱԲ-ն?',
    hintConnection:'Սա այն մասն է, որ այցելուները կարդում են՝ հասկանալու, թե ինչպես է աշխատանքն իրականում ստեղծվել։',
    lVideo:'Տեսանյութ', videoDropText:'Կցեք կարճ տեսանյութ այստեղ, կամ թողեք դատարկ՝ հարցումով ցուցադրումը նույնպես ընդունելի է',
    lCode:'Կոդի հղում (ոչ պարտադիր)', phCode:'github.com/... կամ թողեք դատարկ՝ հարցումով ցուցադրելու համար',
    lStage:'Փուլ', stageTeam:'Փնտրում եմ թիմ', stageShowing:'Պարզապես ցուցադրում եմ',
    submitBtn:'Հրապարակել (դեմո)', submitNote:'Սա դեմո ձև է․ ոչինչ դեռ ոչ մի տեղ չի ուղարկվում։',
    requiredNote:'Մեկ պայման, ոչ թե թեմա կամ մասշտաբ՝ տեսանյութ և կոդ, բաց կամ ցուցադրվող հարցումով։',
    previewLabel:'Ինչպես կերևա ձեր քարտը', pvThumbText:'մանրապատկեր',
    typeCode:'Կոդ', typeHardware:'Նյութական', typeVisual:'Վիզուալ և գեներատիվ', typeBusiness:'Բիզնես գաղափար',
    pvTitlePlaceholder:'Ձեր վերնագիրը կհայտնվի այստեղ', pvProblemPlaceholder:'Լուծվող խնդիրը կհայտնվի այստեղ։'}
};

function t(k){ return I18N[LANG][k] || ''; }
function withLang(file){ const u=new URLSearchParams(); u.set('lang',LANG); return file+'?'+u.toString(); }

function renderLangSwitch(){
  const el=document.getElementById('langSwitch');
  el.innerHTML = LANGS.map(l=>{
    const u=new URLSearchParams(params); u.set('lang',l);
    return `<a href="?${u.toString()}" class="${l===LANG?'on':''}">${l.toUpperCase()}</a>`;
  }).join('');
}

let stage = 'team';

function updatePreview(){
  document.getElementById('pvTitle').textContent = document.getElementById('fTitle').value || t('pvTitlePlaceholder');
  document.getElementById('pvProblem').textContent = document.getElementById('fProblem').value || t('pvProblemPlaceholder');
  const skills = document.getElementById('fSkills').value.split(',').map(s=>s.trim()).filter(Boolean);
  document.getElementById('pvTags').innerHTML = skills.map(s=>`<span>#${s}</span>`).join('');
  document.getElementById('pvBody').className = 'card-body stage-' + stage;
  document.getElementById('pvStage').className = 'stage-tag ' + stage;
  document.getElementById('pvStage').textContent = stage==='team' ? t('stageTeam') : t('stageShowing');
}

function setStage(s){
  stage = s;
  document.getElementById('stageTeam').className = s==='team' ? 'active team' : '';
  document.getElementById('stageShowing').className = s==='showing' ? 'active showing' : '';
  updatePreview();
}

function init(){
  document.documentElement.lang = LANG;
  renderLangSwitch();
  document.getElementById('backLink').href = withLang('index.html') + '#board';
  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.getAttribute('data-i18n')));
  document.querySelectorAll('[data-i18n-ph]').forEach(el => el.setAttribute('placeholder', t(el.getAttribute('data-i18n-ph'))));

  document.getElementById('fType').innerHTML = `
    <option value="code">${t('typeCode')}</option>
    <option value="hardware">${t('typeHardware')}</option>
    <option value="visual">${t('typeVisual')}</option>
    <option value="business">${t('typeBusiness')}</option>`;

  document.getElementById('pvAuthor').textContent = LANG==='ru' ? 'Вы' : LANG==='hy' ? 'Դուք' : 'You';

  ['fTitle','fProblem','fSkills'].forEach(id=>{
    document.getElementById(id).addEventListener('input', updatePreview);
  });

  document.getElementById('videoDrop').addEventListener('click', function(){
    this.classList.toggle('filled');
    this.textContent = this.classList.contains('filled')
      ? (LANG==='ru' ? 'clip.mp4 — прикреплено' : LANG==='hy' ? 'clip.mp4 — կցված է' : 'clip.mp4 — attached')
      : t('videoDropText');
  });

  setStage('team');

  document.getElementById('stageTeam').addEventListener('click', ()=>setStage('team'));
  document.getElementById('stageShowing').addEventListener('click', ()=>setStage('showing'));

  document.getElementById('submitBtn').addEventListener('click', ()=>{
    const title = document.getElementById('fTitle').value.trim();
    if(!title){
      document.getElementById('fTitle').focus();
      return;
    }
    alert(LANG==='ru' ? 'Демо: в реальной версии работа появится на витрине.' : LANG==='hy' ? 'Դեմո. իրական տարբերակում աշխատանքը կհայտնվի ցուցափեղկում։' : 'Demo: in a live version this would appear on the board.');
  });
}
init();
</script>
</html>
