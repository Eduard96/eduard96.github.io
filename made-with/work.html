<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#ECEAE3; --paper-2:#E2E0D5; --ink:#171A16; --ink-soft:#5A5E54;
    --line:#c9c7ba; --signal:#3E4DE0; --signal-soft:#e2e5fb; --human:#c97a2e; --human-soft:#f6e6d1;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;line-height:1.55;font-size:17px}
  a{color:inherit}
  .wrap{max-width:840px;margin:0 auto;padding:0 28px}
  header.top{display:flex;align-items:center;justify-content:space-between;padding:22px 28px;border-bottom:1px solid var(--line)}
  .mark{font-family:'Fraunces',serif;font-weight:700;font-size:22px;text-decoration:none}
  .top-right{display:flex;align-items:center;gap:18px}
  .lang{display:flex;gap:6px;font-family:'IBM Plex Mono',monospace;font-size:12.5px}
  .lang a{padding:4px 7px;border:1px solid var(--line);border-radius:3px;text-decoration:none;color:var(--ink-soft)}
  .lang a.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .back{font-family:'IBM Plex Mono',monospace;font-size:13px;text-decoration:none;color:var(--ink-soft)}

  .stage-line{padding:34px 28px 0}
  .stage-tag{font-family:'IBM Plex Mono',monospace;font-size:12px;padding:4px 9px;border-radius:2px}
  .stage-tag.team{background:var(--human-soft);color:#8a541c}
  .stage-tag.showing{background:var(--signal-soft);color:#2a37b0}

  h1{font-family:'Fraunces',serif;font-weight:600;font-size:clamp(28px,4vw,40px);margin:14px 0 6px;padding:0 28px}
  .byline{padding:0 28px;color:var(--ink-soft);font-size:15px;margin-bottom:26px}
  .byline a{border-bottom:1px solid var(--line);text-decoration:none}

  .video-block{margin:0 28px 34px;border:1px solid var(--line);background:#fff;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;position:relative}
  .video-block .play{width:58px;height:58px;border-radius:50%;border:1.5px solid var(--ink);display:flex;align-items:center;justify-content:center}
  .video-block .play::after{content:'';border-style:solid;border-width:9px 0 9px 15px;border-color:transparent transparent transparent var(--ink);margin-left:4px}
  .video-block .label{position:absolute;bottom:14px;left:16px;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-soft)}

  .cols{padding:0 28px;display:grid;grid-template-columns:1fr 1fr;gap:32px;margin-bottom:20px}
  .block h2{font-family:'Fraunces',serif;font-size:20px;margin:0 0 10px}
  .block p{color:var(--ink-soft);font-size:15.5px;margin:0}

  .meta-row{padding:22px 28px 8px;display:flex;flex-wrap:wrap;gap:10px 26px;border-top:1px solid var(--line);margin-top:12px}
  .meta-row div{font-family:'IBM Plex Mono',monospace;font-size:12.5px}
  .meta-row .k{color:var(--ink-soft);display:block;margin-bottom:2px}
  .tags{font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--ink-soft)}
  .tags span{margin-right:8px}

  .code-cta{margin:26px 28px 60px;display:flex;gap:14px;flex-wrap:wrap}
  .code-cta a, .code-cta button{font-family:'IBM Plex Mono',monospace;font-size:13.5px;padding:11px 18px;border-radius:3px;text-decoration:none;border:1px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer}
  .code-cta .primary{background:var(--ink);color:var(--paper)}

  footer{border-top:1px solid var(--line);padding:24px 28px 50px;color:var(--ink-soft);font-size:13.5px;font-family:'IBM Plex Mono',monospace}

  @media(max-width:640px){ .cols{grid-template-columns:1fr} }
</style>
</head>
<body>
<header class="top">
  <a class="mark" href="index.html" id="mark">SimProof</a>
  <div class="top-right">

  </div>
</header>

<div class="stage-line wrap">
  <a class="back" id="backLink" href="index.html">&larr; <span data-i18n="backToBoard"></span></a>
</div>

<h1 id="wTitle"></h1>
<div class="byline" id="wByline"></div>

<div class="video-block">
  <div class="play"></div>
  <span class="label" id="videoLabel"></span>
</div>

<div class="cols">

  <div class="block">

</div>

  <div><span class="k" data-i18n="metaDomain"></span><span id="wType"></span></div>
  <div><span class="k" data-i18n="metaTool"></span><span id="wTool"></span></div>
  <div><span class="k" data-i18n="metaStage"></span><span id="wStage"></span></div>
  <div style="flex:1"><span class="k" data-i18n="metaSkills"></span><span class="tags" id="wTags"></span></div>
</div>

<div class="code-cta wrap" style="padding-left:0;padding-right:0">
  <button class="primary" id="codeBtn" data-i18n="simCta"></button>
  <a id="profileBtn" href="#" data-i18n="profileCta"></a>
</div>

<footer id="fallback" data-i18n="notFound" style="display:none"></footer>
</body>

const I18N={
  en:{ backToBoard:'back to the board', problemTitle:'What problem it solves', proofTitle:'What this shows',
    metaDomain:'Domain', metaTool:'Tool', metaStage:'Stage', metaSkills:'Skills',

  ru:{ backToBoard:'назад к витрине', problemTitle:'Какую проблему решает', proofTitle:'Что это показывает',
    metaDomain:'Область', metaTool:'Инструмент', metaStage:'Стадия', metaSkills:'Навыки',
    simCta:'Симуляция — по запросу', profileCta:'Профиль автора',
    typeMechanism:'Робототехника и механизмы', typeEnergy:'Энергетика', typeStructural:'Строительство и конструкции', typeFluid:'Вода и гидросистемы',
    stageTeam:'Ищу, кто построит', stageShowing:'Просто показываю доказательство',

  hy:{ backToBoard:'վերադառնալ ցուցափեղկ', problemTitle:'Ինչ խնդիր է լուծում', proofTitle:'Ինչ է ցույց տալիս սա',
    metaDomain:'Ոլորտ', metaTool:'Գործիք', metaStage:'Փուլ', metaSkills:'Հմտություններ',
    simCta:'Սիմուլյացիա — հարցումով', profileCta:'Հեղինակի պրոֆիլը',
    typeMechanism:'Ռոբոտաշինություն և մեխանիզմներ', typeEnergy:'Էներգետիկա', typeStructural:'Շինարարություն և կոնստրուկցիաներ', typeFluid:'Ջուր և հեղուկային համակարգեր',
    stageTeam:'Փնտրում է, ով կկառուցի', stageShowing:'Պարզապես ցուցադրում է ապացույցը',
    videoLabel:'սիմուլյացիա և/կամ իրական կադրեր · ցուցադրվում է հարցումով', notFound:'Այս աշխատանքը չի գտնվել։'}
};

const PROFILES=[
  {id:'p1', name:'Nare Petrosyan'}, {id:'p2', name:'Karen Avanesyan'},
  {id:'p3', name:'Lilit Sargsyan'}, {id:'p4', name:'Armen Ghukasyan'}
];

const WORKS=[
  {id:'w1', type:'mechanism', stage:'team', author:'p1', tool:'MuJoCo', tags:['MuJoCo','Reinforcement learning','Kinematics'],
    t:{en:'Adaptive gait for a two-legged rescue robot',ru:'Адаптивная походка для двуногого спасательного робота',hy:'Հարմարվող քայլվածք երկոտանի փրկարարական ռոբոտի համար'},
    p:{en:'Search-and-rescue teams need a legged robot for rubble, but building and breaking hardware on every failed step is too slow and too expensive to test at all.',ru:'Спасательным командам нужен шагающий робот для завалов, но перестраивать и ломать железо на каждом неудачном шаге — слишком долго и дорого, чтобы вообще испытывать идею.',hy:'Փրկարարական խմբերին անհրաժեշտ է քայլող ռոբոտ փլատակների համար, բայց ամեն ձախողված քայլի վրա սարքը վերակառուցելը շատ դանդաղ ու թանկ է՝ ընդհանրապես գաղափարը փորձարկելու համար։'},
    c:{en:'The simulation runs the gait over broken, uneven terrain generated on the fly and shows it recovering balance after a stumble — proof the control approach holds before any part is machined.',ru:'Симуляция прогоняет походку по неровной, ломаной поверхности, сгенерированной на лету, и показывает, как робот восстанавливает баланс после спотыкания — доказательство, что подход к управлению работает ещё до изготовления деталей.',hy:'Սիմուլյացիան քայլվածքն անցկացնում է թեժ ստեղծված անհարթ, ջարդված մակերևույթով և ցույց է տալիս, թե ինչպես ռոբոտը վերականգնում է հավասարակշռությունը սայթաքումից հետո՝ ապացույց, որ կառավարման մոտեցումն աշխատում է դեռ մինչև որևէ դետալի պատրաստումը։'}},
  {id:'w2', type:'mechanism', stage:'team', author:'p2', tool:'Physics sandbox', tags:['Kinematics','Foldable structures','Sandbox'],
    t:{en:'Self-folding balcony sun shade, kinematics tested',ru:'Складной балконный солнцезащитный экран с проверенной кинематикой',hy:'Ինքնաբերաբար ծալվող պատշգամբի արևապաշտպան էկրան՝ ստուգված կինեմատիկայով'},
    p:{en:'A folding shade that reacts to sun and wind needs a linkage that won\u2019t jam or bind, and a sheet-metal mockup to test that costs more than the idea is worth at this stage.',ru:'Складной экран, реагирующий на солнце и ветер, нуждается в шарнирном механизме, который не заклинит, а тестовый макет из металла на этой стадии стоит дороже, чем оправдана идея.',hy:'Ծալվող էկրանին, որը արձագանքում է արևին և քամուն, անհրաժեշտ է հոդակապային մեխանիզմ, որը չի խրվի, իսկ մետաղյա փորձնական մոդելը այս փուլում ավելի թանկ է, քան արժե գաղափարը։'},
    c:{en:'The sandbox model runs the fold-and-unfold cycle under simulated wind load thousands of times and flags exactly where the linkage would bind — proving the geometry before any sheet metal is cut.',ru:'Модель в sandbox прогоняет цикл складывания-раскладывания под смоделированной ветровой нагрузкой тысячи раз и показывает, где именно механизм заклинит — доказывая геометрию до раскроя металла.',hy:'Sandbox-ի մոդելը հազարավոր անգամ անցկացնում է ծալման ու բացման ցիկլը սիմուլյացված քամու բեռնվածքի ներքո և ցույց է տալիս, թե կոնկրետ որտեղ կխրվի մեխանիզմը՝ ապացուցելով երկրաչափությունը դեռ մինչև մետաղի կտրումը։'}},
  {id:'w3', type:'energy', stage:'showing', author:'p3', tool:'Fluid sandbox', tags:['Fluid dynamics','Blade design','Renewable energy'],
    t:{en:'Micro wind-turbine blade shape, airflow-tested',ru:'Форма лопасти микроветрогенератора, проверенная на потоке воздуха',hy:'Միկրովերգեներատորի թիակի ձևը՝ ստուգված օդային հոսքով'},
    p:{en:'A rooftop micro-turbine only pays for itself if the blade catches low, gusty urban wind well; a wrong blade shape means a cast mold made for nothing.',ru:'Крышный микроветрогенератор окупается только если лопасть хорошо ловит слабый порывистый городской ветер; неверная форма лопасти — это форма для литья, отлитая впустую.',hy:'Տանիքային միկրովերգեներատորը իրեն արդարացնում է միայն այն դեպքում, եթե թիակը լավ է բռնում քաղաքային թույլ ու պոռթկումային քամին. սխալ ձևը նշանակում է իզուր ձուլված ձևանմուշ։'},
    c:{en:'The sandbox visualizes airflow over a dozen blade shapes side by side and ranks them by simulated power output — proving which shape earns a physical mold before any material is cast.',ru:'Sandbox визуализирует обтекание воздухом дюжины форм лопасти рядом и ранжирует их по смоделированной выработке энергии — доказывая, какая форма заслуживает литейной формы, ещё до отливки материала.',hy:'Sandbox-ը վիզուալիզացնում է օդի հոսքը մեկ տասնյակ թիակի ձևերի շուրջ կողք կողքի և դասակարգում է դրանք սիմուլյացված էներգիայի արտադրանքով՝ ապացուցելով, թե որ ձևն է արժանի ֆիզիկական ձևանմուշի, դեռ մինչև նյութի ձուլումը։'}},
  {id:'w4', type:'structural', stage:'team', author:'p4', tool:'Structural sandbox', tags:['Structural engineering','Damping','Civic tech'],
    t:{en:'Vibration-damping mount for a pedestrian bridge',ru:'Виброгасящее крепление для пешеходного моста',hy:'Թրթռազսպող ամրակ հետիոտն կամրջի համար'},
    p:{en:'A footbridge in a small town sways under crowds and has been closed for a year; the town has no budget to test a fix before installing it for real.',ru:'Пешеходный мост в маленьком городе раскачивается под толпой и закрыт уже год; у города нет бюджета проверить решение до его установки на месте.',hy:'Փոքր քաղաքի հետիոտն կամուրջը ցնցվում է ամբոխի ներքո և փակ է մեկ տարուց ի վեր. քաղաքն ունի ոչ մի բյուջե՝ լուծումը փորձարկելու համար դեռ մինչև այն տեղադրելը։'},
    c:{en:'The model applies real recorded footfall loads to the bridge geometry and shows the sway dropping to a safe range once the damping mount is added — proving the fix works before a single bolt is bought.',ru:'Модель прикладывает реальные записанные нагрузки от шагов толпы к геометрии моста и показывает, как раскачивание падает до безопасного уровня после установки виброгасителя — доказывая решение до покупки хотя бы одного болта.',hy:'Մոդելը կամրջի երկրաչափությանը կիրառում է քայլերի իրական գրանցված բեռնվածքները և ցույց է տալիս, թե ինչպես է ցնցումն իջնում անվտանգ մակարդակի՝ թրթռազսպիչի ավելացումից հետո՝ ապացուցելով լուծումը դեռ մինչև գոնե մեկ պտուտակի գնումը։'}},
  {id:'w5', type:'energy', stage:'team', author:'p1', tool:'Interactive 3D', tags:['Kinematics','Solar','Interactive model'],
    t:{en:'Sun-tracking mount for a balcony solar panel',ru:'Солнце-следящее крепление для балконной солнечной панели',hy:'Արևին հետևող ամրակ պատշգամբի արևային վահանակի համար'},
    p:{en:'A tilting mount can raise a small balcony panel\u2019s output noticeably, but a motorized frame is expensive to get wrong twice on a real balcony.',ru:'Наклонное крепление может заметно повысить выработку небольшой балконной панели, но моторизованную раму дорого переделывать дважды на реальном балконе.',hy:'Թեքվող ամրակը կարող է նկատելիորեն բարձրացնել պատշգամբի փոքր վահանակի արտադրանքը, բայց մոտորացված շրջանակը թանկ է սխալվել երկու անգամ իրական պատշգամբի վրա։'},

function t(k){ return I18N[LANG][k] || ''; }
function withLang(file){ const u=new URLSearchParams(); u.set('lang',LANG); return file+'?'+u.toString(); }

function renderLangSwitch(){
  const el=document.getElementById('langSwitch');
  el.innerHTML = LANGS.map(l=>{
    const u=new URLSearchParams(params); u.set('lang',l);
    return `<a href="?${u.toString()}" class="${l===LANG?'on':''}">${l.toUpperCase()}</a>`;
  }).join('');
}

function init(){
  document.documentElement.lang = LANG;
  renderLangSwitch();
  document.getElementById('backLink').href = withLang('index.html') + '#board';
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    el.textContent = t(el.getAttribute('data-i18n'));
  });

  const w = WORKS.find(x=>x.id===ID);
  if(!w){
    document.querySelector('h1').style.display='none';
    document.querySelector('.byline').style.display='none';
    document.querySelector('.video-block').style.display='none';
    document.querySelector('.cols').style.display='none';
    document.querySelector('.meta-row').style.display='none';
    document.querySelector('.code-cta').style.display='none';
    document.getElementById('fallback').style.display='block';
    return;
  }
  const author = PROFILES.find(p=>p.id===w.author);
  document.getElementById('wTitle').textContent = w.t[LANG];
  document.getElementById('wByline').innerHTML = `<a href="${withLang('profile.html')}&id=${author.id}">${author.name}</a>`;
  document.getElementById('videoLabel').textContent = t('videoLabel');
  document.getElementById('wProblem').textContent = w.p[LANG];
  document.getElementById('wConnection').textContent = w.c[LANG];
  document.getElementById('wType').textContent = t('type'+w.type.charAt(0).toUpperCase()+w.type.slice(1));
  document.getElementById('wTool').textContent = w.tool;
  document.getElementById('wStage').textContent = w.stage==='team' ? t('stageTeam') : t('stageShowing');
  document.getElementById('wTags').innerHTML = w.tags.map(x=>`<span>#${x}</span>`).join('');
  document.getElementById('profileBtn').href = withLang('profile.html') + '&id=' + author.id;
  document.getElementById('codeBtn').addEventListener('click', ()=>{
    alert(LANG==='ru' ? 'Демо: ссылка на симуляцию или контакт для показа появится здесь.' : LANG==='hy' ? 'Դեմո. սիմուլյացիայի հղումը կամ ցուցադրության կոնտակտը կհայտնվի այստեղ։' : 'Demo: a simulation link or a contact for a live demo would appear here.');
  });
}
init();
</script>
