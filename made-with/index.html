<html lang="ru">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SimProof — доказано в симуляции</title>

<style>
  :root{
    --paper:#ECEAE3; --paper-2:#E2E0D5; --ink:#171A16; --ink-soft:#5A5E54;
    --line:#c9c7ba; --signal:#3E4DE0; --signal-soft:#e2e5fb; --human:#c97a2e; --human-soft:#f6e6d1;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;line-height:1.5;font-size:17px}
  a{color:inherit}
  .wrap{max-width:1100px;margin:0 auto;padding:0 28px}
  header.top{display:flex;align-items:center;justify-content:space-between;padding:22px 28px;border-bottom:1px solid var(--line)}
  .mark{font-family:'Fraunces',serif;font-weight:700;font-size:22px;letter-spacing:-0.01em;text-decoration:none}
  .top-right{display:flex;align-items:center;gap:18px}
  .lang{display:flex;gap:6px;font-family:'IBM Plex Mono',monospace;font-size:12.5px}
  .lang a{padding:4px 7px;border:1px solid var(--line);border-radius:3px;text-decoration:none;color:var(--ink-soft)}
  .lang a.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .btn-publish{font-family:'IBM Plex Mono',monospace;font-size:13px;background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:3px;text-decoration:none;white-space:nowrap}

  .hero{padding:64px 28px 40px;display:grid;grid-template-columns:1.3fr 1fr;gap:40px;align-items:center}
  .hero h1{font-family:'Fraunces',serif;font-weight:600;font-size:clamp(30px,4.6vw,48px);line-height:1.1;margin:0 0 18px;max-width:15ch}
  .hero p.sub{color:var(--ink-soft);max-width:48ch;font-size:17.5px;margin:0 0 26px}
  .hero .cta{display:flex;gap:14px;flex-wrap:wrap}
  .cta a{text-decoration:none}
  .cta .primary{background:var(--signal);color:#fff;padding:11px 20px;border-radius:3px;font-weight:500}
  .cta .ghost{padding:11px 18px;border:1px solid var(--ink);border-radius:3px}
  .diagram{justify-self:center}

  section.how{padding:20px 28px 56px;border-top:1px solid var(--line)}
  .how-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:34px;margin-top:26px}
  .how-grid h3{font-family:'Fraunces',serif;font-weight:600;font-size:19px;margin:0 0 8px}
  .how-grid p{color:var(--ink-soft);font-size:15px;margin:0}
  .how-num{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--signal);display:block;margin-bottom:10px}

  section.board{padding:8px 28px 20px;border-top:1px solid var(--line)}
  .board-head{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:10px;padding-top:36px}
  .board-head h2{font-family:'Fraunces',serif;font-size:26px;margin:0}
  .count{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--ink-soft)}

  .filters{display:flex;flex-wrap:wrap;gap:10px;margin:22px 0 30px}
  .filters input, .filters select{font-family:'Inter',sans-serif;font-size:14.5px;padding:9px 12px;border:1px solid var(--line);border-radius:3px;background:#fff;color:var(--ink)}
  .filters input{flex:1;min-width:180px}

  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;padding-bottom:70px}
  .card{border:1px solid var(--line);background:#fff;display:flex;flex-direction:column;text-decoration:none;color:var(--ink);position:relative}
  .card:hover{border-color:var(--ink)}
  .thumb{height:150px;position:relative;overflow:hidden;clip-path:polygon(0 0,100% 0,100% 88%,0 100%)}
  .thumb svg{width:100%;height:100%;display:block}
  .thumb .tool-tag{position:absolute;bottom:8px;left:10px;font-family:'IBM Plex Mono',monospace;font-size:10.5px;background:rgba(255,255,255,0.85);padding:2px 6px;border-radius:2px;color:var(--ink)}
  .card-body{padding:16px 18px 18px;border-left:3px solid var(--line);flex:1;display:flex;flex-direction:column}
  .card-body.stage-team{border-left-color:var(--human)}
  .card-body.stage-showing{border-left-color:var(--signal)}
  .card h3{font-family:'Fraunces',serif;font-size:19px;margin:0 0 8px;line-height:1.2}
  .card .problem{font-size:14.5px;color:var(--ink-soft);margin:0 0 12px;flex:1}
  .tags{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--ink-soft);margin:0 0 10px}
  .tags span{margin-right:8px}
  .card-foot{display:flex;justify-content:space-between;align-items:center;font-family:'IBM Plex Mono',monospace;font-size:11.5px}
  .stage-tag{padding:3px 7px;border-radius:2px}
  .stage-tag.team{background:var(--human-soft);color:#8a541c}
  .stage-tag.showing{background:var(--signal-soft);color:#2a37b0}
  .author{color:var(--ink-soft)}

  .empty{padding:40px 0;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;font-size:14px}

  footer{border-top:1px solid var(--line);padding:30px 28px 50px}
  footer p{max-width:62ch;color:var(--ink-soft);font-size:14.5px;margin:0}
  footer .brand{font-family:'Fraunces',serif;font-size:15px;margin-bottom:10px}

  @media(max-width:820px){
    .hero{grid-template-columns:1fr}
    .diagram{display:none}
    .how-grid{grid-template-columns:1fr}
    .grid{grid-template-columns:1fr}
  }
  @media(max-width:560px){
    header.top{flex-wrap:wrap;gap:12px}
  }
</style>
</head>
<body>

<header class="top">

<section class="how wrap">

    </div>
    <div>
      <span class="how-num">02</span>
      <h3 data-i18n="how2Title"></h3>
      <p data-i18n="how2Text"></p>
    </div>
    <div>
      <span class="how-num">03</span>
      <h3 data-i18n="how3Title"></h3>
      <p data-i18n="how3Text"></p>
    </div>
  </div>
</section>

<section class="board wrap" id="board">
  <div class="board-head">
    <h2 data-i18n="boardTitle"></h2>
    <span class="count" id="resultCount"></span>
  </div>

  <div class="filters">
    <input type="text" id="fSearch" data-i18n-ph="filterSearch">
    <select id="fType"></select>
    <select id="fSkill"></select>
    <select id="fStage"></select>
  </div>

  <div class="grid" id="grid"></div>
  <div class="empty" id="emptyMsg" style="display:none" data-i18n="emptyState"></div>
</section>

<footer>
  <div class="wrap" style="padding:0">
    <div class="brand" data-i18n="brandName"></div>
    <p data-i18n="footerNote"></p>
  </div>
</footer>

function t(k){ return I18N[LANG][k] || ''; }

function withLang(url){
  const u = new URL(url, location.href);
  u.searchParams.set('lang', LANG);
  return u.pathname.split('/').pop() + '?' + u.searchParams.toString();
}

function pattern(seed, w=400,h=300){
  const hues = [ ['#3E4DE0','#e2e5fb'], ['#c97a2e','#f6e6d1'], ['#171A16','#dedcd0'] ];
  const pick = hues[seed % hues.length];
  let ticks='';
  for(let i=0;i<8;i++){
    const x = (seed*13 + i*47) % w;
    const y1 = h*0.15, y2 = h*0.85;
    ticks += `<line x1="${x}" y1="${y1}" x2="${x}" y2="${y2}" stroke="${pick[0]}" stroke-width="1" opacity="0.3"/>`;
  }
  const path = `M0 ${h*0.7} Q ${w*0.3} ${((seed*7)%h)}, ${w*0.55} ${h*0.4} T ${w} ${h*0.55}`;
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid slice"><rect width="${w}" height="${h}" fill="${pick[1]}"/>${ticks}<path d="${path}" fill="none" stroke="${pick[0]}" stroke-width="3"/></svg>`;
}

function renderLangSwitch(){
  const el = document.getElementById('langSwitch');
  el.innerHTML = LANGS.map(l => `<a href="${'?'+new URLSearchParams({...Object.fromEntries(params), lang:l})}" class="${l===LANG?'on':''}">${l.toUpperCase()}</a>`).join('');
}

function renderStatic(){
  document.documentElement.lang = LANG;
  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.getAttribute('data-i18n')));
  document.querySelectorAll('[data-i18n-ph]').forEach(el => el.setAttribute('placeholder', t(el.getAttribute('data-i18n-ph'))));
  document.getElementById('publishLink').href = withLang('publish.html');
  document.getElementById('heroPublish').href = withLang('publish.html');
}

function fillFilters(){
  const fType = document.getElementById('fType');
  fType.innerHTML = `<option value="">${t('typeAll')}</option>
    <option value="mechanism">${t('typeMechanism')}</option>
    <option value="energy">${t('typeEnergy')}</option>
    <option value="structural">${t('typeStructural')}</option>
    <option value="fluid">${t('typeFluid')}</option>`;

  const fStage = document.getElementById('fStage');
  fStage.innerHTML = `<option value="">${t('stageAll')}</option>
    <option value="team">${t('stageTeam')}</option>
    <option value="showing">${t('stageShowing')}</option>`;

  const allSkills = [...new Set(WORKS.flatMap(w=>w.tags))].sort();
  const fSkill = document.getElementById('fSkill');
  fSkill.innerHTML = `<option value="">${t('skillAll')}</option>` + allSkills.map(s=>`<option value="${s}">${s}</option>`).join('');
}

function renderGrid(){
  const search = document.getElementById('fSearch').value.trim().toLowerCase();
  const ty = document.getElementById('fType').value;
  const sk = document.getElementById('fSkill').value;
  const st = document.getElementById('fStage').value;

  const filtered = WORKS.filter(w=>{
    if(ty && w.type!==ty) return false;
    if(st && w.stage!==st) return false;
    if(sk && !w.tags.includes(sk)) return false;
    if(search){
      const hay = (w.t[LANG]+' '+w.tags.join(' ')).toLowerCase();
      if(!hay.includes(search)) return false;
    }
    return true;
  });

  document.getElementById('resultCount').textContent = filtered.length + ' / ' + WORKS.length;
  const grid = document.getElementById('grid');
  document.getElementById('emptyMsg').style.display = filtered.length ? 'none':'block';

  grid.innerHTML = filtered.map(w=>{
    const author = PROFILES.find(p=>p.id===w.author);
    return `<a class="card" href="${withLang('work.html')}&id=${w.id}">
      <div class="thumb">${pattern(w.seed)}<span class="tool-tag">${w.tool}</span></div>
      <div class="card-body stage-${w.stage}">
        <h3>${w.t[LANG]}</h3>
        <p class="problem">${w.p[LANG]}</p>
        <div class="tags">${w.tags.map(x=>`<span>#${x}</span>`).join('')}</div>
        <div class="card-foot">
          <span class="stage-tag ${w.stage}">${w.stage==='team'?t('cardTeam'):t('cardShowing')}</span>
          <span class="author">${author.name}</span>
        </div>
      </div>
    </a>`;
  }).join('');
}

function init(){
  renderLangSwitch();
  renderStatic();
  fillFilters();
  renderGrid();
  ['fSearch','fType','fSkill','fStage'].forEach(id=>{
    document.getElementById(id).addEventListener('input', renderGrid);
  });
}
init();
</script>
