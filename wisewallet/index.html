<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WiseWallet — demo</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2312262F'/%3E%3Cpath d='M12 44 L12 30 M24 44 L24 22 M36 44 L36 26 M48 44 L48 14' stroke='%23C9A227' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Armenian:wght@400;500;700&family=Noto+Serif+Armenian:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#12262F;
  --ink-soft:#3A5563;
  --paper:#E7EDEE;
  --card:#FFFFFF;
  --line:#C8D5D8;
  --gold:#C9A227;
  --teal:#2E7D6E;
  --clay:#B4443A;
  --radius:10px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:"Noto Sans Armenian","Segoe UI",system-ui,sans-serif;
  font-size:16px;line-height:1.55;
  font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:"Noto Serif Armenian",Georgia,serif;font-weight:700;letter-spacing:-.01em;margin:0}
h1{font-size:clamp(28px,5vw,44px);line-height:1.1}
h2{font-size:22px;margin-bottom:14px}
h3{font-size:16px;font-weight:600}
a{color:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}

/* header */
header{background:var(--ink);color:#EAF1F2;padding:14px 0}
.hbar{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-family:"Noto Serif Armenian",serif;font-weight:700;font-size:19px}
.logo svg{display:block}
.hbar nav{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lang{display:flex;border:1px solid #3E5A66;border-radius:999px;overflow:hidden}
.lang button{background:transparent;border:0;color:#9FB6BE;padding:5px 13px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--gold);color:var(--ink);font-weight:700}
.hlink{color:#EAF1F2;text-decoration:none;border-bottom:1px solid var(--gold);padding-bottom:1px;font-size:15px}

/* hero */
.hero{background:var(--ink);color:#EAF1F2;padding:26px 0 34px}
.hero p.lead{color:#A9C0C8;max-width:62ch;margin:10px 0 0}
.today{display:grid;grid-template-columns:minmax(240px,1fr) 1fr 1fr;gap:22px;margin-top:26px;align-items:end}
.big{font-family:"Noto Serif Armenian",serif;font-size:clamp(36px,7vw,60px);line-height:1;color:var(--gold)}
.big small{display:block;font-family:"Noto Sans Armenian",sans-serif;font-size:14px;color:#A9C0C8;margin-bottom:6px;font-weight:500}
.mid{font-size:26px;font-weight:700}
.mid small{display:block;font-size:13px;color:#A9C0C8;font-weight:500;margin-bottom:4px}
.verdict{margin-top:18px;font-size:15px;padding:9px 14px;border-radius:var(--radius);display:inline-block}
.verdict.good{background:rgba(46,125,110,.22);color:#8FD8C6;border:1px solid #2E7D6E}
.verdict.bad{background:rgba(180,68,58,.22);color:#F0A9A2;border:1px solid var(--clay)}

/* day strip */
.strip{margin-top:26px}
.striprow{display:flex;gap:2px;align-items:flex-end;height:110px}
.day{flex:1 1 0;position:relative;background:rgba(255,255,255,.10);border-radius:2px 2px 0 0;min-width:4px}
.day i{position:absolute;left:0;right:0;bottom:0;display:block;border-radius:2px 2px 0 0}
.day.today{outline:1px solid var(--gold);outline-offset:1px}
.striplegend{display:flex;gap:18px;font-size:13px;color:#A9C0C8;margin-top:10px;flex-wrap:wrap}
.sw{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:6px;vertical-align:-1px}

/* layout */
main{padding:30px 0 60px}
.grid{display:grid;grid-template-columns:340px 1fr;gap:22px;align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-bottom:22px}
.card > h2{display:flex;align-items:baseline;gap:10px}
.card > h2 code{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--ink-soft);background:var(--paper);padding:2px 7px;border-radius:5px;font-weight:400}
label{display:block;font-size:13px;color:var(--ink-soft);margin:12px 0 5px}
input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:#FBFDFD}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:inline-block;background:var(--ink);color:#fff;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font-weight:500}
.btn:hover{background:#1D3B48}
.btn.gold{background:var(--gold);color:var(--ink);font-weight:700}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.slim{padding:7px 12px;font-size:14px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}

/* categories */
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:7px;margin-top:8px}
.cat{background:#FBFDFD;border:1px solid var(--line);border-radius:8px;padding:8px 9px;cursor:pointer;text-align:left;font-size:13.5px;line-height:1.25}
.cat span{display:block;font-size:17px}
.cat[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.pager{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:14px;color:var(--ink-soft)}

/* tables */
table{width:100%;border-collapse:collapse;font-size:14.5px}
th{text-align:left;font-weight:600;color:var(--ink-soft);font-size:13px;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:7px 8px;border-bottom:1px solid #E9EFF0}
td.num,th.num{text-align:right}
.bar{height:6px;border-radius:3px;background:var(--gold);display:block}
.muted{color:var(--ink-soft)}
.over{color:var(--clay);font-weight:600}
.under{color:var(--teal);font-weight:600}

.charts{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.charts .card{margin-bottom:0}
svg.chart{width:100%;height:auto;display:block}
.legend{display:flex;gap:16px;font-size:13px;color:var(--ink-soft);margin-top:8px;flex-wrap:wrap}

.stack{background:var(--ink);color:#EAF1F2;border-radius:var(--radius);padding:22px}
.stack h2{color:#fff}
.stack p{color:#A9C0C8;max-width:64ch}
.stack a.btn{text-decoration:none;margin-top:8px}

.log{max-height:280px;overflow:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;background:var(--ink);color:#fff;padding:11px 18px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .18s;z-index:9}
.toast.on{opacity:1}
footer{border-top:1px solid var(--line);padding:22px 0;color:var(--ink-soft);font-size:14px}
@media (max-width:900px){
  .grid{grid-template-columns:1fr}
  .charts{grid-template-columns:1fr}
  .today{grid-template-columns:1fr;gap:14px;align-items:start}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header>
  <div class="wrap hbar">
    <div class="logo">
      <svg width="26" height="26" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#1D3B48"/><path d="M12 44V30M24 44V22M36 44V26M48 44V14" stroke="#C9A227" stroke-width="6" stroke-linecap="round"/></svg>
      WiseWallet
    </div>
    <nav>
      <a class="hlink" href="effect.html" data-i="nav.effect">Эффект дневной нормы</a>
      <div class="lang" role="group" aria-label="Language">
        <button data-lang="en" aria-pressed="false">EN</button>
        <button data-lang="ru" aria-pressed="true">RU</button>
        <button data-lang="hy" aria-pressed="false">ՀԱՅ</button>
      </div>
    </nav>
  </div>
</header>

<section class="hero">
  <div class="wrap">
    <h1 data-i="hero.title">Сегодня можно потратить</h1>
    <p class="lead" data-i="hero.lead"></p>

    <div class="today">
      <div class="big"><small data-i="today.can"></small><span id="v-can">—</span></div>
      <div class="mid"><small data-i="today.spent"></small><span id="v-spent">—</span></div>
      <div class="mid"><small data-i="today.tomorrow"></small><span id="v-tomorrow">—</span></div>
    </div>
    <div id="verdict" class="verdict good"></div>

    <div class="strip">
      <div class="striprow" id="strip"></div>
      <div class="striplegend">
        <span><i class="sw" style="background:rgba(255,255,255,.18)"></i><span data-i="strip.norm"></span></span>
        <span><i class="sw" style="background:#2E7D6E"></i><span data-i="strip.under"></span></span>
        <span><i class="sw" style="background:#B4443A"></i><span data-i="strip.over"></span></span>
        <span id="strip-days"></span>
      </div>
    </div>
  </div>
</section>

<main class="wrap">
<div class="grid">

  <!-- LEFT COLUMN -->
  <div>
    <div class="card">
      <h2><span data-i="setup.title"></span> <code>/setbudget /setcurrency /changestartdate</code></h2>
      <label for="f-cur" data-i="setup.currency"></label>
      <select id="f-cur"></select>
      <label for="f-budget" data-i="setup.budget"></label>
      <input id="f-budget" type="number" min="0" step="100">
      <div class="row2">
        <div><label for="f-start" data-i="setup.start"></label><input id="f-start" type="date"></div>
        <div><label for="f-end" data-i="setup.end"></label><input id="f-end" type="date"></div>
      </div>
      <div class="btns">
        <button class="btn gold" id="b-apply" data-i="setup.apply"></button>
        <button class="btn ghost slim" id="b-addbudget" data-i="setup.addbudget"></button>
        <button class="btn ghost slim" id="b-reset" data-i="setup.reset"></button>
      </div>
      <p class="muted" style="font-size:13px;margin-top:12px" data-i="setup.hint"></p>
    </div>

    <div class="card">
      <h2><span data-i="limit.title"></span> <code>/setcategorybudget</code></h2>
      <label for="f-limcat" data-i="limit.category"></label>
      <select id="f-limcat"></select>
      <label for="f-limamt" data-i="limit.amount"></label>
      <input id="f-limamt" type="number" min="0" step="100">
      <div class="btns"><button class="btn slim" id="b-limit" data-i="limit.save"></button></div>
      <div id="limits" style="margin-top:14px"></div>
    </div>

    <div class="card">
      <h2><span data-i="log.title"></span></h2>
      <div class="log"><table><tbody id="log"></tbody></table></div>
      <div class="btns">
        <button class="btn ghost slim" id="b-editlast" data-i="log.editlast"></button>
        <button class="btn ghost slim" id="b-dellast" data-i="log.dellast"></button>
      </div>
    </div>
  </div>

  <!-- RIGHT COLUMN -->
  <div>
    <div class="card">
      <h2><span data-i="add.title"></span> <code>/addexpense /updatelastexpense</code></h2>
      <div class="row2">
        <div><label for="f-amt" data-i="add.amount"></label><input id="f-amt" type="number" min="0" step="10" placeholder="1500"></div>
        <div><label for="f-amtcur" data-i="add.currency"></label><select id="f-amtcur"></select></div>
      </div>
      <label for="f-comment" data-i="add.comment"></label>
      <input id="f-comment" type="text" placeholder="">
      <label data-i="add.pick"></label>
      <div class="cats" id="cats"></div>
      <div class="pager">
        <button class="btn ghost slim" id="b-prev">&laquo; <span data-i="add.prev"></span></button>
        <span id="pageinfo"></span>
        <button class="btn ghost slim" id="b-next"><span data-i="add.next"></span> &raquo;</button>
      </div>
      <div class="btns">
        <button class="btn gold" id="b-add" data-i="add.submit"></button>
        <button class="btn ghost" id="b-update" data-i="add.update"></button>
      </div>
      <div id="analysis" style="margin-top:16px"></div>
    </div>

    <div class="charts">
      <div class="card">
        <h2><span data-i="pie.title"></span> <code>/breakdown</code></h2>
        <svg class="chart" id="pie" viewBox="0 0 320 320" role="img"></svg>
        <div class="legend" id="pielegend"></div>
      </div>
      <div class="card">
        <h2><span data-i="burn.title"></span> <code>/burndown</code></h2>
        <svg class="chart" id="burn" viewBox="0 0 420 300" role="img"></svg>
        <div class="legend">
          <span><i class="sw" style="background:#12262F"></i><span data-i="burn.ideal"></span></span>
          <span><i class="sw" style="background:#C9A227"></i><span data-i="burn.actual"></span></span>
          <span><i class="sw" style="background:#2E7D6E"></i><span data-i="burn.today"></span></span>
        </div>
      </div>
    </div>

    <div class="card" style="margin-top:22px">
      <h2><span data-i="report.title"></span> <code>/report</code></h2>
      <div id="report"></div>
    </div>

    <div class="stack">
      <h2 data-i="teaser.title"></h2>
      <p data-i="teaser.body"></p>
      <p><a class="btn gold" href="effect.html" data-i="teaser.cta"></a></p>
    </div>
  </div>
</div>
</main>

<footer><div class="wrap"><span data-i="footer"></span></div></footer>
<div class="toast" id="toast"></div>

const pad=n=>String(n).padStart(2,"0");

const parse=s=>{const p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2]);};

/* ============ seed ============ */
function seed(){
  const now=new Date();
  const s=new Date(now.getFullYear(),now.getMonth(),1);
  const e=new Date(now.getFullYear(),now.getMonth()+1,0);
  state.start=iso(s);state.end=iso(e);state.budget=400000;state.cur="AMD";
  state.limits={1:70000,5:45000,19:20000};
  state.exp=[];
  const factors=[.72,.61,.88,.45,.79,.66,.9,.52,.7,.83,.58,.75,.64,.86,.5,.69,.77,.6,.81,.55];
  const pick=[1,5,19,4,16,13,6,25,7,24,1,5,3,12,1,19,5,16,9,21];
  let spent=0,fi=0,id=1;
  const total=dayDiff(state.start,state.end)+1;
  for(let i=0;i<total;i++){
    const d=new Date(s.getFullYear(),s.getMonth(),s.getDate()+i);
    if(iso(d)>todayIso())break;
    const left=total-i;
    const norm=(state.budget-spent)/left;
    const f=factors[fi%factors.length];fi++;
    let amount=Math.round(norm*(iso(d)===todayIso()?f*0.4:f)/50)*50;
    if(amount<=0)continue;
    const c1=pick[i%pick.length];
    const a1=Math.round(amount*0.6/10)*10, a2=amount-a1;
    state.exp.push({id:id++,cat:c1,amt:a1,oamt:a1,ocur:state.cur,date:iso(d),note:""});
    if(a2>0)state.exp.push({id:id++,cat:pick[(i+4)%pick.length],amt:a2,oamt:a2,ocur:state.cur,date:iso(d),note:""});
    spent+=amount;
  }
}

/* ============ math (mirrors the bot) ============ */
function clampToday(){const t0=todayIso();if(t0<state.start)return state.start;if(t0>state.end)return state.end;return t0;}
function totalIn(from,to){return state.exp.filter(x=>x.date>=from&&x.date<=to).reduce((s,x)=>s+x.amt,0);}
function catTotal(id){return state.exp.filter(x=>x.cat===id&&x.date>=state.start&&x.date<=state.end).reduce((s,x)=>s+x.amt,0);}
function stats(){
  const today=clampToday();
  const totalDays=dayDiff(state.start,state.end)+1;
  const spentAll=totalIn(state.start,state.end);
  const spentToday=totalIn(today,today);
  const leftDays=Math.max(1,dayDiff(today,state.end)+1);
  const canToday=(state.budget-spentAll+spentToday)/leftDays;
  const tomorrow=leftDays>1?(state.budget-spentAll)/(leftDays-1):0;
  return {today,totalDays,spentAll,spentToday,leftDays,canToday,tomorrow,remaining:state.budget-spentAll};
}
/* daily allowance recomputed for each day of the period */
function normSeries(){
  const total=dayDiff(state.start,state.end)+1,out=[],b=parse(state.start),today=clampToday();
  let spent=0,flat=null;
  for(let i=0;i<total;i++){
    const d=iso(new Date(b.getFullYear(),b.getMonth(),b.getDate()+i));
    const future=d>today;
    /* past and today: the allowance as it really was; ahead: the level held if every day spends exactly its allowance */
    const norm=future?flat:(state.budget-spent)/(total-i);
    if(d===today)flat=norm;
    const day=totalIn(d,d);
    out.push({date:d,norm:Math.max(0,norm||0),spent:day,future});
    spent+=day;
  }
  return out;
}

function renderHero(){
  const s=stats();
  document.getElementById("v-can").textContent=money(s.canToday);
  document.getElementById("v-spent").textContent=money(s.spentToday);
  document.getElementById("v-tomorrow").textContent=money(s.tomorrow);
  const v=document.getElementById("verdict");
  const good=s.spentToday<=s.canToday;
  v.className="verdict "+(good?"good":"bad");
  v.textContent=good?t("verdict.good"):t("verdict.bad");
  document.getElementById("strip-days").textContent=t("days.left").replace("{n}",s.leftDays);

  const ns=normSeries(),maxv=Math.max(...ns.map(x=>Math.max(x.norm,x.spent)),1);
  document.getElementById("strip").innerHTML=ns.map(x=>{
    const h=(x.norm/maxv*100).toFixed(1), sh=(Math.min(x.spent,maxv)/maxv*100).toFixed(1);
    const col=x.spent>x.norm?"#B4443A":"#2E7D6E";
    return `<div class="day${x.date===clampToday()?" today":""}" style="height:${h}%" title="${x.date} · ${money(x.norm)} / ${money(x.spent)}">
      <i style="height:${x.norm>0?(Math.min(x.spent,x.norm*1.6)/x.norm*100).toFixed(1):0}%;max-height:100%;background:${col};opacity:${x.future?.25:1}"></i></div>`;
  }).join("");
}

}

    return `<tr><td>${x.cat.e} ${x.cat[state.lang]}</td>
      <td class="num">${money(x.amt)}</td>
      <td class="num muted">${(x.amt/tot*100).toFixed(1)}%<span class="bar" style="width:${(x.amt/list[0].amt*100).toFixed(1)}%"></span></td>
      <td class="num ${lim?(x.amt>lim?"over":"under"):"muted"}">${lim?money(lim):"—"}</td></tr>`;}).join("");
  document.getElementById("report").innerHTML=head+
    `<table style="margin-top:14px"><thead><tr><th>${t("report.cat")}</th><th class="num">${t("report.amount")}</th><th class="num">${t("report.share")}</th><th class="num">${t("report.limit")}</th></tr></thead><tbody>${rows}</tbody></table>`;
}
function renderPie(){
  const list=catBreakdown().slice(0,10),svg=document.getElementById("pie");
  if(!list.length){svg.innerHTML=`<text x="160" y="160" text-anchor="middle" fill="#7B929B" font-size="13">—</text>`;document.getElementById("pielegend").innerHTML="";return;}
  const tot=list.reduce((a,b)=>a+b.amt,0);let ang=-Math.PI/2,out="";
  if(list.length===1){
    out=`<circle cx="160" cy="160" r="101" fill="none" stroke="${COLORS[0]}" stroke-width="58"/>`;
  } else list.forEach((x,i)=>{
    const a=x.amt/tot*Math.PI*2,r=130,ri=72,cx=160,cy=160,e=ang+a;
    const p=(rr,an)=>[cx+rr*Math.cos(an),cy+rr*Math.sin(an)];
    const [x1,y1]=p(r,ang),[x2,y2]=p(r,e),[x3,y3]=p(ri,e),[x4,y4]=p(ri,ang);
    out+=`<path d="M${x1} ${y1} A${r} ${r} 0 ${a>Math.PI?1:0} 1 ${x2} ${y2} L${x3} ${y3} A${ri} ${ri} 0 ${a>Math.PI?1:0} 0 ${x4} ${y4} Z" fill="${COLORS[i%COLORS.length]}" stroke="#fff" stroke-width="2"/>`;
    ang=e;
  });
  out+=`<text x="160" y="153" text-anchor="middle" font-size="13" fill="#3A5563">${t("report.expenses")}</text>
        <text x="160" y="177" text-anchor="middle" font-size="17" font-weight="700" fill="#12262F">${money(tot)}</text>`;
  svg.innerHTML=out;
  document.getElementById("pielegend").innerHTML=list.map((x,i)=>`<span><i class="sw" style="background:${COLORS[i%COLORS.length]}"></i>${x.cat.e} ${x.cat[state.lang]} · ${(x.amt/tot*100).toFixed(0)}%</span>`).join("");
}
function renderBurn(){
  const svg=document.getElementById("burn"),W=420,H=300,L=52,R=12,T=14,B=30;
  const total=dayDiff(state.start,state.end)+1,daily=state.budget/total;
  const ns=normSeries();let rem=state.budget;const actual=[];
  ns.forEach((d,i)=>{if(!d.future){rem-=d.spent;actual.push({i,v:Math.max(0,rem)});}});
  const maxv=state.budget||1;
  const X=i=>L+(W-L-R)*(total<=1?0:i/(total-1));
  const Y=v=>T+(H-T-B)*(1-v/maxv);
  const ideal=ns.map((_,i)=>`${X(i)},${Y(Math.max(0,state.budget-daily*i))}`).join(" ");
  const act=actual.map(a=>`${X(a.i)},${Y(a.v)}`).join(" ");
  const ti=ns.findIndex(d=>d.date===clampToday());
  let g="";for(let k=0;k<=4;k++){const v=maxv*k/4;g+=`<line x1="${L}" y1="${Y(v)}" x2="${W-R}" y2="${Y(v)}" stroke="#E1E9EA"/><text x="${L-7}" y="${Y(v)+4}" text-anchor="end" font-size="10" fill="#7B929B">${Math.round(v/1000)}k</text>`;}
  svg.innerHTML=g+
   `<polyline points="${ideal}" fill="none" stroke="#12262F" stroke-width="1.6" stroke-dasharray="5 4"/>
    <polyline points="${act}" fill="none" stroke="#C9A227" stroke-width="2.6" stroke-linejoin="round"/>
    ${ti>=0?`<line x1="${X(ti)}" y1="${T}" x2="${X(ti)}" y2="${H-B}" stroke="#2E7D6E" stroke-width="1.4"/>`:""}
    <text x="${L}" y="${H-10}" font-size="10" fill="#7B929B">${state.start.slice(5)}</text>
    <text x="${W-R}" y="${H-10}" font-size="10" fill="#7B929B" text-anchor="end">${state.end.slice(5)}</text>`;
}
function renderAll(){applyI18n();fillSelects();renderCats();renderHero();renderLimits();renderLog();renderReport();renderPie();renderBurn();}

/* ============ actions ============ */
let toastTimer;
function toast(msg){const el=document.getElementById("toast");el.textContent=msg;el.classList.add("on");clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove("on"),1900);}

function analysisFor(catId,amount){
  const s=stats(),c=catById(catId),box=document.getElementById("analysis");
  const lines=[];
  lines.push(t("an.spent").replace("{a}",money(amount)).replace("{c}",c[state.lang]));
  const lim=state.limits[catId];
  if(lim){const left=lim-catTotal(catId);
    lines.push(t("an.catleft").replace("{a}",money(left)));
    if(left<0)lines.push(t("an.catover"));}
  if(s.remaining<0)lines.push(t("an.over"));else lines.push(t("an.left").replace("{a}",money(s.remaining)));
  const dir=s.tomorrow>=s.canToday?"↑":"↓";
  lines.push(t("an.pace").replace("{a}",money(s.tomorrow)).replace("{d}",dir));
  box.innerHTML=`<div style="border-left:3px solid var(--gold);padding:8px 0 8px 12px">`+lines.map(l=>`<div>${l}</div>`).join("")+`</div>`;
}
function readForm(){
  const amt=parseFloat(document.getElementById("f-amt").value);
  const cur=document.getElementById("f-amtcur").value;
  const note=document.getElementById("f-comment").value.trim();
  if(!state.sel){toast(t("t.needcat"));return null;}
  if(!(amt>0)){toast(t("t.needamt"));return null;}
  return {amt,cur,note};
}
function bind(){
  document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>{state.lang=b.dataset.lang;renderAll();});
  document.getElementById("b-prev").onclick=()=>{state.page=(state.page+1)%2;renderCats();};
  document.getElementById("b-next").onclick=()=>{state.page=(state.page+1)%2;renderCats();};
  document.getElementById("b-apply").onclick=()=>{
    const b=parseFloat(document.getElementById("f-budget").value)||0;
    const s=document.getElementById("f-start").value,e=document.getElementById("f-end").value;
    const newCur=document.getElementById("f-cur").value;
    if(newCur!==state.cur){
      state.exp.forEach(x=>{x.amt=conv(state.cur,newCur,x.amt);});
      Object.keys(state.limits).forEach(k=>state.limits[k]=conv(state.cur,newCur,state.limits[k]));
      state.budget=conv(state.cur,newCur,b);state.cur=newCur;
    } else state.budget=b;
    if(s&&e&&s<=e){state.start=s;state.end=e;}
    renderAll();toast(t("t.applied"));
  };
  document.getElementById("b-addbudget").onclick=()=>{
    const add=parseFloat(prompt("+ "+state.cur,"20000"));
    if(add>0){state.budget+=add;renderAll();toast(t("t.addbudget"));}
  };
  document.getElementById("b-reset").onclick=()=>{state.exp=[];state.limits={};state.budget=0;state.sel=null;document.getElementById("analysis").innerHTML="";renderAll();toast(t("t.reset"));};
  document.getElementById("b-limit").onclick=()=>{
    const id=+document.getElementById("f-limcat").value,a=parseFloat(document.getElementById("f-limamt").value);
    if(a>0)state.limits[id]=a;else delete state.limits[id];
    renderLimits();renderReport();toast(t("t.limit"));
  };
  document.getElementById("b-add").onclick=()=>{
    const f=readForm();if(!f)return;
    const amt=conv(f.cur,state.cur,f.amt);
    state.exp.push({id:Date.now(),cat:state.sel,amt,oamt:f.amt,ocur:f.cur,date:clampToday(),note:f.note});
    renderAll();analysisFor(state.sel,amt);toast(t("t.added"));
    document.getElementById("f-amt").value="";document.getElementById("f-comment").value="";
  };
  document.getElementById("b-update").onclick=()=>{
    if(!state.exp.length){toast(t("t.needlog"));return;}
    const f=readForm();if(!f)return;
    const last=[...state.exp].sort((a,b)=>a.date.localeCompare(b.date)||a.id-b.id).pop();
    const amt=conv(f.cur,state.cur,f.amt);
    Object.assign(last,{cat:state.sel,amt,oamt:f.amt,ocur:f.cur,note:f.note});
    renderAll();analysisFor(state.sel,amt);toast(t("t.updated"));
  };
  document.getElementById("b-editlast").onclick=()=>{
    if(!state.exp.length){toast(t("t.needlog"));return;}
    const last=[...state.exp].sort((a,b)=>a.date.localeCompare(b.date)||a.id-b.id).pop();
    state.sel=last.cat;document.getElementById("f-amt").value=last.oamt.toFixed(2);
    document.getElementById("f-amtcur").value=last.ocur;document.getElementById("f-comment").value=last.note;
    renderCats();
  };
  document.getElementById("b-dellast").onclick=()=>{
    if(!state.exp.length){toast(t("t.needlog"));return;}
    const sorted=[...state.exp].sort((a,b)=>a.date.localeCompare(b.date)||a.id-b.id);
    const last=sorted[sorted.length-1];
    state.exp=state.exp.filter(x=>x!==last);renderAll();toast(t("t.deleted"));
  };
}
seed();bind();renderAll();
</script>
