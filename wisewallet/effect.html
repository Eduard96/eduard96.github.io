<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WiseWallet — эффект дневной нормы</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2312262F'/%3E%3Cpath d='M12 44 L12 30 M24 44 L24 22 M36 44 L36 26 M48 44 L48 14' stroke='%23C9A227' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Armenian:wght@400;500;700&family=Noto+Serif+Armenian:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#12262F;--ink-soft:#3A5563;--paper:#E7EDEE;--card:#fff;--line:#C8D5D8;--gold:#C9A227;--teal:#2E7D6E;--clay:#B4443A;--radius:10px}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:"Noto Sans Armenian","Segoe UI",system-ui,sans-serif;font-size:16px;line-height:1.6;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:"Noto Serif Armenian",Georgia,serif;font-weight:700;margin:0;letter-spacing:-.01em}
h1{font-size:clamp(28px,5.5vw,48px);line-height:1.08}
h2{font-size:23px;margin-bottom:12px}
h3{font-size:16px;font-weight:600;margin-bottom:6px}
.wrap{max-width:1000px;margin:0 auto;padding:0 20px}
header{background:var(--ink);color:#EAF1F2;padding:14px 0}
.hbar{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-family:"Noto Serif Armenian",serif;font-weight:700;font-size:19px}
.hbar nav{margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.hlink{color:#EAF1F2;text-decoration:none;border-bottom:1px solid var(--gold);padding-bottom:1px;font-size:15px}
.lang{display:flex;border:1px solid #3E5A66;border-radius:999px;overflow:hidden}
.lang button{background:transparent;border:0;color:#9FB6BE;padding:5px 13px;cursor:pointer;font:inherit}
.lang button[aria-pressed="true"]{background:var(--gold);color:var(--ink);font-weight:700}
.hero{background:var(--ink);color:#EAF1F2;padding:30px 0 40px}
.hero p{color:#A9C0C8;max-width:66ch}
.formula{margin-top:26px;background:rgba(201,162,39,.10);border:1px solid rgba(201,162,39,.45);border-radius:var(--radius);padding:18px 20px;display:inline-block}
.formula .f{font-family:"Noto Serif Armenian",Georgia,serif;font-size:clamp(20px,4vw,30px);color:var(--gold);white-space:nowrap}
.formula .fn{color:#A9C0C8;font-size:14px;margin-top:8px;max-width:56ch}
main{padding:34px 0 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px;margin-bottom:24px}
p{margin:0 0 12px}
p.body{max-width:70ch}
label{display:block;font-size:13px;color:var(--ink-soft);margin:14px 0 5px}
input[type=range]{width:100%;accent-color:var(--gold)}
input[type=number]{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:#FBFDFD;font:inherit}
.controls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px}
.val{font-weight:700;color:var(--ink)}
svg.chart{width:100%;height:auto;display:block;margin-top:16px}
.legend{display:flex;gap:16px;font-size:13px;color:var(--ink-soft);margin-top:8px;flex-wrap:wrap}
.sw{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:6px;vertical-align:-1px}
table{width:100%;border-collapse:collapse;font-size:14.5px;margin-top:8px}
th{text-align:left;font-size:13px;color:var(--ink-soft);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:7px 8px;border-bottom:1px solid #E9EFF0}
td.num,th.num{text-align:right}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:18px}
.kpi{border-left:3px solid var(--gold);padding-left:12px}
.kpi b{display:block;font-size:24px;font-family:"Noto Serif Armenian",serif}
.kpi span{font-size:13px;color:var(--ink-soft)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.note{border-left:3px solid var(--clay);padding-left:14px;color:var(--ink-soft)}
footer{border-top:1px solid var(--line);padding:22px 0;color:var(--ink-soft);font-size:14px}
a.btn{display:inline-block;background:var(--gold);color:var(--ink);text-decoration:none;font-weight:700;border-radius:8px;padding:10px 16px}
@media (max-width:840px){.controls,.two,.kpis{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header><div class="wrap hbar">
  <div class="logo"><svg width="26" height="26" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#1D3B48"/><path d="M12 44V30M24 44V22M36 44V26M48 44V14" stroke="#C9A227" stroke-width="6" stroke-linecap="round"/></svg> WiseWallet</div>
  <nav>
    <a class="hlink" href="index.html" data-i="nav.back"></a>
    <div class="lang" role="group" aria-label="Language">
      <button data-lang="en" aria-pressed="false">EN</button>
      <button data-lang="ru" aria-pressed="true">RU</button>
      <button data-lang="hy" aria-pressed="false">ՀԱՅ</button>
    </div>
  </nav>
</div></header>

<section class="hero"><div class="wrap">
  <h1 data-i="h1"></h1>
  <p data-i="lead"></p>
  <div class="formula">
    <div class="f">N<sub>next</sub> = N<sub>now</sub> · (D − k) / (D − 1)</div>
    <div class="fn" data-i="formula.note"></div>
  </div>
</div></section>

<main class="wrap">

  <div class="card">
    <h2 data-i="sim.title"></h2>
    <p class="body" data-i="sim.intro"></p>
    <div class="controls">
      <div>
        <label for="c-days"><span data-i="sim.days"></span>: <span class="val" id="l-days"></span></label>
        <input id="c-days" type="range" min="7" max="45" value="30">
      </div>
      <div>
        <label for="c-k"><span data-i="sim.k"></span>: <span class="val" id="l-k"></span></label>
        <input id="c-k" type="range" min="50" max="130" value="85">
      </div>
      <div>
        <label for="c-budget" data-i="sim.budget"></label>
        <input id="c-budget" type="number" min="1000" step="1000" value="400000">
      </div>
    </div>

    <svg class="chart" id="normchart" viewBox="0 0 760 340" role="img"></svg>
    <div class="legend">
      <span><i class="sw" style="background:#C9A227"></i><span data-i="leg.you"></span></span>
      <span><i class="sw" style="background:#12262F"></i><span data-i="leg.even"></span></span>
      <span><i class="sw" style="background:#B4443A"></i><span data-i="leg.over"></span></span>
    </div>

    <div class="kpis">
      <div class="kpi"><b id="k-first"></b><span data-i="kpi.first"></span></div>
      <div class="kpi"><b id="k-last"></b><span data-i="kpi.last"></span></div>
      <div class="kpi"><b id="k-saved"></b><span data-i="kpi.saved"></span></div>
    </div>
  </div>

  <div class="two">
    <div class="card">
      <h2 data-i="lev.title"></h2>
      <p class="body" data-i="lev.body"></p>
      <table><thead><tr><th data-i="lev.d"></th><th class="num" data-i="lev.gain"></th><th class="num" data-i="lev.x"></th></tr></thead><tbody id="levtable"></tbody></table>
    </div>
    <div class="card">
      <h2 data-i="half.title"></h2>
      <p class="body" data-i="half.body"></p>
      <svg class="chart" id="levchart" viewBox="0 0 360 220" role="img"></svg>
      <p class="note" style="margin-top:14px" data-i="half.note"></p>
    </div>
  </div>

  <div class="card">
    <h2 data-i="psy.title"></h2>
    <div class="two">
      <div>
        <h3 data-i="psy.a.t"></h3><p class="body" data-i="psy.a.b"></p>
        <h3 data-i="psy.b.t"></h3><p class="body" data-i="psy.b.b"></p>
        <h3 data-i="psy.c.t"></h3><p class="body" data-i="psy.c.b"></p>
      </div>
      <div>
        <h3 data-i="psy.d.t"></h3><p class="body" data-i="psy.d.b"></p>
        <h3 data-i="psy.e.t"></h3><p class="body" data-i="psy.e.b"></p>
        <h3 data-i="psy.f.t"></h3><p class="body" data-i="psy.f.b"></p>
      </div>
    </div>
    <p style="margin-top:20px"><a class="btn" href="index.html" data-i="psy.cta"></a></p>
  </div>

</main>

<footer><div class="wrap"><span data-i="footer"></span></div></footer>

<script>

let lang="ru";
const t=k=>I[lang][k]!==undefined?I[lang][k]:k;
const fmt=a=>new Intl.NumberFormat(lang==="hy"?"hy-AM":lang==="ru"?"ru-RU":"en-US",{maximumFractionDigits:0}).format(Math.round(a));

function series(days,budget,k){
  const out=[];let rem=budget;
  for(let i=0;i<days;i++){const D=days-i;const norm=rem/D;out.push(norm);rem-=norm*k;}
  return out;
}
function drawNorm(){
  const days=+document.getElementById("c-days").value;
  const k=+document.getElementById("c-k").value/100;
  const budget=+document.getElementById("c-budget").value||1;
  document.getElementById("l-days").textContent=days;
  document.getElementById("l-k").textContent=Math.round(k*100)+"%";

  const you=series(days,budget,k),even=series(days,budget,1),over=series(days,budget,1.15);
  const W=760,H=340,L=64,R=16,T=16,B=32;
  const maxv=Math.max(...you,...even,...over)*1.08;
  const X=i=>L+(W-L-R)*(days<=1?0:i/(days-1));
  const Y=v=>T+(H-T-B)*(1-v/maxv);
  const line=(arr,color,w,dash)=>`<polyline points="${arr.map((v,i)=>X(i)+","+Y(v)).join(" ")}" fill="none" stroke="${color}" stroke-width="${w}" ${dash?'stroke-dasharray="5 4"':""} stroke-linejoin="round"/>`;
  let g="";
  for(let i=0;i<=4;i++){const v=maxv*i/4;g+=`<line x1="${L}" y1="${Y(v)}" x2="${W-R}" y2="${Y(v)}" stroke="#E1E9EA"/><text x="${L-8}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="#7B929B">${fmt(v)}</text>`;}
  const mid=Math.floor(days/2);
  g+=`<line x1="${X(mid)}" y1="${T}" x2="${X(mid)}" y2="${H-B}" stroke="#C8D5D8" stroke-dasharray="3 5"/>`;
  document.getElementById("normchart").innerHTML=g+line(even,"#12262F",1.6,true)+line(over,"#B4443A",1.8,false)+line(you,"#C9A227",3,false)+
    `<text x="${L}" y="${H-9}" font-size="11" fill="#7B929B">1</text>
     <text x="${X(mid)}" y="${H-9}" font-size="11" fill="#7B929B" text-anchor="middle">${mid+1}</text>
     <text x="${W-R}" y="${H-9}" font-size="11" fill="#7B929B" text-anchor="end">${days}</text>`;

  document.getElementById("k-first").textContent=fmt(you[0]);
  document.getElementById("k-last").textContent=fmt(you[days-1]);
  const g2=(you[days-1]/you[0]-1)*100;
  document.getElementById("k-saved").textContent=(g2>=0?"+":"")+g2.toFixed(0)+"%";
  document.getElementById("k-saved").style.color=g2>=0?"#2E7D6E":"#B4443A";
}
function drawLeverage(){
  const rows=[30,20,14,10,7,5,3,2];
  const base=1000/29;
  document.getElementById("levtable").innerHTML=rows.map(D=>{
    const gain=1000/(D-1);
    return `<tr><td>${D}</td><td class="num">+${fmt(gain)}</td><td class="num" style="color:${gain/base>3?"#B4443A":"#3A5563"}">×${(gain/base).toFixed(1)}</td></tr>`;}).join("");

  const W=360,H=220,L=44,R=10,T=12,B=26;
  const pts=[];for(let D=30;D>=2;D--)pts.push({D,v:1000/(D-1)});
  const maxv=Math.max(...pts.map(p=>p.v));
  const X=i=>L+(W-L-R)*i/(pts.length-1);
  const Y=v=>T+(H-T-B)*(1-v/maxv);
  let g="";for(let i=0;i<=3;i++){const v=maxv*i/3;g+=`<line x1="${L}" y1="${Y(v)}" x2="${W-R}" y2="${Y(v)}" stroke="#E1E9EA"/><text x="${L-6}" y="${Y(v)+4}" font-size="10" fill="#7B929B" text-anchor="end">${fmt(v)}</text>`;}
  const half=pts.findIndex(p=>p.D===15);
  g+=`<line x1="${X(half)}" y1="${T}" x2="${X(half)}" y2="${H-B}" stroke="#C8D5D8" stroke-dasharray="3 5"/>`;
  document.getElementById("levchart").innerHTML=g+
   `<polyline points="${pts.map((p,i)=>X(i)+","+Y(p.v)).join(" ")}" fill="none" stroke="#C9A227" stroke-width="3"/>
    <text x="${L}" y="${H-8}" font-size="10" fill="#7B929B">30</text>
    <text x="${X(half)}" y="${H-8}" font-size="10" fill="#7B929B" text-anchor="middle">15</text>
    <text x="${W-R}" y="${H-8}" font-size="10" fill="#7B929B" text-anchor="end">2</text>`;
}
function applyI18n(){
  document.documentElement.lang=lang;
  document.querySelectorAll("[data-i]").forEach(el=>el.textContent=t(el.dataset.i));
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.lang===lang)));
}
document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>{lang=b.dataset.lang;applyI18n();drawNorm();drawLeverage();});
["c-days","c-k","c-budget"].forEach(id=>document.getElementById(id).addEventListener("input",drawNorm));
applyI18n();drawNorm();drawLeverage();
</script>
